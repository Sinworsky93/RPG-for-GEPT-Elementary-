<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEPT-CORE: 核心突破</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'VT323', 'Noto Sans TC', monospace;
            background-color: #000;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 60px 120px, #0ff, transparent),
                radial-gradient(1.5px 1.5px at 100px 60px, #f0f, transparent),
                radial-gradient(1.5px 1.5px at 160px 140px, #ff0, transparent),
                radial-gradient(2px 2px at 200px 20px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 240px 100px, #0ff, transparent);
            background-repeat: repeat;
            background-size: 260px 200px;
            animation: starDrift 60s linear infinite;
            color: #00ffcc;
            letter-spacing: 1px;
            user-select: none;
        }

        @keyframes starDrift {
            from { background-position: 0 0; }
            to { background-position: -260px 200px; }
        }

        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .arcade-frame {
            animation: neonCycle 6s linear infinite;
        }

        @keyframes neonCycle {
            0%   { border-color: #00ffcc; box-shadow: 0 0 30px rgba(0,255,204,0.5), inset 0 0 20px rgba(0,255,204,0.15); }
            25%  { border-color: #ff00ff; box-shadow: 0 0 30px rgba(255,0,255,0.5), inset 0 0 20px rgba(255,0,255,0.15); }
            50%  { border-color: #ffee00; box-shadow: 0 0 30px rgba(255,238,0,0.5), inset 0 0 20px rgba(255,238,0,0.15); }
            75%  { border-color: #39ff14; box-shadow: 0 0 30px rgba(57,255,20,0.5), inset 0 0 20px rgba(57,255,20,0.15); }
            100% { border-color: #00ffcc; box-shadow: 0 0 30px rgba(0,255,204,0.5), inset 0 0 20px rgba(0,255,204,0.15); }
        }

        .title-neon {
            background: linear-gradient(90deg, #00ffcc, #ff00ff, #ffee00, #39ff14, #00ffcc);
            background-size: 400% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: titleFlow 4s linear infinite, pulseGlow 2s ease-in-out infinite;
        }
        @keyframes titleFlow { to { background-position: -400% center; } }
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(0,255,204,0.7)); }
            50% { filter: drop-shadow(0 0 20px rgba(255,0,255,0.8)); }
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .msg-pop {
            animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
        }
        @keyframes popIn {
            0% { transform: scale(0.4) rotate(-5deg); opacity: 0; }
            60% { transform: scale(1.15) rotate(2deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .warp-overlay {
            position: absolute; inset: 0; z-index: 15; pointer-events: none;
            background: repeating-conic-gradient(from 0deg, rgba(0,255,204,0.25) 0deg 8deg, transparent 8deg 16deg);
            opacity: 0;
        }
        .warp-active {
            animation: warpBurst 0.6s ease-out;
        }
        @keyframes warpBurst {
            0% { opacity: 0; transform: scale(0.3) rotate(0deg); }
            40% { opacity: 1; }
            100% { opacity: 0; transform: scale(2.5) rotate(180deg); }
        }

        .btn-pixel {
            border: 2px solid #00ffcc;
            background-color: rgba(0, 50, 40, 0.6);
            color: #00ffcc;
            text-transform: uppercase;
            transition: all 0.1s;
            box-shadow: 4px 4px 0px #005544;
            text-shadow: 1px 1px 0px #000;
        }
        .btn-pixel:hover:not(:disabled) {
            background-color: #00ffcc;
            color: #000;
            box-shadow: 2px 2px 0px #005544;
            transform: translate(2px, 2px);
        }
        .btn-pixel:disabled {
            border-color: #555;
            color: #555;
            background-color: #222;
            box-shadow: none;
            cursor: not-allowed;
        }

        .enemy-sprite { filter: drop-shadow(0 0 10px rgba(0, 255, 204, 0.5)); }

        .laser-shot {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 6px;
            height: 45%;
            background: linear-gradient(to top, transparent, #00ffcc 40%, #ffffff);
            box-shadow: 0 0 14px 4px rgba(0,255,204,0.9);
            transform: translateX(-50%) scaleY(0);
            transform-origin: bottom;
            opacity: 0;
            pointer-events: none;
            z-index: 15;
            border-radius: 4px;
        }
        .laser-shot.firing {
            animation: laserFire 0.28s ease-out forwards;
        }
        @keyframes laserFire {
            0%   { transform: translateX(-50%) scaleY(0); opacity: 1; }
            55%  { transform: translateX(-50%) scaleY(1); opacity: 1; }
            100% { transform: translateX(-50%) scaleY(1); opacity: 0; }
        }

        .combo-pop {
            animation: comboPop 0.4s cubic-bezier(.34,1.56,.64,1);
        }
        @keyframes comboPop {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .boss-warning-banner {
            animation: warnPulse 0.35s ease-in-out infinite alternate;
        }
        @keyframes warnPulse {
            from { opacity: 0.7; transform: translateX(-50%) scale(1); }
            to { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        .boss-lunge {
            animation: bossLunge 0.7s ease-in-out infinite;
        }
        @keyframes bossLunge {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255,0,0,0.5)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 25px rgba(255,0,0,0.9)); }
        }

        .hit-spark {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 16;
        }
        .hit-spark.active::before {
            content: "💥";
            position: absolute;
            top: 38%; left: 50%;
            font-size: 2.5rem;
            animation: sparkPop 0.4s ease-out forwards;
        }
        @keyframes sparkPop {
            0%   { transform: translate(-50%, -50%) scale(0.2) rotate(-15deg); opacity: 0; }
            45%  { transform: translate(-50%, -50%) scale(1.4) rotate(10deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.7) rotate(15deg); opacity: 0; }
        }

        .dodge-active {
            animation: dodgeJuke 0.45s ease-in-out;
        }
        @keyframes dodgeJuke {
            0%   { transform: translateX(0) skewX(0); filter: brightness(1); }
            22%  { transform: translateX(-22px) skewX(-3deg); filter: brightness(1.5); }
            50%  { transform: translateX(16px) skewX(2deg); filter: brightness(1.1); }
            75%  { transform: translateX(-6px) skewX(0); }
            100% { transform: translateX(0) skewX(0); filter: brightness(1); }
        }
        .dodge-text {
            position: absolute;
            top: 45%; left: 50%;
            font-size: 2rem;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 12px rgba(0,255,204,0.9), 2px 2px 0 #000;
            z-index: 25;
            pointer-events: none;
            letter-spacing: 4px;
            font-family: 'VT323', monospace;
        }
        .dodge-text.pop {
            animation: dodgeTextPop 0.6s ease-out forwards;
        }
        @keyframes dodgeTextPop {
            0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.25); }
            100% { opacity: 0; transform: translate(-90%, -140%) scale(1); }
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen overflow-hidden m-0">
    <div class="crt arcade-frame relative w-full max-w-4xl h-[95vh] sm:h-[85vh] bg-gray-900 border-4 p-4 flex flex-col shadow-[0_0_30px_rgba(0,255,204,0.3)] overflow-hidden">

        <!-- 系統開始畫面 -->
        <div id="screen-start" class="flex-1 flex flex-col items-center justify-center text-center space-y-8 z-10">
            <h1 class="text-6xl sm:text-8xl font-bold title-neon">GEPT-CORE</h1>
            <p class="text-2xl text-teal-300">>> 終端機連線中... 載入初級英檢資料庫...</p>
            <div class="w-full max-w-sm space-y-6">
                <input type="text" id="player-name" placeholder="輸入機器人型號 (Name)" class="w-full bg-black border-2 border-[#00ffcc] text-[#00ffcc] p-3 focus:outline-none focus:bg-gray-800 text-center text-3xl placeholder-teal-700 uppercase">
                <button onclick="startGame()" class="btn-pixel w-full py-4 text-3xl font-bold font-sans">啟動電源 (POWER ON)</button>
            </div>
        </div>

        <!-- 遊戲主畫面 -->
        <div id="screen-game" class="hidden flex-1 flex flex-col z-10 relative min-h-0">
            <div id="warp-overlay" class="warp-overlay"></div>

            <!-- 暫停疊加層（蓋住所有畫面與按鈕，計時器同步停止） -->
            <div id="pause-overlay" class="hidden absolute inset-0 z-40 bg-black bg-opacity-90 flex flex-col items-center justify-center space-y-6 font-sans text-center p-6">
                <h2 class="text-4xl sm:text-5xl font-bold text-teal-300 tracking-widest">⏸ 遊戲暫停 (PAUSED)</h2>
                <p class="text-lg sm:text-xl text-gray-300 max-w-md leading-relaxed">計時器已經停止，慢慢來，準備好後按下面的按鈕繼續！</p>
                <button onclick="togglePause()" class="btn-pixel px-8 py-3 text-2xl font-bold">▶ 繼續遊戲 (RESUME)</button>
            </div>

            <!-- 系統訊息疊加層（蓋住整個遊戲畫面，訊息再長都放得下） -->
            <div id="sys-message" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-90 hidden z-30 border-2 border-teal-500 p-4 overflow-y-auto">
                <h2 id="sys-message-text" class="text-3xl sm:text-5xl font-bold text-center leading-relaxed font-sans"></h2>
            </div>

            <!-- 頂部資訊列 -->
            <div class="flex justify-between items-end border-b-2 border-teal-800 pb-2 mb-4 text-xl sm:text-2xl font-sans">
                <div>
                    <span id="ui-name" class="font-bold text-teal-100"></span><br>
                    裝甲 (HP): <span id="ui-hp" class="text-red-400 font-bold">100</span>/100
                    <div class="w-32 sm:w-48 h-4 border-2 border-red-500 mt-1 bg-black">
                        <div id="ui-hp-bar" class="h-full bg-red-500 w-full transition-all duration-300"></div>
                    </div>
                </div>
                <div class="text-right leading-tight">
                    <button id="btn-mute" onclick="toggleMute()" class="text-xl mr-1 align-middle" title="靜音開關">🔊</button>
                    <button id="btn-pause" onclick="togglePause()" class="text-xl mr-1 align-middle" title="暫停遊戲">⏸️</button>
                    積分 (SCORE): <span id="ui-score" class="font-bold text-green-400 text-2xl">0</span>
                    <span id="ui-combo" class="hidden ml-1 text-pink-400 font-bold text-lg align-middle"></span><br>
                    作弊晶片 (HACK): <span id="ui-chips" class="font-bold text-yellow-400 text-3xl">3</span>
                    <button onclick="useChip()" id="btn-chip" class="ml-2 text-lg border-2 border-yellow-600 bg-yellow-900 text-yellow-400 px-2 py-0 hover:bg-yellow-700 disabled:opacity-50 transition">自動作答</button><br>
                    機體零件 (PARTS): <span id="ui-parts" class="font-bold text-blue-400 text-2xl">0</span>/3<br>
                    <span class="text-gray-400 text-lg">迷宮深度: <span id="ui-stage">1</span>/<span id="ui-max-stage">10</span></span>
                </div>
            </div>

            <!-- 第一人稱敵人視角區 -->
            <div id="enemy-view" class="flex-1 min-h-0 flex flex-col items-center justify-center relative mb-2 overflow-hidden">
                <div id="laser-shot" class="laser-shot"></div>
                <div id="hit-spark" class="hit-spark"></div>
                <div id="dodge-text" class="hidden dodge-text">DODGE!</div>
                <div id="boss-warning" class="hidden absolute top-1 left-1/2 -translate-x-1/2 bg-red-900 border-2 border-red-500 text-red-200 font-bold text-sm sm:text-lg px-3 py-1 z-20 boss-warning-banner font-sans text-center whitespace-nowrap rounded">⚠️ 魔王蓄力反擊！快點作答！</div>
                <div class="text-center mb-4">
                    <h2 id="enemy-name" class="text-2xl sm:text-4xl font-bold text-red-500 mb-2 sm:mb-4 tracking-widest uppercase font-sans"></h2>
                    <div id="enemy-sprite" class="text-6xl sm:text-9xl mb-2 sm:mb-4 animate-bounce enemy-sprite select-none">🛸</div>
                    <div class="text-xl font-sans" id="enemy-hp-container">
                        防護盾 (SHIELD): <br>
                        <span id="enemy-hp" class="text-blue-400 text-3xl font-bold tracking-widest"></span>
                    </div>
                </div>
            </div>

            <!-- 計時器 -->
            <div class="w-full h-4 bg-gray-950 border-2 border-gray-700 mb-4" id="timer-container">
                <div id="ui-timer-bar" class="h-full bg-[#00ffcc] w-full transition-all duration-100"></div>
            </div>

            <!-- 操作面板 -->
            <div class="min-h-[16rem] max-h-[45vh] sm:max-h-[42vh] bg-black border-4 border-teal-700 p-4 flex flex-col relative font-sans overflow-y-auto">

                <!-- 突發狀況區塊 -->
                <div id="event-area" class="hidden flex-1 flex flex-col items-center justify-center space-y-6">
                    <p id="event-text" class="text-2xl text-blue-300 text-center leading-relaxed"></p>
                    <div id="event-options" class="flex flex-wrap gap-4 w-full justify-center"></div>
                </div>

                <!-- 選擇題 (戰鬥) 區塊 -->
                <div id="combat-area" class="hidden flex-1 flex-col">
                    <p id="combat-q" class="text-2xl sm:text-3xl mb-4 text-center text-teal-100"></p>
                    <div id="combat-options" class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 flex-1"></div>
                </div>

                <!-- 重組題 (解謎) 區塊 -->
                <div id="puzzle-area" class="hidden flex-1 flex-col">
                    <p id="puzzle-hint" class="text-xl text-gray-400 mb-2 text-center"></p>
                    <div class="flex-1 border-b-2 border-dashed border-teal-800 mb-3 p-2 flex flex-wrap content-start gap-2 min-h-[70px] bg-gray-900" id="puzzle-selected"></div>
                    <div class="flex-1 p-2 flex flex-wrap content-start gap-2" id="puzzle-pool"></div>
                    <button onclick="submitPuzzle()" id="btn-submit-puzzle" class="btn-pixel w-full py-3 mt-2 text-2xl">傳送指令 (EXECUTE)</button>
                </div>
            </div>
        </div>

        <!-- 結束畫面 -->
        <div id="screen-end" class="hidden flex-1 flex flex-col items-center justify-center text-center space-y-8 z-10 font-sans">
            <h1 id="end-title" class="text-5xl sm:text-7xl font-bold"></h1>
            <p id="end-desc" class="text-3xl leading-relaxed text-teal-200"></p>
            <button onclick="location.reload()" class="btn-pixel px-8 py-4 text-3xl mt-8 font-sans">系統重啟 (REBOOT)</button>
        </div>
    </div>

    <script>
        // --- 題庫：結合 GEPT 講義 W1-W14 與練習題 ---
        const Q_COMBAT = [
            { q: "My father's brother is my ______.", opt: ["uncle", "aunt", "cousin", "sister"], ans: 0, tip: "father's brother（爸爸的兄弟）＝ uncle（伯父/叔叔/舅舅）。" },
            { q: "My mother's mother is my ______.", opt: ["grandmother", "grandfather", "aunt", "niece"], ans: 0, tip: "mother's mother（媽媽的媽媽）＝ grandmother（奶奶/外婆）。" },
            { q: "My brother's daughter is my ______.", opt: ["niece", "nephew", "cousin", "sister"], ans: 0, tip: "brother's daughter（哥哥/弟弟的女兒）＝ niece（姪女）。" },
            { q: "My uncle's son is my ______.", opt: ["cousin", "brother", "nephew", "uncle"], ans: 0, tip: "uncle's son（叔叔的兒子）＝ cousin（表/堂兄弟姊妹）。" },
            { q: "This is ______ pencil. It is red.", opt: ["I", "me", "my", "mine"], ans: 2, tip: "名詞前要用所有格 my（我的），不能用 I/me/mine。" },
            { q: "Those shoes are ______. They are not mine.", opt: ["her", "she", "hers", "he"], ans: 2, tip: "be 動詞後單獨使用要用所有格代名詞 hers（她的），不加名詞的 her。" },
            { q: "The library is very ______, so I like to read and study there.", opt: ["formal", "busy", "thirsty", "quiet"], ans: 3, tip: "圖書館要安靜看書，所以用 quiet（安靜的）。" },
            { q: "Where ______ you last night? I called you three times.", opt: ["are", "is", "was", "were"], ans: 3, tip: "last night 是過去式，you 對應的 be 動詞用 were。" },
            { q: "My parents ______ not at home now.", opt: ["is", "am", "are", "be"], ans: 2, tip: "parents 是複數，be 動詞要用 are。" },
            { q: "______ your brother a doctor?", opt: ["Is", "Are", "Do", "Does"], ans: 0, tip: "your brother 是單數第三人稱，問句用 Is 開頭。" },
            { q: "There ______ many people at the park yesterday.", opt: ["was", "were", "is", "are"], ans: 1, tip: "yesterday 是過去式，many people 複數用 were。" },
            { q: "I ______ very tired after the long trip.", opt: ["am", "is", "are", "be"], ans: 0, tip: "主詞 I 搭配 be 動詞要用 am。" },
            { q: "______ they students at your school?", opt: ["Is", "Are", "Do", "Does"], ans: 1, tip: "they 是複數，問句用 Are 開頭。" },
            { q: "It ______ very hot today.", opt: ["is", "are", "am", "be"], ans: 0, tip: "主詞 it 搭配 be 動詞要用 is。" },
            { q: "My sister and I ______ good friends.", opt: ["is", "am", "are", "be"], ans: 2, tip: "My sister and I 是複數主詞，要用 are。" },
            { q: "He usually ______ to school by bus.", opt: ["go", "goes", "going", "went"], ans: 1, tip: "主詞是第三人稱單數 he，現在式動詞要加 s，go→goes。" },
            { q: "My mother ______ dinner every evening.", opt: ["cook", "cooks", "cooking", "cooked"], ans: 1, tip: "mother 是第三人稱單數，現在式動詞要加 s。" },
            { q: "______ do you go to the movies? — About twice a month.", opt: ["How long", "How much", "How often", "How many"], ans: 2, tip: "問頻率（一個月兩次）要用 How often（多久一次）。" },
            { q: "I ______ never late for class.", opt: ["am", "is", "are", "be"], ans: 0, tip: "主詞 I 搭配 be 動詞用 am，never 放在 be 動詞後面。" },
            { q: "The shop ______ at nine o'clock every day.", opt: ["open", "opens", "opening", "opened"], ans: 1, tip: "shop 是第三人稱單數，現在式動詞要加 s。" },
            { q: "She always ______ her homework before dinner.", opt: ["do", "does", "did", "doing"], ans: 1, tip: "she 是第三人稱單數，助動詞 do 要變 does。" },
            { q: "We ______ TV together on weekends.", opt: ["watch", "watches", "watching", "watched"], ans: 0, tip: "主詞 we 是複數，現在式動詞不用加 s。" },
            { q: "My father ______ coffee every morning.", opt: ["drink", "drinks", "drank", "drinking"], ans: 1, tip: "father 是第三人稱單數，動詞要加 s，drink→drinks。" },
            { q: "Look! The birds ______ in the sky.", opt: ["fly", "flies", "are flying", "is flying"], ans: 2, tip: "Look! 表示現在正在發生的動作，要用現在進行式 are flying。" },
            { q: "Please be quiet. The baby ______.", opt: ["sleep", "sleeps", "is sleeping", "are sleeping"], ans: 2, tip: "baby 是單數，現在進行式要用 is + Ving。" },
            { q: "Listen! Someone ______ the door.", opt: ["knock", "knocks", "is knocking", "knocked"], ans: 2, tip: "Listen! 表示現在正在發生，Someone 單數用 is + Ving。" },
            { q: "Right now, my brother ______ his bike in the park.", opt: ["ride", "rides", "is riding", "rode"], ans: 2, tip: "Right now 表示此刻正在做的事，用現在進行式 is riding。" },
            { q: "We ______ for the bus at the moment.", opt: ["wait", "waits", "are waiting", "waited"], ans: 2, tip: "at the moment（此刻）要用現在進行式，we 複數用 are。" },
            { q: "Look at the sky! It ______ to rain.", opt: ["start", "starts", "is starting", "started"], ans: 2, tip: "看到現在的跡象要用現在進行式，it 用 is + Ving。" },
            { q: "He didn't ______ his homework last night.", opt: ["do", "does", "did", "doing"], ans: 0, tip: "didn't 後面動詞要用原形 do，不能再加 did/does。" },
            { q: "I ______ to the zoo with my family last Sunday.", opt: ["go", "goes", "went", "going"], ans: 2, tip: "last Sunday 是過去式，go 的過去式是 went。" },
            { q: "She ______ a beautiful dress for the party.", opt: ["buy", "buys", "bought", "buying"], ans: 2, tip: "過去式句子，buy 的過去式是不規則變化 bought。" },
            { q: "They ______ soccer in the park yesterday afternoon.", opt: ["play", "plays", "played", "playing"], ans: 2, tip: "yesterday afternoon 是過去式，play 加 ed 變 played。" },

        // 迷宮關卡設定 (10 關，其中 3 關是單字題關卡，hp 加總 = 6，保證每輪遊戲至少考 6 題單字)

            { type: 'combat', name: '巡邏無人機 (Drone)',        sprite: '🛸', hp: 2, time: 25 },

        let GAME = {
            player: 'ROBOT-X', hp: 100, chips: 3, parts: 0, stage: 0, score: 0, combo: 0, bossCounterFired: false,

        let puzzleSelected = [];
        let puzzlePool = [];

        // --- 8-bit 音效系統（用瀏覽器內建的 Web Audio API 即時生成，不需要任何音檔） ---
        let audioCtx = null;
        let muted = localStorage.getItem('geptCoreMuted') === '1';

        function ensureAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleMute() {
            muted = !muted;
            localStorage.setItem('geptCoreMuted', muted ? '1' : '0');
            document.getElementById('btn-mute').textContent = muted ? '🔇' : '🔊';
        }
        document.getElementById('btn-mute').textContent = muted ? '🔇' : '🔊';

        // 暫停遊戲：停止計時器、擋住畫面互動，讓老師可以隨時暫停講解
        function togglePause() {
            if (document.getElementById('screen-game').classList.contains('hidden')) return;
            GAME.paused = !GAME.paused;
            const overlay = document.getElementById('pause-overlay');
            const btn = document.getElementById('btn-pause');
            if (GAME.paused) {
                clearInterval(GAME.timer);
                overlay.classList.remove('hidden');
                btn.textContent = '▶️';
                btn.title = '繼續遊戲';
            } else {
                overlay.classList.add('hidden');
                btn.textContent = '⏸️';
                btn.title = '暫停遊戲';
                if (!GAME.isProcessing && GAME.timeLeft > 0 && document.getElementById('timer-container').style.visibility !== 'hidden') {
                    startTimer();
                }
            }
        }

        function beep(freq, duration, type = 'square', startGain = 0.15, glideTo = null, delay = 0) {
            if (muted || !audioCtx) return;
            const t0 = audioCtx.currentTime + delay;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + duration);
            gain.gain.setValueAtTime(startGain, t0);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(t0);
            osc.stop(t0 + duration + 0.02);
        }

        function sfxShoot() { beep(900, 0.14, 'square', 0.12, 180); }
        function sfxCorrect() { beep(660, 0.12, 'square', 0.15, 1320); }
        function sfxWrong() { beep(180, 0.32, 'sawtooth', 0.18, 55); }
        function sfxClick() { beep(500, 0.04, 'square', 0.06); }
        function sfxCombo(tier) { beep(440 + tier * 110, 0.14, 'square', 0.18, (440 + tier * 110) * 2); }
        function sfxLevelUp() { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.16, 'square', 0.15, null, i * 0.09)); }
        function sfxBossAttack() { [0, 0.15, 0.3, 0.45].forEach((d, i) => beep(i % 2 === 0 ? 200 : 350, 0.16, 'sawtooth', 0.18, null, d)); }
        function sfxBossHit() { beep(90, 0.35, 'sawtooth', 0.25, 40); }
        function sfxDodge() { beep(700, 0.09, 'square', 0.12, 1200); }
        function sfxWin() { [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, 0.2, 'square', 0.16, null, i * 0.12)); }
        function sfxLose() { [392, 349, 311, 262].forEach((f, i) => beep(f, 0.4, 'sawtooth', 0.15, null, i * 0.2)); }

        function fireLaser() {
            const laser = document.getElementById('laser-shot');
            if (!laser) return;
            laser.classList.remove('firing');
            void laser.offsetWidth;
            laser.classList.add('firing');

        // 命中特效：雷射打中敵人時的爆炸火花
        function triggerHitSpark() {
            const spark = document.getElementById('hit-spark');
            if (!spark) return;
            spark.classList.remove('active');
            void spark.offsetWidth;

        // 閃避特效：畫面快速位移 + 「DODGE!」文字彈出，代表玩家及時作答躲過魔王反擊
        function triggerDodge() {
            const view = document.getElementById('enemy-view');
            const text = document.getElementById('dodge-text');
            sfxDodge();
            if (view) {
                view.classList.remove('dodge-active');
                void view.offsetWidth;
                view.classList.add('dodge-active');
            }
            if (text) {
                text.classList.remove('hidden', 'pop');
                void text.offsetWidth;
                text.classList.add('pop');
                setTimeout(() => text.classList.add('hidden'), 600);
            }

        // 魔王反擊：倒數過一半還沒作答，魔王會蓄力 0.7 秒後反擊；
        // 這段時間內只要玩家送出答案（GAME.isProcessing 變 true）就算閃避成功，不會扣血。
        async function triggerBossCounterAttack() {
            const warn = document.getElementById('boss-warning');
            const sprite = document.getElementById('enemy-sprite');
            warn.classList.remove('hidden');
            sprite.classList.add('boss-lunge');
            sfxBossAttack();

            await wait(700);
            while (GAME.paused) await wait(200); // 暫停中先不結算，等繼續遊戲後才判定

            warn.classList.add('hidden');
            sprite.classList.remove('boss-lunge');

            if (GAME.isProcessing) { triggerDodge(); return; } // 及時作答，閃避成功

            sfxBossHit();
            GAME.hp -= 10;
            updateTopUI();
            document.body.classList.add('shake');
            document.getElementById('screen-game').style.boxShadow = 'inset 0 0 100px rgba(255,0,0,0.7)';
            await wait(350);
            document.body.classList.remove('shake');
            document.getElementById('screen-game').style.boxShadow = '';

            if (GAME.hp <= 0 && document.getElementById('screen-end').classList.contains('hidden')) {
                gameOver(false);
            }
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // --- 老師後台紀錄：把這裡換成你自己的 Google 試算表 Web App 網址 ---
        // 還沒設定的話留空字串就好，遊戲照樣正常運作，只是不會記錄錯題。
        const SHEET_WEBHOOK_URL = "";

        function logAnswer(type, question, userAnswer, correctAnswer) {
            if (!SHEET_WEBHOOK_URL) return;
            try {
                fetch(SHEET_WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        player: GAME.player,
                        stage: GAME.stage + 1,
                        type: type,
                        question: question,
                        userAnswer: userAnswer,
                        correctAnswer: correctAnswer
                    })
                }).catch(() => {});
            } catch (e) {
                // 記錄失敗也不能影響遊戲進行
            }
        }

        function showScreen(id) {
            ['screen-start', 'screen-game', 'screen-end'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // --- 洗牌抽題：確保同一次遊戲中，題目在抽完整個題庫前不會重複 ---
        function shuffleArray(source) {
            const arr = [...source];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function drawQuestion(queueKey, source) {
            if (!GAME[queueKey] || GAME[queueKey].length === 0) {
                GAME[queueKey] = shuffleArray(source);
            }
            return GAME[queueKey].pop();
        }

        function playWarpTransition() {
            const el = document.getElementById('warp-overlay');
            if (!el) return;
            el.classList.remove('warp-active');
            void el.offsetWidth;
            el.classList.add('warp-active');
        }

        async function showMessage(text, colorClass, duration = 1200) {
            const msgEl = document.getElementById('sys-message');
            const textEl = document.getElementById('sys-message-text');
            msgEl.classList.remove('hidden');
            textEl.innerHTML = text;
            textEl.className = `text-3xl sm:text-5xl font-bold text-center px-2 leading-relaxed tracking-widest font-sans msg-pop ${colorClass}`;

            return new Promise(resolve => {
                setTimeout(() => { msgEl.classList.add('hidden'); resolve(); }, duration);
            });
        }

        function startGame() {
            ensureAudio();
            const nameInput = document.getElementById('player-name').value.trim();
            if (nameInput) GAME.player = nameInput.toUpperCase();

            GAME.hp = 100; GAME.chips = 3; GAME.parts = 0; GAME.stage = 0; GAME.score = 0; GAME.combo = 0; GAME.paused = false;
            GAME.combatQueue = []; GAME.puzzleQueue = []; GAME.vocabQueue = [];
            document.getElementById('pause-overlay').classList.add('hidden');
            document.getElementById('btn-pause').textContent = '⏸️';
            document.getElementById('ui-max-stage').innerText = LEVELS.length;

            updateTopUI();
            showScreen('screen-game');
            loadStage();
        }

        function updateTopUI() {
            document.getElementById('ui-name').innerText = `[${GAME.player}]`;
            document.getElementById('ui-hp').innerText = Math.max(0, GAME.hp);
            document.getElementById('ui-hp-bar').style.width = `${Math.max(0, GAME.hp)}%`;
            document.getElementById('ui-score').innerText = GAME.score;
            document.getElementById('ui-chips').innerText = GAME.chips;
            document.getElementById('ui-parts').innerText = GAME.parts;
            document.getElementById('ui-stage').innerText = Math.min(GAME.stage + 1, LEVELS.length);
            document.getElementById('btn-chip').disabled = GAME.chips <= 0;

            const comboEl = document.getElementById('ui-combo');
            if (GAME.combo >= 2) {
                const mult = comboMultiplier(GAME.combo);
                comboEl.textContent = mult > 1 ? `🔥COMBO x${GAME.combo} (${mult}x分數)` : `COMBO x${GAME.combo}`;
                comboEl.classList.remove('hidden');
            } else {
                comboEl.classList.add('hidden');
            }
        }

        function comboMultiplier(combo) {
            if (combo >= 8) return 3;
            if (combo >= 5) return 2;
            if (combo >= 3) return 1.5;
            return 1;
        }

        function loadStage() {
            if (GAME.stage >= LEVELS.length) {
                gameOver(true);
                return;
            }

            if (GAME.stage > 0) playWarpTransition();

            // 重置所有狀態 (修復之前卡住的 Bug)
            GAME.isProcessing = false;
            GAME.isEventChallenge = false;
            clearInterval(GAME.timer);

            const level = LEVELS[GAME.stage];
            GAME.enemyHp = level.hp;

            document.getElementById('enemy-name').innerText = level.name;
            document.getElementById('enemy-sprite').innerText = level.sprite;

            document.getElementById('combat-area').classList.add('hidden');
            document.getElementById('puzzle-area').classList.add('hidden');
            document.getElementById('event-area').classList.add('hidden');

            document.getElementById('timer-container').style.visibility = 'visible';
            document.getElementById('enemy-hp-container').style.visibility = 'visible';
            document.getElementById('enemy-hp').innerText = '█'.repeat(GAME.enemyHp);

            let currentType = level.type;
            if (currentType === 'event') {
                setupEvent(); return;
            }
            if (currentType === 'boss') {
                currentType = ['combat', 'puzzle', 'vocab'][Math.floor(Math.random() * 3)];
            }

            if (currentType === 'combat') setupCombat('combatQueue', Q_COMBAT);
            else if (currentType === 'vocab') setupCombat('vocabQueue', Q_VOCAB);
            else setupPuzzle();

            GAME.maxTime = level.time;
            GAME.timeLeft = GAME.maxTime;
            startTimer();
        }

        function setupEvent() {
            document.getElementById('timer-container').style.visibility = 'hidden';
            document.getElementById('enemy-hp-container').style.visibility = 'hidden';
            document.getElementById('event-area').classList.remove('hidden');

            document.getElementById('event-text').innerHTML = "偵測到廢棄物資箱。<br>是否嘗試回答問題破解防火牆，以取得【機體零件】？<br><span class='text-sm text-gray-400'>(集滿3個零件可恢復HP並獲得晶片)</span>";

            const optDiv = document.getElementById('event-options');
            optDiv.innerHTML = '';

            const btnHack = document.createElement('button');
            btnHack.className = 'btn-pixel px-6 py-3 text-xl font-sans';
            btnHack.innerText = '嘗試破解 (HACK)';
            btnHack.onclick = () => {
                if(GAME.isProcessing) return;
                document.getElementById('event-area').classList.add('hidden');
                document.getElementById('timer-container').style.visibility = 'visible';

                GAME.enemyHp = 1; GAME.isEventChallenge = true;
                const hackType = ['combat', 'puzzle', 'vocab'][Math.floor(Math.random() * 3)];
                if (hackType === 'puzzle') setupPuzzle();
                else if (hackType === 'vocab') setupCombat('vocabQueue', Q_VOCAB);
                else setupCombat('combatQueue', Q_COMBAT);

                GAME.maxTime = 20; GAME.timeLeft = 20;
                startTimer();
            };

            const btnLeave = document.createElement('button');
            btnLeave.className = 'border-2 border-gray-600 text-gray-400 px-6 py-3 text-xl bg-gray-900 hover:bg-gray-800 transition font-sans';
            btnLeave.innerText = '忽略前進 (IGNORE)';
            btnLeave.onclick = () => {
                if(GAME.isProcessing) return;
                GAME.stage++; loadStage();
            };
            optDiv.appendChild(btnHack); optDiv.appendChild(btnLeave);
        }

        function setupCombat(queueKey = 'combatQueue', source = Q_COMBAT) {
            document.getElementById('combat-area').classList.remove('hidden');
            document.getElementById('combat-options').innerHTML = '';
            GAME.bossCounterFired = false;
            document.getElementById('boss-warning').classList.add('hidden');

            GAME.currentQType = queueKey === 'vocabQueue' ? 'vocab' : 'grammar';
            GAME.currentQ = drawQuestion(queueKey, source);
            document.getElementById('combat-q').innerText = GAME.currentQ.q;

            GAME.currentQ.opt.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-pixel py-3 text-xl break-words font-sans';
                btn.innerText = opt;
                btn.onclick = () => handleCombatAnswer(idx, btn);
                document.getElementById('combat-options').appendChild(btn);
            });
        }

        function setupPuzzle() {
            document.getElementById('puzzle-area').classList.remove('hidden');
            GAME.bossCounterFired = false;
            document.getElementById('boss-warning').classList.add('hidden');
            GAME.currentQType = 'puzzle';
            GAME.currentQ = drawQuestion('puzzleQueue', Q_PUZZLE);
            document.getElementById('puzzle-hint').innerText = GAME.currentQ.hint;

            // 隨機打亂單字
            puzzlePool = shuffleArray(GAME.currentQ.words);
            puzzleSelected = [];
            renderPuzzleUI();
        }

        function renderPuzzleUI() {
            const poolEl = document.getElementById('puzzle-pool');
            const selEl = document.getElementById('puzzle-selected');
            poolEl.innerHTML = ''; selEl.innerHTML = '';

            puzzlePool.forEach((word, idx) => {
                const btn = document.createElement('button');
                btn.className = 'border-2 border-teal-600 bg-gray-800 text-teal-300 px-3 py-1 text-lg sm:text-xl hover:bg-teal-900 transition shadow-[2px_2px_0px_#005544] font-sans';
                btn.innerText = word;
                btn.onclick = () => {
                    if(GAME.isProcessing) return;
                    sfxClick();
                    puzzlePool.splice(idx, 1); puzzleSelected.push(word);
                    renderPuzzleUI();
                };
                poolEl.appendChild(btn);
            });

            puzzleSelected.forEach((word, idx) => {
                const btn = document.createElement('button');
                btn.className = 'border-2 border-[#00ffcc] bg-teal-900 text-[#00ffcc] px-3 py-1 text-lg sm:text-xl hover:bg-red-900 transition shadow-[2px_2px_0px_#00aa88] font-sans';
                btn.innerText = word;
                btn.onclick = () => {
                    if(GAME.isProcessing) return;
                    sfxClick();
                    puzzleSelected.splice(idx, 1); puzzlePool.push(word);
                    renderPuzzleUI();
                };
                selEl.appendChild(btn);
            });
        }

        async function handleCombatAnswer(idx, btn) {
            if (GAME.isProcessing) return;
            GAME.isProcessing = true; clearInterval(GAME.timer);

            if (idx === GAME.currentQ.ans) {
                btn.style.backgroundColor = '#00ffcc'; btn.style.color = '#000';
                await damageEnemy(10);
            } else {
                sfxWrong();
                GAME.combo = 0; updateTopUI();
                btn.style.backgroundColor = '#ff3333'; btn.style.color = '#fff'; btn.style.borderColor = '#ff3333';
                const correctOpt = GAME.currentQ.opt[GAME.currentQ.ans];
                logAnswer(GAME.currentQType, GAME.currentQ.q, GAME.currentQ.opt[idx], correctOpt);

                let msg = 'ERR: 語法錯誤 (SYNTAX ERROR)';
                let duration = 1200;
                if (GAME.currentQ.tip) {
                    msg += `<br><span class="text-lg sm:text-xl text-teal-200 normal-case tracking-normal block mt-2">正確答案: ${correctOpt}<br>${GAME.currentQ.tip}</span>`;
                    duration = 2600;
                }
                await takeDamage(20, msg, duration);
            }
        }

        async function submitPuzzle() {
            if (GAME.isProcessing || puzzleSelected.length === 0) return;
            GAME.isProcessing = true; clearInterval(GAME.timer);

            const userAns = puzzleSelected.join(' ');
            if (userAns === GAME.currentQ.correct) {
                await damageEnemy(15);
            } else {
                sfxWrong();
                GAME.combo = 0; updateTopUI();
                logAnswer('puzzle', GAME.currentQ.hint, userAns, GAME.currentQ.correct);
                const msg = `ERR: 邏輯錯誤 (LOGIC ERROR)<br><span class="text-lg sm:text-xl text-teal-200 normal-case tracking-normal block mt-2">正確答案: ${GAME.currentQ.correct}</span>`;
                await takeDamage(20, msg, 2200);
            }
        }

        async function damageEnemy(points = 10) {
            GAME.enemyHp--;

            if (points > 0) {
                const oldTier = comboMultiplier(GAME.combo);
                GAME.combo++;
                const mult = comboMultiplier(GAME.combo);
                GAME.score += Math.round(points * mult);
                if (mult > oldTier) {
                    sfxCombo(GAME.combo);
                    const comboEl = document.getElementById('ui-combo');
                    comboEl.classList.remove('combo-pop');
                    void comboEl.offsetWidth;
                    comboEl.classList.add('combo-pop');
                }
            }

            if (!GAME.isEventChallenge) {
                fireLaser();
                sfxShoot();
                await wait(180);
                triggerHitSpark();
                document.getElementById('enemy-hp').innerText = '█'.repeat(GAME.enemyHp);
                document.getElementById('enemy-sprite').classList.add('shake');
                document.getElementById('enemy-sprite').style.filter = 'drop-shadow(0 0 20px rgba(255, 0, 0, 0.8))';
                sfxCorrect();
            } else {
                sfxCorrect();
            }
            updateTopUI();

            await showMessage('指令成功 (SUCCESS)', 'text-[#00ffcc]', 800);

            if(!GAME.isEventChallenge) {
                document.getElementById('enemy-sprite').classList.remove('shake');
                document.getElementById('enemy-sprite').style.filter = 'drop-shadow(0 0 10px rgba(0, 255, 204, 0.5))';
            }

            if (GAME.enemyHp <= 0) {
                sfxLevelUp();
                if (GAME.isEventChallenge) {
                    await showMessage('破解成功！<br>獲得 1 個零件', 'text-blue-400', 1200);
                    await addPart();
                } else {
                    await showMessage('目標摧毀 (DESTROYED)', 'text-yellow-400', 1000);
                    // 一般戰鬥 30% 機率掉落零件
                    if (Math.random() < 0.3) {
                        await showMessage('掃描殘骸...<br>發現 1 個零件！', 'text-blue-400', 1200);
                        await addPart();
                    }
                }
                GAME.stage++; loadStage();
            } else {
                // Boss 戰未死，切換題目
                setTimeout(() => {
                    GAME.isProcessing = false;
                    const stageType = LEVELS[GAME.stage].type;
                    if (stageType === 'boss') {
                        const pick = ['combat', 'puzzle', 'vocab'][Math.floor(Math.random() * 3)];
                        document.getElementById('puzzle-area').classList.add('hidden');
                        document.getElementById('combat-area').classList.add('hidden');
                        if (pick === 'puzzle') setupPuzzle();
                        else if (pick === 'vocab') setupCombat('vocabQueue', Q_VOCAB);
                        else setupCombat('combatQueue', Q_COMBAT);
                    } else if (stageType === 'combat') {
                        setupCombat('combatQueue', Q_COMBAT);
                    } else if (stageType === 'vocab') {
                        setupCombat('vocabQueue', Q_VOCAB);
                    } else {
                        setupPuzzle();
                    }
                    // 扣血後補回一點時間
                    GAME.timeLeft = Math.min(GAME.maxTime, GAME.timeLeft + (GAME.maxTime * 0.4));
                    startTimer();
                }, 200);
            }
        }

        async function takeDamage(amount, msgText, duration = 1200) {
            GAME.hp -= amount; updateTopUI();
            document.body.classList.add('shake');
            document.getElementById('screen-game').style.boxShadow = 'inset 0 0 80px rgba(255,0,0,0.6)';

            await showMessage(msgText, 'text-red-500', duration);

            document.body.classList.remove('shake');
            document.getElementById('screen-game').style.boxShadow = '';

            if (GAME.hp <= 0) {
                gameOver(false);
            } else {
                if (GAME.isEventChallenge) {
                    await showMessage('破解失敗，物資箱損毀...', 'text-gray-500', 1500);
                    GAME.stage++; loadStage();
                } else {
                    // 解除鎖定並重置時間
                    GAME.isProcessing = false;
                    GAME.timeLeft = GAME.maxTime;
                    startTimer();
                }
            }
        }

        async function addPart() {
            GAME.parts++;
            if (GAME.parts >= 3) {
                GAME.parts = 0; GAME.chips++; GAME.hp = Math.min(100, GAME.hp + 30);
                updateTopUI();
                await showMessage('系統修復！<br>HP +30<br>獲得晶片 +1', 'text-[#00ffcc]', 2000);
            } else {
                updateTopUI();
            }
        }

        async function useChip() {
            if (GAME.chips <= 0 || GAME.isProcessing) return;
            if (LEVELS[GAME.stage].type === 'event' && !GAME.isEventChallenge) return;

            GAME.chips--; updateTopUI();
            GAME.isProcessing = true; clearInterval(GAME.timer);

            await showMessage('啟動破解晶片...<br>強行覆寫系統 (OVERRIDE)', 'text-yellow-400', 1500);
            await damageEnemy(0);
        }

        function startTimer() {
            clearInterval(GAME.timer);
            const bar = document.getElementById('ui-timer-bar');

            GAME.timer = setInterval(async () => {
                if (GAME.isProcessing) return;

                GAME.timeLeft -= 0.1;
                const percent = (GAME.timeLeft / GAME.maxTime) * 100;
                bar.style.width = `${Math.max(0, percent)}%`;

                if (percent < 30) bar.style.backgroundColor = '#ff3333';
                else bar.style.backgroundColor = '#00ffcc';

                if (LEVELS[GAME.stage] && LEVELS[GAME.stage].type === 'boss' && !GAME.bossCounterFired && percent <= 45 && percent > 0) {
                    GAME.bossCounterFired = true;
                    triggerBossCounterAttack();
                }

                if (GAME.timeLeft <= 0) {
                    clearInterval(GAME.timer);
                    GAME.isProcessing = true;
                    sfxWrong();
                    GAME.combo = 0; updateTopUI();
                    if (GAME.currentQ) {
                        const qText = GAME.currentQType === 'puzzle' ? GAME.currentQ.hint : GAME.currentQ.q;
                        const correctText = GAME.currentQType === 'puzzle' ? GAME.currentQ.correct : GAME.currentQ.opt[GAME.currentQ.ans];
                        logAnswer(GAME.currentQType, qText, '(逾時未作答)', correctText);
                    }
                    await takeDamage(15, 'TIME OUT (連線超時)');
                }
            }, 100);
        }

        function gameOver(isWin) {
            clearInterval(GAME.timer); showScreen('screen-end');
            if (isWin) sfxWin(); else sfxLose();
            const title = document.getElementById('end-title');
            const desc = document.getElementById('end-desc');

            if (isWin) {
                title.innerText = '任務完成\n(MISSION ACCOMPLISHED)';
                title.className = 'text-5xl sm:text-7xl font-bold text-yellow-400 drop-shadow-[0_0_15px_rgba(250,204,21,0.8)]';
                desc.innerHTML = `幹得好，機體 ${GAME.player}！<br><br>母艦核心已成功奪回<br>最終積分：${GAME.score}<br>剩餘晶片：${GAME.chips}<br>最終殘餘裝甲：${GAME.hp}%`;
            } else {
                title.innerText = '系統崩潰\n(SYSTEM FAILURE)';
                title.className = 'text-5xl sm:text-7xl font-bold text-red-600 drop-shadow-[0_0_20px_rgba(220,38,38,0.8)] animate-pulse';
                desc.innerHTML = `機體 ${GAME.player} 裝甲值歸零...<br><br>最終積分：${GAME.score}<br>連線中斷。請重新訓練文法神經網路。`;
            }
        }
    </script>
</body>
</html>
