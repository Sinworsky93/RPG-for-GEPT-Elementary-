<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>IELTS Practice</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#1b1f27; --sub:#5b6472;
    --line:#e3e6eb; --accent:#2f6fed; --accent-ink:#ffffff;
    --good:#1c8a4b; --bad:#c9432c; --warn:#b8860b;
    --chip:#eef2ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);}
  header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px;}
  header .wrap{display:flex;align-items:center;justify-content:space-between;min-height:56px;flex-wrap:wrap;gap:6px;padding-top:8px;padding-bottom:8px;}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px;white-space:nowrap;}
  nav{display:flex;gap:2px;flex-wrap:wrap;}
  nav button{border:none;background:transparent;color:var(--sub);font-size:13px;font-weight:600;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  nav button.active{background:var(--accent);color:var(--accent-ink);}
  main{max-width:960px;margin:0 auto;padding:20px 16px 80px;}
  .view{display:none;} .view.active{display:block;}

  /* list cards */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:box-shadow .15s, transform .15s;}
  .card:hover{box-shadow:0 4px 14px rgba(20,30,60,.08);transform:translateY(-1px);}
  .card h3{margin:0 0 4px;font-size:16px;}
  .card p{margin:0;color:var(--sub);font-size:13px;}
  .badge{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--chip);padding:2px 8px;border-radius:999px;margin-right:6px;}

  /* passage/test view */
  .backbtn{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:14px;margin-bottom:14px;padding:0;}
  .split{display:grid;grid-template-columns:1fr;gap:20px;}
  @media(min-width:860px){.split{grid-template-columns:1.1fr 1fr;}}
  .passage-box, .qbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;}
  @media(min-width:860px){.passage-box{position:sticky;top:66px;max-height:78vh;overflow-y:auto;}}
  .passage-box h2{font-size:19px;margin-top:0;}
  .passage-box p{line-height:1.8;font-size:16px;}
  .para-label{font-weight:800;color:var(--accent);margin-right:6px;}
  mark.hl{background:#fff59d;padding:0 1px;border-radius:2px;cursor:pointer;}
  mark.hl:hover{background:#ffe066;}
  .qgroup{margin-bottom:26px;}
  .qgroup h4{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin:0 0 4px;}
  .qgroup .instr{font-size:14px;color:var(--sub);margin-bottom:12px;font-style:italic;}
  .heading-list{background:var(--chip);border-radius:8px;padding:12px 16px;font-size:15px;line-height:1.8;margin-bottom:12px;}
  .qitem{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:15px;flex-wrap:wrap;}
  .qitem .qn{font-weight:700;color:var(--sub);min-width:22px;}
  .qitem select, .qitem input[type=text]{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:15px;}
  .tfng label{display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:14px;cursor:pointer;}
  .qstatement{flex:1;min-width:200px;}
  .result{font-size:12px;font-weight:700;margin-left:4px;}
  .result.correct{color:var(--good);}
  .result.wrong{color:var(--bad);}
  .submitbar{background:var(--panel);border-top:1px solid var(--line);padding:14px 0;margin-top:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .submitbar button{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;}
  .score{font-weight:800;font-size:15px;}
  table{max-width:100%;}
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  /* writing/speaking */
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .chip-row span{background:var(--chip);color:var(--accent);font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;}
  .section-title{font-size:16px;font-weight:800;margin:22px 0 10px;text-transform:capitalize;}
  .prompt-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px;font-size:15px;line-height:1.65;}
  .prompt-item .tag{font-size:11px;font-weight:700;color:#fff;background:#8b98ab;padding:1px 7px;border-radius:5px;margin-right:8px;}
  .cue-card{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:18px;font-size:15px;line-height:1.75;margin-bottom:10px;}
  .flipbtn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;margin-bottom:16px;margin-right:8px;}
  .part3set{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .part3set h4{margin:0 0 8px;font-size:14px;color:var(--accent);}
  .part3set ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.8;}
  .loading, .empty{color:var(--sub);padding:40px 0;text-align:center;font-size:14px;}
  .word-chip{background:var(--chip);color:var(--accent);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-block;margin:2px 4px 2px 0;}
  .useful-words{margin:8px 0 12px;}
  .useful-words .lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin-right:6px;}
  .smallbtn{background:none;border:1px solid var(--line);color:var(--sub);font-size:12px;font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer;}
  .smallbtn:hover{border-color:var(--accent);color:var(--accent);}

  /* enlarge (magnifier) */
  .enlarge-btn{background:none;border:1px solid var(--line);color:var(--sub);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;flex-shrink:0;}
  .enlarge-btn:hover{border-color:var(--accent);color:var(--accent);}
  #enlargeOverlay{display:none;position:fixed;inset:0;background:rgba(20,24,33,.72);z-index:100;padding:24px;overflow-y:auto;}
  #enlargeOverlay.active{display:block;}
  #enlargeOverlay .sheet{background:var(--panel);max-width:900px;margin:0 auto;border-radius:14px;padding:28px;position:relative;font-size:19px;line-height:1.85;}
  #enlargeOverlay .sheet p{font-size:19px;line-height:1.9;}
  #enlargeOverlay .closebtn{position:sticky;top:0;float:right;background:var(--ink);color:#fff;border:none;width:34px;height:34px;border-radius:999px;cursor:pointer;font-size:16px;margin-bottom:10px;}
  #enlargeToolbar{float:right;clear:right;display:flex;gap:6px;margin:0 0 10px;}
  #enlargeToolbar .enlarge-btn{background:var(--panel);}

  /* history / review */
  .hist-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:9px 0;font-size:13.5px;flex-wrap:wrap;}
  .hist-row:last-child{border-bottom:none;}
  .hist-meta{color:var(--sub);font-size:12px;}
  .wrong-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px;font-size:13.5px;}
  .wrong-card .yr{color:var(--bad);}
  .wrong-card .cr{color:var(--good);}

  /* recording */
  .rec-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;}
  audio{max-width:100%;}

  @media(max-width:600px){
    header h1{font-size:14px;}
    nav button{font-size:12px;padding:6px 8px;}
    header .wrap{justify-content:flex-start;}
    nav{order:3;width:100%;}
    #studentBadge{margin-left:auto;}
    .passage-box p{font-size:15px;}
    #enlargeOverlay{padding:10px;}
    #enlargeOverlay .sheet{padding:16px;font-size:17px;}
    #enlargeOverlay .sheet p{font-size:17px;}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>📘 IELTS Practice</h1>
    <nav>
      <button data-tab="reading" class="active">閱讀 Reading</button>
      <button data-tab="writing">寫作 Writing</button>
      <button data-tab="speaking">口說 Speaking</button>
      <button data-tab="review">複習 Review</button>
    </nav>
    <button id="studentBadge" class="smallbtn" onclick="promptStudentName(false)" style="white-space:nowrap;">👤 登記姓名</button>
  </div>
</header>

<main>
  <section id="view-reading" class="view active">
    <div id="reading-list"><div class="loading">閱讀題庫載入中…</div></div>
    <div id="reading-test" style="display:none;"></div>
  </section>

  <section id="view-writing" class="view">
    <div id="writing-list"><div class="loading">寫作題庫載入中…</div></div>
  </section>

  <section id="view-speaking" class="view">
    <div id="speaking-list"><div class="loading">口說題庫載入中…</div></div>
  </section>

  <section id="view-review" class="view">
    <div id="review-list"></div>
  </section>
</main>

<div id="enlargeOverlay" onclick="if(event.target===this) closeEnlarge()">
  <div class="sheet">
    <button class="closebtn" onclick="closeEnlarge()">✕</button>
    <div id="enlargeToolbar"></div>
    <div id="enlargeContent" style="clear:both;"></div>
  </div>
</div>

<script>
const state = { reading: null, writing: null, speaking: null, currentPassage: null };

/* ---------- backend sync (optional Google Sheets via Apps Script) ---------- */
/* 老師部署 Google Apps Script 後，把網址貼在下面這一行的引號中間即可啟用後台紀錄功能。 */
const BACKEND_URL = '';

function getStudentName(){
  try{ return localStorage.getItem('ieltsStudentName') || ''; }catch(e){ return ''; }
}
function setStudentName(name){
  try{ localStorage.setItem('ieltsStudentName', name); }catch(e){}
  syncToBackend('register', {});
  renderStudentBadge();
}
function promptStudentName(force){
  const current = getStudentName();
  const name = prompt(force ? '請輸入你的姓名，方便老師在後台辨識你的紀錄：' : '修改姓名：', current);
  if(name && name.trim()){ setStudentName(name.trim()); }
}
function renderStudentBadge(){
  const el = document.getElementById('studentBadge');
  if(!el) return;
  const name = getStudentName();
  el.textContent = name ? `👤 ${name}` : '👤 登記姓名';
  el.title = name ? '點擊修改姓名' : '點擊登記姓名';
}
function syncToBackend(type, payload){
  if(!BACKEND_URL) return;
  const name = getStudentName();
  if(!name && type !== 'register') return;
  const body = Object.assign({ type, name, ts: new Date().toISOString() }, payload);
  try{
    fetch(BACKEND_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).catch(()=>{});
  }catch(e){}
}

let remoteDraftsCache = null;
async function fetchRemoteDrafts(){
  if(!BACKEND_URL) return {};
  const name = getStudentName();
  if(!name) return {};
  try{
    const res = await fetch(`${BACKEND_URL}?action=drafts&name=${encodeURIComponent(name)}`);
    if(!res.ok) return {};
    const data = await res.json();
    return data.drafts || {};
  }catch(e){ return {}; }
}

async function loadJSON(paths){
  for(const p of paths){
    try{
      const res = await fetch(p);
      if(res.ok) return await res.json();
    }catch(e){}
  }
  return null;
}

async function init(){
  state.reading = await loadJSON(['content/reading-bank.json','content/readingbank.json','reading-bank.json','readingbank.json']);
  state.writing = await loadJSON(['content/writing-bank.json','content/writingbank.json','writing-bank.json','writingbank.json']);
  state.speaking = await loadJSON(['content/speaking-bank.json','content/speakingbank.json','speaking-bank.json','speakingbank.json']);
  remoteDraftsCache = await fetchRemoteDrafts();
  renderReadingList();
  renderWriting();
  renderSpeaking();
  renderReview();
  if(window.indexedDB){ purgeOldRecordings().then(renderReview); }
  renderStudentBadge();
  if(!getStudentName()) promptStudentName(true);
}

/* ---------- nav ---------- */
document.querySelectorAll('nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='review') renderReview();
  });
});

/* ---------- enlarge (click-to-zoom a section) ---------- */
function openEnlarge(html){
  document.getElementById('enlargeToolbar').innerHTML = '';
  document.getElementById('enlargeContent').innerHTML = html;
  document.getElementById('enlargeOverlay').classList.add('active');
}
function openEnlargeLive(sourceId, withHighlighter){
  const source = document.getElementById(sourceId);
  if(!source) return;
  const anchor = document.createElement('div');
  anchor.id = sourceId+'__anchor';
  anchor.style.display = 'none';
  source.parentNode.insertBefore(anchor, source);
  const content = document.getElementById('enlargeContent');
  content.innerHTML = '';
  content.appendChild(source);
  const toolbar = document.getElementById('enlargeToolbar');
  toolbar.innerHTML = withHighlighter
    ? `<button type="button" class="enlarge-btn" title="標記螢光筆" onpointerdown="event.preventDefault()" onclick="highlightSelection()">🖍</button>
       <button type="button" class="enlarge-btn" title="清除標記" onclick="clearHighlights()">🧹</button>`
    : '';
  const overlay = document.getElementById('enlargeOverlay');
  overlay.dataset.liveSource = sourceId;
  overlay.classList.add('active');
}
function closeEnlarge(){
  const overlay = document.getElementById('enlargeOverlay');
  const liveId = overlay.dataset.liveSource;
  if(liveId){
    const source = document.getElementById(liveId);
    const anchor = document.getElementById(liveId+'__anchor');
    if(source && anchor && anchor.parentNode){ anchor.parentNode.insertBefore(source, anchor); anchor.remove(); }
    delete overlay.dataset.liveSource;
  }
  overlay.classList.remove('active');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeEnlarge(); });
function enlargeBtnHTML(sourceId, label){
  label = label || 'Enlarge';
  return `<button type="button" class="enlarge-btn" title="${label}" onclick="openEnlarge(document.getElementById('${sourceId}').innerHTML)">⛶</button>`;
}

/* ---------- highlighter (螢光筆) for reading passages ---------- */
function loadPassageHighlights(){
  try{ return JSON.parse(localStorage.getItem('ieltsHighlights')||'{}'); }catch(e){ return {}; }
}
function savePassageHighlights(){
  if(!state.currentPassage) return;
  const key = state.currentPassage.id || state.currentPassage.title;
  const box = document.getElementById('passageTextOnly');
  if(!box) return;
  const all = loadPassageHighlights();
  all[key] = box.innerHTML;
  try{ localStorage.setItem('ieltsHighlights', JSON.stringify(all)); }catch(e){}
}
function unwrapHighlight(mark){
  const parent = mark.parentNode;
  if(!parent) return;
  while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
  parent.removeChild(mark);
  parent.normalize();
  savePassageHighlights();
}
/* Click on any existing highlight (live view or restored from storage) removes it. */
document.addEventListener('click', e=>{
  const mark = e.target.closest && e.target.closest('mark.hl');
  if(mark){ e.stopPropagation(); unwrapHighlight(mark); }
});
function highlightSelection(){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const container = document.getElementById('passageTextOnly');
  if(!container || !container.contains(range.commonAncestorContainer)) return;

  /* Walk only the text nodes touched by the selection and wrap the selected
     substring of each one individually (splitText), instead of moving whole
     DOM subtrees via surroundContents/extractContents — that approach could
     drop or scramble content whenever a selection crossed element boundaries
     (e.g. spanning the paragraph-label <span> or two <p> tags). */
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
    acceptNode(node){ return range.intersectsNode(node) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }
  });
  const nodes = [];
  let n;
  while((n = walker.nextNode())) nodes.push(n);

  nodes.forEach(node=>{
    const isStart = node === range.startContainer;
    const isEnd = node === range.endContainer;
    const localStart = isStart ? range.startOffset : 0;
    const localEnd = isEnd ? range.endOffset : node.data.length;
    if(localStart >= localEnd) return;
    let target = node;
    if(localEnd < target.data.length) target.splitText(localEnd);
    if(localStart > 0) target = target.splitText(localStart);
    const mark = document.createElement('mark');
    mark.className = 'hl';
    target.parentNode.insertBefore(mark, target);
    mark.appendChild(target);
  });

  sel.removeAllRanges();
  savePassageHighlights();
}
function clearHighlights(){
  if(!state.currentPassage) return;
  const key = state.currentPassage.id || state.currentPassage.title;
  const all = loadPassageHighlights();
  delete all[key];
  try{ localStorage.setItem('ieltsHighlights', JSON.stringify(all)); }catch(e){}
  const box = document.getElementById('passageTextOnly');
  if(box) box.innerHTML = Object.entries(state.currentPassage.paragraphs).map(([label,text])=>
    `<p><span class="para-label">${label}</span>${text}</p>`).join('');
}

/* ---------- local history / progress tracking ---------- */
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem('ieltsHistory')||'[]'); }catch(e){ return []; }
}
function saveHistoryEntry(entry){
  const h = loadHistory();
  entry.date = new Date().toISOString();
  h.unshift(entry);
  try{ localStorage.setItem('ieltsHistory', JSON.stringify(h.slice(0,200))); }catch(e){}
}
function loadWrongBank(){
  try{ return JSON.parse(localStorage.getItem('ieltsWrongAnswers')||'[]'); }catch(e){ return []; }
}
function addWrongAnswers(items){
  if(!items.length) return;
  const bank = loadWrongBank();
  const stamped = items.map(it=>({...it, date:new Date().toISOString()}));
  const merged = stamped.concat(bank).slice(0,300);
  try{ localStorage.setItem('ieltsWrongAnswers', JSON.stringify(merged)); }catch(e){}
}
function clearWrongAnswer(idx){
  const bank = loadWrongBank();
  bank.splice(idx,1);
  try{ localStorage.setItem('ieltsWrongAnswers', JSON.stringify(bank)); }catch(e){}
  renderReview();
}
function clearHistory(){
  if(!confirm('確定要清除所有成績紀錄嗎？此操作無法復原。')) return;
  try{ localStorage.removeItem('ieltsHistory'); }catch(e){}
  renderReview();
}
function clearAllWrong(){
  if(!confirm('確定要清空整個錯題本嗎？此操作無法復原。')) return;
  try{ localStorage.removeItem('ieltsWrongAnswers'); }catch(e){}
  renderReview();
}

function renderReview(){
  const el = document.getElementById('review-list');
  const hist = loadHistory();
  const wrong = loadWrongBank();

  let html = '<div class="section-title">成績紀錄</div>';
  if(!hist.length){
    html += '<div class="empty">目前還沒有練習紀錄 — 完成一篇閱讀或寫作練習後，紀錄會顯示在這裡。</div>';
  } else {
    html += '<div class="qbox">';
    html += hist.slice(0,40).map(h=>{
      const dt = new Date(h.date);
      const dtStr = dt.toLocaleDateString()+' '+dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      let right = '';
      if(h.type==='reading') right = `<span class="score">${h.score} / ${h.total}</span>`;
      else if(h.type==='writing') right = `<span class="score">${h.checksPassed} / ${h.checksTotal} 項通過</span>`;
      return `<div class="hist-row">
        <span><span class="badge">${h.type==='reading'?'閱讀':'寫作'}</span>${h.title}</span>
        <span style="display:flex;align-items:center;gap:10px;">${right}<span class="hist-meta">${dtStr}</span></span>
      </div>`;
    }).join('');
    html += `</div><div style="margin-top:10px;"><button class="smallbtn" onclick="clearHistory()">清除紀錄</button></div>`;
  }

  html += '<div class="section-title">錯題本（閱讀）</div>';
  if(!wrong.length){
    html += '<div class="empty">目前沒有錯題 — 閱讀測驗答錯的題目會自動加入這裡，方便之後複習。</div>';
  } else {
    html += wrong.map((w,i)=>`<div class="wrong-card">
        <div style="font-weight:700;margin-bottom:4px;">${w.passageTitle} <span class="hist-meta">第 ${w.n} 題</span></div>
        <div style="margin-bottom:4px;">${w.text}</div>
        <div>你的答案：<span class="yr">${w.yourAnswer||'（未作答）'}</span> &nbsp;·&nbsp; 正確答案：<span class="cr">${w.correctAnswer}</span></div>
        <button class="smallbtn" style="margin-top:6px;" onclick="clearWrongAnswer(${i})">移除</button>
      </div>`).join('');
    html += `<div style="margin-top:10px;"><button class="smallbtn" onclick="clearAllWrong()">清空錯題本</button></div>`;
  }

  html += `<div class="section-title">口說錄音（約 ${REC_RETENTION_DAYS} 天後自動清除）</div>`;
  html += `<div id="recordingsSection"><div class="loading">載入錄音中…</div></div>`;

  el.innerHTML = html;
  renderRecordingsSection();
}

async function renderRecordingsSection(){
  const box = document.getElementById('recordingsSection');
  if(!box) return;
  if(!window.indexedDB){ box.innerHTML = '<div class="empty">此瀏覽器不支援本機錄音儲存。</div>'; return; }
  const all = await getAllRecordings();
  if(!all.length){ box.innerHTML = '<div class="empty">目前沒有錄音 — 到 Speaking 頁面錄一段題卡回答後會顯示在這裡。</div>'; return; }
  all.sort((a,b)=> new Date(b.date) - new Date(a.date));
  box.innerHTML = all.map(r=>{
    const dt = new Date(r.date);
    const dtStr = dt.toLocaleDateString()+' '+dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const daysLeft = Math.max(0, REC_RETENTION_DAYS - Math.floor((Date.now()-dt.getTime())/86400000));
    const url = URL.createObjectURL(r.blob);
    return `<div class="wrong-card">
      <div style="font-weight:700;margin-bottom:4px;">${r.topic}</div>
      <div class="hist-meta" style="margin-bottom:6px;">${dtStr} · 剩餘 ${daysLeft} 天</div>
      <audio controls src="${url}" style="display:block;width:100%;margin-bottom:6px;"></audio>
      <button class="smallbtn" onclick="deleteRecording(${r.id}).then(renderRecordingsSection)">刪除</button>
    </div>`;
  }).join('');
}

/* ---------- reading ---------- */
function bestReadingScore(title){
  const hist = loadHistory().filter(h => h.type==='reading' && h.title===title);
  if(!hist.length) return null;
  return hist.reduce((best,h) => (h.score/h.total > best.score/best.total ? h : best), hist[0]);
}
function readingCardHTML(p, i){
  const qcount = p.questions.reduce((s,g)=>s+g.items.length,0);
  const best = bestReadingScore(p.title);
  const passageKey = p.id || p.title;
  const hasDraft = !best && !!loadReadingAnswers(passageKey);
  const doneBadge = best ? `<span class="badge" style="background:#e6f6ec;color:var(--good);">✓ 最佳 ${best.score}/${best.total}</span>` : '';
  const draftBadge = hasDraft ? `<span class="badge" style="background:#fff3d6;color:var(--warn);">📝 進行中，點擊繼續</span>` : '';
  const shortBadge = p.short ? `<span class="badge" style="background:#eef2ff;color:var(--accent);">⚡ 快速練習．約5分鐘</span>` : `<span class="badge">第 ${i+1} 篇</span>`;
  return `<div class="card" onclick="openPassage(${i})">
      ${shortBadge}${doneBadge}${draftBadge}
      <h3>${p.title}</h3>
      <p>${Object.keys(p.paragraphs).length} 段落．${qcount} 題</p>
    </div>`;
}

function renderReadingList(){
  const el = document.getElementById('reading-list');
  if(!state.reading || !state.reading.passages){ el.innerHTML='<div class="empty">找不到 reading-bank.json</div>'; return; }
  const full = [], short = [];
  state.reading.passages.forEach((p,i)=>{ (p.short ? short : full).push([p,i]); });
  let html = full.map(([p,i])=>readingCardHTML(p,i)).join('');
  if(short.length){
    html += `<div class="section-title" style="margin-top:26px;">⚡ 快速練習（短文，題目較少，手機也能幾分鐘做完）</div>`;
    html += short.map(([p,i])=>readingCardHTML(p,i)).join('');
  }
  el.innerHTML = html;
}

let readingTimerId = null;
let readingSecondsLeft = 0;

function openPassage(i){
  stopReadingTimer();
  state.currentPassage = state.reading.passages[i];
  document.getElementById('reading-list').style.display='none';
  const test = document.getElementById('reading-test');
  test.style.display='block';
  const p = state.currentPassage;
  readingSecondsLeft = p.short ? 5*60 : 15*60;

  const passageKey = p.id || p.title;
  const savedHL = loadPassageHighlights()[passageKey];
  const paragraphsHTML = savedHL || Object.entries(p.paragraphs).map(([label,text])=>
    `<p><span class="para-label">${label}</span>${text}</p>`).join('');

  const qgroupsHTML = p.questions.map((g,gi)=>{
    let inner = '';
    if(g.type === 'matching_headings'){
      inner += `<div class="heading-list">${g.headings.join('<br>')}</div>`;
      inner += g.items.map(it=>{
        const opts = g.headings.map(h=>{
          const val = h.split('.')[0].trim();
          return `<option value="${val}">${val}</option>`;
        }).join('');
        return `<div class="qitem" data-type="matching_headings" data-text="Paragraph ${it.paragraph}">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">Paragraph ${it.paragraph}</span>
          <select data-group="${gi}" data-n="${it.n}" data-answer="${it.answer}">
            <option value="">--</option>${opts}
          </select>
          <span class="result" id="res-${it.n}"></span>
        </div>`;
      }).join('');
    } else if(g.type === 'true_false_not_given'){
      inner += g.items.map(it=>`<div class="qitem" data-type="true_false_not_given" data-text="${it.statement.replace(/"/g,'&quot;')}">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">${it.statement}</span>
          <span class="tfng">
            ${['TRUE','FALSE','NOT GIVEN'].map(v=>`<label><input type="radio" name="q${it.n}" value="${v}" data-n="${it.n}" data-answer="${it.answer}"> ${v}</label>`).join('')}
          </span>
          <span class="result" id="res-${it.n}"></span>
        </div>`).join('');
    } else if(g.type === 'sentence_completion'){
      inner += g.items.map(it=>`<div class="qitem" data-type="sentence_completion" data-text="${it.prompt.replace(/"/g,'&quot;')}">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">${it.prompt}</span>
          <input type="text" placeholder="answer" data-n="${it.n}" data-answer="${it.answer}" style="width:140px;">
          <span class="result" id="res-${it.n}"></span>
        </div>`).join('');
    } else if(g.type === 'multiple_choice'){
      inner += g.items.map(it=>{
        const opts = it.options.map(o=>{
          const letter = o.split(')')[0].split('.')[0].trim();
          return `<label style="display:block;margin:3px 0;"><input type="radio" name="q${it.n}" value="${letter}" data-n="${it.n}" data-answer="${it.answer}"> ${o}</label>`;
        }).join('');
        return `<div class="qitem" data-type="multiple_choice" data-text="${it.question.replace(/"/g,'&quot;')}" style="flex-direction:column;align-items:flex-start;">
          <div><span class="qn">${it.n}.</span><span class="qstatement">${it.question}</span></div>
          <div style="margin-left:30px;font-size:14.5px;">${opts}</div>
          <span class="result" id="res-${it.n}"></span>
        </div>`;
      }).join('');
    } else if(g.type === 'summary_completion'){
      if(g.summary) inner += `<div class="heading-list">${g.summary}</div>`;
      if(g.wordBank) inner += `<div class="heading-list">${g.wordBank.join('<br>')}</div>`;
      inner += g.items.map(it=>{
        const opts = (g.wordBank||[]).map(w=>{
          const val = w.split('.')[0].trim();
          return `<option value="${val}">${val}</option>`;
        }).join('');
        return `<div class="qitem" data-type="summary_completion" data-text="Blank ${it.n}">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">Blank ${it.n}</span>
          <select data-n="${it.n}" data-answer="${it.answer}">
            <option value="">--</option>${opts}
          </select>
          <span class="result" id="res-${it.n}"></span>
        </div>`;
      }).join('');
    } else if(g.type === 'matching_information'){
      const paraLetters = state.currentPassage ? Object.keys(state.currentPassage.paragraphs) : [];
      inner += g.items.map(it=>{
        const opts = paraLetters.map(l=>`<option value="${l}">${l}</option>`).join('');
        return `<div class="qitem" data-type="matching_information" data-text="${it.statement.replace(/"/g,'&quot;')}">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">${it.statement}</span>
          <select data-n="${it.n}" data-answer="${it.answer}">
            <option value="">--</option>${opts}
          </select>
          <span class="result" id="res-${it.n}"></span>
        </div>`;
      }).join('');
    }
    return `<div class="qgroup">
      <h4>Questions ${g.group}</h4>
      <div class="instr">${g.instructions}</div>
      ${inner}
    </div>`;
  }).join('');

  test.innerHTML = `
    <button class="backbtn" onclick="stopReadingTimer();closePassage()">&larr; 返回閱讀列表</button>
    <div class="split">
      <div class="passage-box">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <h2 style="margin-top:0;">${p.title}</h2>
          <span style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
            <span id="readingTimerDisplay" style="font-weight:800;font-size:17px;color:var(--accent);white-space:nowrap;">${fmtTime(readingSecondsLeft)}</span>
            <button type="button" class="enlarge-btn" title="標記螢光筆" onpointerdown="event.preventDefault()" onclick="highlightSelection()">🖍</button>
            <button type="button" class="enlarge-btn" title="清除標記" onclick="clearHighlights()">🧹</button>
            <button type="button" class="enlarge-btn" title="放大文章（仍可標記螢光筆）" onclick="openEnlargeLive('passageTextOnly', true)">⛶</button>
          </span>
        </div>
        <div id="passageTextOnly">${paragraphsHTML}</div>
      </div>
      <div class="qbox">
        <form id="qform" onchange="saveReadingAnswers()" oninput="saveReadingAnswers()">${qgroupsHTML}</form>
        <div class="submitbar">
          <span class="score" id="scoreDisplay"></span>
          <button type="button" onclick="gradePassage(false)">對答案</button>
        </div>
      </div>
    </div>
  `;
  restoreReadingAnswers(passageKey);
  startReadingTimer();
}

function startReadingTimer(){
  readingTimerId = setInterval(()=>{
    readingSecondsLeft--;
    const d2 = document.getElementById('readingTimerDisplay');
    if(d2) d2.textContent = fmtTime(Math.max(0,readingSecondsLeft));
    if(readingSecondsLeft <= 60 && d2) d2.style.color = 'var(--bad)';
    if(readingSecondsLeft <= 0){
      gradePassage(true);
    }
  }, 1000);
}

function stopReadingTimer(){
  if(readingTimerId){ clearInterval(readingTimerId); readingTimerId = null; }
}

function closePassage(){
  renderReadingList();
  document.getElementById('reading-test').style.display='none';
  document.getElementById('reading-list').style.display='block';
}

/* ---------- reading in-progress answer autosave (so an accidental exit isn't lost) ---------- */
function readingDraftKey(passageKey){ return `readingDraft_${passageKey}`; }
function saveReadingAnswers(){
  if(!state.currentPassage) return;
  const key = state.currentPassage.id || state.currentPassage.title;
  const form = document.getElementById('qform');
  if(!form) return;
  const answers = {};
  form.querySelectorAll('select[data-n]').forEach(sel=>{ if(sel.value) answers[sel.dataset.n] = sel.value; });
  form.querySelectorAll('input[type=text][data-n]').forEach(inp=>{ if(inp.value) answers[inp.dataset.n] = inp.value; });
  const seen = new Set();
  form.querySelectorAll('input[type=radio][data-n]').forEach(r=>{
    if(seen.has(r.dataset.n)) return;
    const checked = form.querySelector('input[name=q'+r.dataset.n+']:checked');
    if(checked){ answers[r.dataset.n] = checked.value; seen.add(r.dataset.n); }
  });
  try{
    if(Object.keys(answers).length){ localStorage.setItem(readingDraftKey(key), JSON.stringify(answers)); }
    else localStorage.removeItem(readingDraftKey(key));
  }catch(e){}
}
function loadReadingAnswers(key){
  try{ return JSON.parse(localStorage.getItem(readingDraftKey(key)) || 'null'); }catch(e){ return null; }
}
function clearReadingAnswers(key){
  try{ localStorage.removeItem(readingDraftKey(key)); }catch(e){}
}
function restoreReadingAnswers(passageKey){
  const answers = loadReadingAnswers(passageKey);
  if(!answers) return;
  const form = document.getElementById('qform');
  if(!form) return;
  Object.entries(answers).forEach(([n, val])=>{
    const sel = form.querySelector(`select[data-n="${n}"]`);
    if(sel){ sel.value = val; return; }
    const radio = form.querySelector(`input[type=radio][name=q${n}][value="${val}"]`);
    if(radio){ radio.checked = true; return; }
    const inp = form.querySelector(`input[type=text][data-n="${n}"]`);
    if(inp) inp.value = val;
  });
}

function gradePassage(autoSubmitted){
  stopReadingTimer();
  const form = document.getElementById('qform');
  let correct=0, total=0;
  const wrongItems = [];
  const passageTitle = state.currentPassage ? state.currentPassage.title : '';

  form.querySelectorAll('select[data-answer]').forEach(sel=>{
    total++;
    const res = document.getElementById('res-'+sel.dataset.n);
    const qitem = sel.closest('.qitem');
    const qtext = qitem ? qitem.dataset.text : '';
    if(sel.value && sel.value.toLowerCase()===sel.dataset.answer.toLowerCase()){ correct++; res.textContent='✓'; res.className='result correct'; }
    else {
      res.textContent='✗ ('+sel.dataset.answer+')'; res.className='result wrong';
      wrongItems.push({passageTitle, n:sel.dataset.n, text:qtext, yourAnswer:sel.value, correctAnswer:sel.dataset.answer});
    }
  });
  const seen = new Set();
  form.querySelectorAll('input[type=radio][data-answer]').forEach(r=>{
    if(seen.has(r.dataset.n)) return;
    const checked = form.querySelector('input[name=q'+r.dataset.n+']:checked');
    total++; seen.add(r.dataset.n);
    const res = document.getElementById('res-'+r.dataset.n);
    const qitem = r.closest('.qitem');
    const qtext = qitem ? qitem.dataset.text : '';
    if(checked && checked.value===r.dataset.answer){ correct++; res.textContent='✓'; res.className='result correct'; }
    else {
      res.textContent='✗ ('+r.dataset.answer+')'; res.className='result wrong';
      wrongItems.push({passageTitle, n:r.dataset.n, text:qtext, yourAnswer:checked?checked.value:'', correctAnswer:r.dataset.answer});
    }
  });
  form.querySelectorAll('input[type=text][data-answer]').forEach(inp=>{
    total++;
    const res = document.getElementById('res-'+inp.dataset.n);
    const qitem = inp.closest('.qitem');
    const qtext = qitem ? qitem.dataset.text : '';
    const norm = s => (s||'').trim().toLowerCase();
    if(norm(inp.value)===norm(inp.dataset.answer)){ correct++; res.textContent='✓'; res.className='result correct'; }
    else {
      res.textContent='✗ ('+inp.dataset.answer+')'; res.className='result wrong';
      wrongItems.push({passageTitle, n:inp.dataset.n, text:qtext, yourAnswer:inp.value, correctAnswer:inp.dataset.answer});
    }
  });
  const scoreEl = document.getElementById('scoreDisplay');
  scoreEl.textContent = (autoSubmitted ? "⏰ 時間到 — " : '') + `分數：${correct} / ${total}`;

  saveHistoryEntry({ type:'reading', title: passageTitle, score: correct, total });
  addWrongAnswers(wrongItems);
  syncToBackend('reading_score', { title: passageTitle, score: correct, total });
  wrongItems.forEach(w => syncToBackend('wrong_answer', w));
  if(state.currentPassage){ clearReadingAnswers(state.currentPassage.id || state.currentPassage.title); }
}

/* ---------- chart rendering helpers ---------- */
const PALETTE = ['#2f6fed','#e0673f','#1c8a4b','#b8860b','#8b5cf6','#0891b2'];

function svgLineChart(chart){
  const W=760,H=380,padL=54,padR=20,padT=28,padB=40;
  const allVals = chart.series.flatMap(s=>s.values);
  const max = Math.max(...allVals)*1.15, min = Math.min(0, Math.min(...allVals));
  const n = chart.labels.length;
  const x = i => padL + (W-padL-padR) * (i/(n-1));
  const y = v => H-padB - (H-padT-padB) * ((v-min)/(max-min || 1));
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">`;
  const gridSteps = 4;
  for(let g=0; g<=gridSteps; g++){
    const v = min + (max-min)*g/gridSteps;
    const gy = y(v);
    svg += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="#eceff3"/>`;
    svg += `<text x="${padL-8}" y="${gy+4}" font-size="12" fill="#5b6472" text-anchor="end">${Math.round(v*10)/10}</text>`;
  }
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#8a92a0"/>`;
  chart.labels.forEach((l,i)=>{ svg += `<text x="${x(i)}" y="${H-padB+22}" font-size="12" fill="#5b6472" text-anchor="middle">${l}</text>`; });
  chart.series.forEach((s,si)=>{
    const color = PALETTE[si%PALETTE.length];
    const pts = s.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3"/>`;
    s.values.forEach((v,i)=>{
      svg += `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${color}"/>`;
      svg += `<text x="${x(i)}" y="${y(v)-10}" font-size="11" font-weight="700" fill="${color}" text-anchor="middle">${v}</text>`;
    });
  });
  svg += '</svg>';
  const legend = chart.series.map((s,si)=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:13px;"><span style="width:11px;height:11px;background:${PALETTE[si%PALETTE.length]};border-radius:2px;display:inline-block;"></span>${s.name}</span>`).join('');
  return `<div>${svg}<div style="margin-top:8px;">${legend}</div>${chart.unit?`<div style="font-size:12px;color:var(--sub);margin-top:3px;">Unit: ${chart.unit}</div>`:''}</div>`;
}

function svgBarChart(chart){
  const W=760,H=380,padL=54,padR=20,padT=28,padB=40;
  const allVals = chart.series.flatMap(s=>s.values);
  const max = Math.max(...allVals)*1.2;
  const n = chart.labels.length, sN = chart.series.length;
  const groupW = (W-padL-padR)/n;
  const barW = Math.min(40, (groupW*0.72)/sN);
  const y = v => H-padB - (H-padT-padB) * (v/max);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">`;
  const gridSteps = 4;
  for(let g=0; g<=gridSteps; g++){
    const v = max*g/gridSteps;
    const gy = y(v);
    svg += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="#eceff3"/>`;
    svg += `<text x="${padL-8}" y="${gy+4}" font-size="12" fill="#5b6472" text-anchor="end">${Math.round(v*10)/10}</text>`;
  }
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#8a92a0"/>`;
  chart.labels.forEach((l,i)=>{
    const gx = padL + groupW*i + groupW/2;
    svg += `<text x="${gx}" y="${H-padB+22}" font-size="12" fill="#5b6472" text-anchor="middle">${l}</text>`;
    chart.series.forEach((s,si)=>{
      const v = s.values[i];
      const bx = gx - (sN*barW)/2 + si*barW;
      svg += `<rect x="${bx}" y="${y(v)}" width="${barW-2}" height="${H-padB-y(v)}" fill="${PALETTE[si%PALETTE.length]}" rx="2"/>`;
      svg += `<text x="${bx+(barW-2)/2}" y="${y(v)-6}" font-size="10.5" font-weight="700" fill="${PALETTE[si%PALETTE.length]}" text-anchor="middle">${v}</text>`;
    });
  });
  svg += '</svg>';
  const legend = sN>1 ? chart.series.map((s,si)=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px;"><span style="width:10px;height:10px;background:${PALETTE[si%PALETTE.length]};border-radius:2px;display:inline-block;"></span>${s.name}</span>`).join('') : '';
  return `<div>${svg}<div style="margin-top:6px;">${legend}</div>${chart.unit?`<div style="font-size:11px;color:var(--sub);margin-top:2px;">Unit: ${chart.unit}</div>`:''}</div>`;
}

function svgPieSet(chart){
  const R=80;
  const pieSVG = (pie)=>{
    const total = pie.values.reduce((a,b)=>a+b,0);
    let angle = -Math.PI/2, path='';
    const cx=R+6, cy=R+6;
    pie.values.forEach((v,i)=>{
      const frac = v/total, a2 = angle + frac*2*Math.PI;
      const x1=cx+R*Math.cos(angle), y1=cy+R*Math.sin(angle);
      const x2=cx+R*Math.cos(a2), y2=cy+R*Math.sin(a2);
      const large = frac>0.5?1:0;
      const mid = angle + (a2-angle)/2;
      const lx = cx + (R*0.65)*Math.cos(mid), ly = cy + (R*0.65)*Math.sin(mid);
      path += `<path d="M${cx},${cy} L${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} Z" fill="${PALETTE[i%PALETTE.length]}"/>`;
      if(frac>0.05) path += `<text x="${lx}" y="${ly}" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">${v}%</text>`;
      angle = a2;
    });
    return `<div style="text-align:center;">
      <svg viewBox="0 0 ${(R+6)*2} ${(R+6)*2}" width="190" height="190">${path}</svg>
      <div style="font-weight:700;font-size:14px;margin-top:6px;">${pie.year}</div>
    </div>`;
  };
  const legend = chart.pies[0].labels.map((l,i)=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:13px;"><span style="width:11px;height:11px;background:${PALETTE[i%PALETTE.length]};border-radius:2px;display:inline-block;"></span>${l}</span>`).join('');
  return `<div style="display:flex;gap:24px;flex-wrap:wrap;">${chart.pies.map(pieSVG).join('')}</div><div style="margin-top:10px;">${legend}</div>`;
}

function htmlTable(chart){
  let html = `<div class="scrollx"><table style="width:100%;border-collapse:collapse;font-size:13px;">
    <tr><th style="text-align:left;border-bottom:2px solid var(--line);padding:6px;">${chart.rowLabel||''}</th>${chart.columns.map(c=>`<th style="text-align:right;border-bottom:2px solid var(--line);padding:6px;">${c}</th>`).join('')}</tr>`;
  chart.rows.forEach(r=>{
    html += `<tr><td style="padding:6px;border-bottom:1px solid var(--line);font-weight:600;">${r.label}</td>${r.values.map(v=>`<td style="text-align:right;padding:6px;border-bottom:1px solid var(--line);">${v}</td>`).join('')}</tr>`;
  });
  html += '</table></div>';
  if(chart.unit) html += `<div style="font-size:11px;color:var(--sub);margin-top:6px;">Unit: ${chart.unit}</div>`;
  return html;
}

function processSteps(chart){
  return `<ol style="margin:0;padding-left:20px;font-size:13.5px;line-height:1.9;">${chart.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`;
}

function mapCompare(chart){
  let html = `<div class="scrollx"><table style="width:100%;border-collapse:collapse;font-size:13px;"><tr>${chart.columns.map(c=>`<th style="text-align:left;border-bottom:2px solid var(--line);padding:6px;color:var(--accent);">${c}</th>`).join('')}</tr>`;
  chart.rows.forEach(r=>{
    html += `<tr>${r.map(cell=>`<td style="padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;">${cell}</td>`).join('')}</tr>`;
  });
  html += '</table></div>';
  return html;
}

function renderChart(item){
  if(!item.chart) return '';
  const wrap = inner => `<div style="background:var(--chip);border-radius:8px;padding:14px;margin-top:10px;">${inner}</div>`;
  switch(item.chart_type){
    case 'line': return wrap(svgLineChart(item.chart));
    case 'bar': return wrap(svgBarChart(item.chart));
    case 'pie': return wrap(svgPieSet(item.chart));
    case 'table': return wrap(htmlTable(item.chart));
    case 'process': return wrap(processSteps(item.chart));
    case 'map': return wrap(mapCompare(item.chart));
    default: return '';
  }
}

/* ---------- writing ---------- */
function renderWriting(){
  const el = document.getElementById('writing-list');
  if(!state.writing){ el.innerHTML='<div class="empty">找不到 writing-bank.json</div>'; return; }
  const draftTag = `<span class="tag" style="background:#fff3d6;color:#8a6400;">📝 草稿，點擊繼續</span>`;
  let html = '<div class="section-title">Task 1－學術類（點選題目查看圖表並開始寫作）</div>';
  const chartTypeNames = { line:'折線圖', bar:'長條圖', pie:'圓餅圖', table:'表格', process:'流程圖', map:'地圖比較' };
  const chartTypeOrder = ['line','bar','pie','table','process','map'];
  const task1Items = (state.writing.task1_academic||[]).map((t,i)=>({ t, i }));
  chartTypeOrder.forEach(ct=>{
    const group = task1Items.filter(x=>x.t.chart_type===ct);

    html += group.map(({t,i})=>{

      return `<div class="prompt-item" style="cursor:pointer;" onclick="openTask1(${i})">${hasDraft?draftTag:''}${t.prompt}</div>`;
    }).join('');
  });

  html += '<div class="section-title">Task 2－作文（點選題目開始寫作）</div>';
  const cats = state.writing.task2_essay || {};
  const catNames = { education:'教育', environment:'環境', society_government:'社會與政府', work_economy:'工作與經濟', media_technology:'媒體與科技' };
  Object.entries(cats).forEach(([cat, prompts])=>{
    html += `<div class="section-title" style="font-size:13px;color:var(--sub);margin-top:16px;">${catNames[cat]||cat.replace(/_/g,' ')}</div>`;
    html += prompts.map((p,pi)=>{
      const text = typeof p === 'string' ? p : p.prompt;
      const hasDraft = !!loadEssayDraft({ kind:'task2', cat, i:pi });
      return `<div class="prompt-item" style="cursor:pointer;" onclick="openTask2('${cat}',${pi})">${hasDraft?draftTag:''}${text}</div>`;
    }).join('');
  });
  el.innerHTML = html;
}

let essayTimerId = null;
let essaySecondsLeft = 0;
let taskCtx = null; // { kind:'task1'|'task2', cat, i, minWords, durationMin, modelAnswer }

/* ---------- essay draft autosave (with cross-device sync via backend) ---------- */
function essayDraftKey(ctx){
  return ctx.kind === 'task1' ? `essayDraft_task1_${ctx.i}` : `essayDraft_task2_${ctx.cat}_${ctx.i}`;
}
let draftSyncTimer = null;
function saveEssayDraft(){
  if(!taskCtx) return;
  const box = document.getElementById('essayBox');
  if(!box) return;
  const key = essayDraftKey(taskCtx);
  const nowIso = new Date().toISOString();
  try{
    localStorage.setItem(key, box.value);
    localStorage.setItem(key+'_ts', nowIso);
  }catch(e){}
  if(BACKEND_URL){
    clearTimeout(draftSyncTimer);
    draftSyncTimer = setTimeout(()=>{ syncToBackend('draft', { ctx: key, text: box.value }); }, 2000);
  }
}
function loadEssayDraft(ctx){
  const key = essayDraftKey(ctx);
  let text = '';
  try{ text = localStorage.getItem(key) || ''; }catch(e){}
  const remote = remoteDraftsCache && remoteDraftsCache[key];
  if(remote){
    let localTs = '';
    try{ localTs = localStorage.getItem(key+'_ts') || ''; }catch(e){}
    if(!localTs || new Date(remote.ts) > new Date(localTs)){
      text = remote.text || '';
      try{ localStorage.setItem(key, text); localStorage.setItem(key+'_ts', remote.ts); }catch(e){}
    }
  }
  return text;
}
function clearEssayDraft(ctx){
  const key = essayDraftKey(ctx||taskCtx);
  if(BACKEND_URL){ syncToBackend('draft', { ctx: key, text: '' }); }
  try{
    localStorage.removeItem(key);
    localStorage.removeItem(key+'_ts');
  }catch(e){}
}

      <textarea id="essayBox" rows="16"

function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function startEssayTimer(){
  essayTimerId = setInterval(()=>{
    essaySecondsLeft--;
    const d = document.getElementById('timerDisplay');
    if(d) d.textContent = fmtTime(Math.max(0,essaySecondsLeft));
    if(essaySecondsLeft <= 60 && d) d.style.color = 'var(--bad)';
    if(essaySecondsLeft <= 0){
      finishEssay(true);
    }
  }, 1000);
}

function stopEssayTimer(){
  if(essayTimerId){ clearInterval(essayTimerId); essayTimerId = null; }
}

function updateWordCount(min){
  const box = document.getElementById('essayBox');
  if(!box) return;
  const text = box.value.trim();
  const words = text.length ? text.split(/\s+/).length : 0;
  const el = document.getElementById('wordCount');
  el.textContent = `${words} / ${min} 字`;
  el.style.color = words>=min ? 'var(--good)' : 'var(--sub)';
}

function toggleModelAnswer(){
  const box = document.getElementById('modelAnswerBox');
  if(box) box.style.display = box.style.display==='none' ? 'block' : 'none';
}

function finishEssay(autoSubmitted){
  stopEssayTimer();
  const ctx = taskCtx || { kind:'task2', minWords:250 };
  const minWords = ctx.minWords;
  const box = document.getElementById('essayBox');
  const text = box ? box.value.trim() : '';
  const words = text.length ? text.split(/\s+/).length : 0;
  const paragraphs = text.split(/\n\s*\n/).filter(p=>p.trim().length>0).length;
  const linkers = ['however','therefore','moreover','furthermore','in addition','for example','for instance',
    'in conclusion','on the other hand','as a result','consequently','in contrast','firstly','secondly','finally',
    'overall','compared to','compared with','whereas','while','in contrast to'];
  const lowerText = text.toLowerCase();
  const linkersUsed = linkers.filter(l=>lowerText.includes(l));
  const hasNumbers = /\d/.test(text);

  const checks = ctx.kind === 'task1' ? [
    { label: `至少 ${minWords} 字`, pass: words>=minWords, detail: `已寫 ${words} 字` },
    { label: '至少 2 段（總覽＋細節）', pass: paragraphs>=2, detail: `偵測到 ${paragraphs} 段` },
    { label: '包含圖表中的具體數據', pass: hasNumbers, detail: hasNumbers ? '報告中有找到數字' : '未偵測到數字' },
    { label: '使用比較／報告用語', pass: linkersUsed.length>=1, detail: linkersUsed.length ? `已使用：${linkersUsed.join(', ')}` : '未偵測到' }
  ] : [
    { label: `至少 ${minWords} 字`, pass: words>=minWords, detail: `已寫 ${words} 字` },
    { label: '至少 4 段（前言／論述／論述／結論）', pass: paragraphs>=4, detail: `偵測到 ${paragraphs} 段` },
    { label: '使用連接詞串連論點', pass: linkersUsed.length>=2, detail: linkersUsed.length ? `已使用：${linkersUsed.join(', ')}` : '未偵測到' }
  ];
  const checksPassed = checks.filter(c=>c.pass).length;

  const modelAnswerHTML = ctx.modelAnswer ? `
      <div class="qgroup">
        <h4>範文參考</h4>
        <div class="instr">這只是其中一種高分寫法，並非唯一正確答案 — 請把它當作結構和用字的參考，不要逐字背誦。</div>
        <button type="button" class="smallbtn" onclick="toggleModelAnswer()">顯示／隱藏範文</button>
        <div id="modelAnswerBox" style="display:none;white-space:pre-wrap;font-size:13.5px;line-height:1.75;background:var(--chip);border-radius:8px;padding:14px;margin-top:10px;">${ctx.modelAnswer.replace(/</g,'&lt;')}</div>
      </div>` : '';

  const el = document.getElementById('writing-list');
  el.innerHTML = `
    <button class="backbtn" onclick="renderWriting()">&larr; 返回寫作列表</button>
    <div class="qbox">
      <h3 style="margin-top:0;">${autoSubmitted ? "⏰ 時間到 — 已自動送出" : '檢視結果'}</h3>
      <div class="qgroup">
        <h4>結構自我檢查</h4>
        <div class="instr">這只是機械式檢查（字數／段落／連接詞），不是真正的雅思分數 — 文法、連貫性與題目回應仍需要老師或 AI 批改。</div>
        ${checks.map(c=>`<div class="qitem"><span class="result ${c.pass?'correct':'wrong'}" style="font-size:15px;">${c.pass?'✓':'✗'}</span><span class="qstatement">${c.label} <span style="color:var(--sub);">— ${c.detail}</span></span></div>`).join('')}
      </div>
      <div class="qgroup">
        <h4>你的作文</h4>
        <div style="white-space:pre-wrap;font-size:13.5px;line-height:1.7;background:var(--chip);border-radius:8px;padding:14px;">${text ? text.replace(/</g,'&lt;') : '<span style="color:var(--sub);">（尚未作答）</span>'}</div>
      </div>
      ${modelAnswerHTML}
    </div>
  `;

  const historyTitle = (ctx.kind==='task1' ? 'Task 1：' : 'Task 2：') + (ctx.promptText||'').slice(0,70) + ((ctx.promptText||'').length>70?'…':'');
  saveHistoryEntry({ type:'writing', title: historyTitle, checksPassed, checksTotal: checks.length });
  syncToBackend('writing_score', { title: historyTitle, checksPassed, checksTotal: checks.length });
  clearEssayDraft(ctx);
}

function renderSpeaking(){

/* Maps each Part 2 cue card's index to the most closely related Part 3
   discussion theme index, so drawing a cue card immediately surfaces the
   examiner-style follow-up questions on the same topic, just like the real
   exam structure (Part 3 builds directly on the Part 2 topic). */
const CUE_TO_PART3 = [9,3,0,0,5,0,0,5,2,9,4,5,2,9,3,1,11,5,14,5,4,7,3,8,9,5,16,9,0,8,1,8,5,0,8,4,4,8,5,4,5,5,5,1,10,7,1,1,8,5,9,9,9,9,2,2,11,5,10,10,11,10,5,12,1,13,14,12,3,3,13,5,5,15,16,3,
  8,3,4,17,0,18,4,9,18,9,9,9,4,17,10,10,5,5,18];

function linkedPart3HTML(cardIndex){
  const idx = CUE_TO_PART3[cardIndex];

  if(!set) return '';

      ${usefulWordsHTML(set.useful_words)}
      <ul>${set.questions.map(q=>`<li>${q}</li>`).join('')}</ul>
    </div>`;
}
function cueCardHTML(card, cardIndex){
  return `<div style="font-weight:700;margin-bottom:8px;">${card.topic}</div>
    ${usefulWordsHTML(card.useful_words)}
    <div style="font-size:12.5px;color:var(--sub);margin-bottom:4px;">You should say:</div>
    <ul style="margin:0 0 10px;padding-left:18px;">${card.points.map(p=>`<li>${p}</li>`).join('')}</ul>

    ${linkedPart3HTML(cardIndex)}`;
}
function nextCue(){
  const cards = state.speaking.part2_cue_cards;
  cueIndex = Math.floor(Math.random()*cards.length);
  document.getElementById('cueCard').innerHTML = cueCardHTML(cards[cueIndex], cueIndex);
  setupRecorder();
}

/* ---------- speech recording (MediaRecorder + IndexedDB, ~7-day local retention) ---------- */
let mediaRecorder = null, recordedChunks = [], currentStream = null;
const REC_RETENTION_DAYS = 7;
let recDBPromise = null;
function openRecDB(){
  if(recDBPromise) return recDBPromise;
  recDBPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open('ieltsRecordingsDB', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains('recordings')){
        const store = db.createObjectStore('recordings', { keyPath:'id', autoIncrement:true });
        store.createIndex('date', 'date');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return recDBPromise;
}
async function saveRecording(topic, blob){
  try{
    const db = await openRecDB();
    return new Promise((resolve)=>{
      const tx = db.transaction('recordings','readwrite');
      tx.objectStore('recordings').add({ topic, blob, date: new Date().toISOString() });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  }catch(e){ return false; }
}
async function getAllRecordings(){
  try{
    const db = await openRecDB();
    return new Promise((resolve)=>{
      const tx = db.transaction('recordings','readonly');
      const req = tx.objectStore('recordings').getAll();
      req.onsuccess = () => resolve(req.result||[]);
      req.onerror = () => resolve([]);
    });
  }catch(e){ return []; }
}
async function deleteRecording(id){
  try{
    const db = await openRecDB();
    const tx = db.transaction('recordings','readwrite');
    tx.objectStore('recordings').delete(id);
  }catch(e){}
}
async function purgeOldRecordings(){
  try{
    const db = await openRecDB();
    const all = await getAllRecordings();
    const cutoff = Date.now() - REC_RETENTION_DAYS*24*60*60*1000;
    const tx = db.transaction('recordings','readwrite');
    const store = tx.objectStore('recordings');
    all.forEach(r => { if(new Date(r.date).getTime() < cutoff) store.delete(r.id); });
  }catch(e){}
}

function setupRecorder(){
  const zone = document.getElementById('recorderZone');
  if(!zone) return;
  const supported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder && window.indexedDB);
  if(!supported){
    zone.innerHTML = `<div class="hist-meta">此瀏覽器不支援錄音功能。</div>`;
    return;
  }
  zone.innerHTML = `
    <div class="rec-row">
      <button type="button" class="smallbtn" id="recBtn" onclick="toggleRecording()">🎙️ 開始錄音</button>
      <span id="recStatus" class="hist-meta"></span>
    </div>
    <div id="recPlayback"></div>
  `;
}
async function toggleRecording(){
  const btn = document.getElementById('recBtn');
  const status = document.getElementById('recStatus');
  const zone = document.getElementById('recorderZone');
  const topic = zone ? zone.dataset.topic : '口說練習';
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
    return;
  }
  try{
    currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){
    if(status) status.textContent = '麥克風權限被拒絕。';
    return;
  }
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(currentStream);
  mediaRecorder.ondataavailable = e => { if(e.data && e.data.size) recordedChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
    const url = URL.createObjectURL(blob);
    const pb = document.getElementById('recPlayback');
    if(pb) pb.innerHTML = `<audio controls src="${url}" style="display:block;margin-top:8px;"></audio>`;
    currentStream.getTracks().forEach(t=>t.stop());
    if(btn) btn.textContent = '🎙️ 重新錄音';
    const saved = await saveRecording(topic, blob);
    if(status) status.textContent = saved ? `錄音已儲存在這台裝置上，約 ${REC_RETENTION_DAYS} 天後自動清除。` : '錄音暫存失敗，只能在這次瀏覽中播放。';
  };
  mediaRecorder.start();
  if(btn) btn.textContent = '⏹ 停止錄音';
  if(status) status.textContent = '錄音中…';
}

init();
