<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>IELTS Practice</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#1b1f27; --sub:#5b6472;
    --line:#e3e6eb; --accent:#2f6fed; --accent-ink:#ffffff;
    --good:#1c8a4b; --bad:#c9432c; --warn:#b8860b;
    --chip:#eef2ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia,"Times New Roman","Noto Serif TC","Noto Sans TC",serif;background:var(--bg);color:var(--ink);}
  header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px;}
  header .wrap{display:flex;align-items:center;justify-content:space-between;min-height:56px;flex-wrap:wrap;gap:6px;padding-top:8px;padding-bottom:8px;}
  header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.3px;white-space:nowrap;}
  nav{display:flex;gap:6px;flex-wrap:wrap;}
  nav button{border:none;background:transparent;color:var(--sub);font-size:16px;font-weight:700;padding:12px 18px;border-radius:10px;cursor:pointer;white-space:nowrap;}
  nav button.active{background:var(--accent);color:var(--accent-ink);}
  main{max-width:960px;margin:0 auto;padding:20px 16px 80px;}
  .view{display:none;} .view.active{display:block;}

  /* list cards */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:box-shadow .15s, transform .15s;}
  .card:hover{box-shadow:0 4px 14px rgba(20,30,60,.08);transform:translateY(-1px);}
  .card h3{margin:0 0 4px;font-size:16px;}
  .card p{margin:0;color:var(--sub);font-size:13px;}
  .badge{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--chip);padding:2px 8px;border-radius:999px;margin-right:6px;}
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;}
  @media(max-width:600px){.cat-grid{grid-template-columns:1fr;}}
  .cat-grid .card{margin-bottom:0;}
  .browse-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .browse-toggle button{border:1px solid var(--line);background:var(--panel);color:var(--sub);font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer;}
  .browse-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .qtype-tip{background:#fff3d6;border:1px solid #f0c46b;color:#8a6400;font-size:13.5px;line-height:1.7;padding:12px 16px;border-radius:10px;margin-bottom:16px;}

  /* mock exam */
  .mock-tab{border:1px solid var(--line);background:var(--panel);color:var(--sub);font-size:13.5px;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer;}
  .mock-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .mock-passage-panel{display:none;}
  .mock-passage-panel.active{display:block;}

  /* passage/test view */
  .backbtn{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:14px;margin-bottom:14px;padding:0;}
  .split{display:grid;grid-template-columns:1fr;gap:20px;}
  @media(min-width:860px){.split{grid-template-columns:1.1fr 10px 1fr;gap:0;}}
  .split-resizer{display:none;}
  @media(min-width:860px){
    .split-resizer{display:block;cursor:col-resize;position:relative;touch-action:none;}
    .split-resizer::after{content:'';position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;background:var(--line);border-radius:2px;transition:background .15s;}
    .split-resizer:hover::after,.split-resizer.dragging::after{background:var(--accent);}
  }
  .passage-box, .qbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;}
  @media(min-width:860px){.passage-box{position:sticky;top:66px;max-height:78vh;overflow-y:auto;margin-right:10px;}}
  @media(min-width:860px){.qbox{margin-left:10px;}}
  .passage-box h2{font-size:19px;margin-top:0;}
  .passage-box p{line-height:1.8;font-size:16px;}
  .para-label{font-weight:800;color:var(--accent);margin-right:6px;}
  mark.hl{background:#fff59d;padding:0 1px;border-radius:2px;cursor:pointer;}
  mark.hl:hover{background:#ffe066;}
  .qgroup{margin-bottom:26px;}
  .qgroup h4{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin:0 0 4px;}
  .qgroup .instr{font-size:14px;color:var(--sub);margin-bottom:12px;font-style:italic;}
  .heading-list{background:var(--chip);border-radius:8px;padding:12px 16px;font-size:15px;line-height:1.8;margin-bottom:12px;}
  .qitem{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:15px;flex-wrap:wrap;}
  .qitem .qn{font-weight:700;color:var(--sub);min-width:22px;}
  .qitem select, .qitem input[type=text]{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:15px;}
  .tfng label{display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:14px;cursor:pointer;}
  .qstatement{flex:1;min-width:200px;}
  .result{font-size:12px;font-weight:700;margin-left:4px;}
  .result.correct{color:var(--good);}
  .result.wrong{color:var(--bad);}
  .qexplain{width:100%;margin-top:8px;background:#fff3d6;border-left:3px solid var(--warn);padding:9px 12px;border-radius:6px;font-size:13.5px;line-height:1.65;color:var(--ink);}
  .qexplain-lbl{display:block;font-weight:700;color:var(--warn);font-size:12px;margin-bottom:3px;}
  .submitbar{background:var(--panel);border-top:1px solid var(--line);padding:14px 0;margin-top:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .submitbar button{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;}
  .score{font-weight:800;font-size:15px;}
  table{max-width:100%;}
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  /* writing/speaking */
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .chip-row span{background:var(--chip);color:var(--accent);font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;}
  .section-title{font-size:16px;font-weight:800;margin:22px 0 10px;text-transform:capitalize;}
  .prompt-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px;font-size:15px;line-height:1.65;}
  .prompt-item .tag{font-size:11px;font-weight:700;color:#fff;background:#8b98ab;padding:1px 7px;border-radius:5px;margin-right:8px;}
  .cue-card{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:18px;font-size:15px;line-height:1.75;margin-bottom:10px;}
  .flipbtn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;margin-bottom:16px;margin-right:8px;}
  .part3set{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .part3set h4{margin:0 0 8px;font-size:14px;color:var(--accent);}
  .part3set ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.8;}
  .loading, .empty{color:var(--sub);padding:40px 0;text-align:center;font-size:14px;}
  .word-chip{background:var(--chip);color:var(--accent);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-block;margin:2px 4px 2px 0;}
  .useful-words{margin:8px 0 12px;}
  .useful-words .lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin-right:6px;}
  .smallbtn{background:none;border:1px solid var(--line);color:var(--sub);font-size:12px;font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer;}
  .smallbtn:hover{border-color:var(--accent);color:var(--accent);}

  /* enlarge (magnifier) */
  .enlarge-btn{background:none;border:1px solid var(--line);color:var(--sub);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;flex-shrink:0;}
  .enlarge-btn:hover{border-color:var(--accent);color:var(--accent);}
  #enlargeOverlay{display:none;position:fixed;inset:0;background:rgba(20,24,33,.72);z-index:100;padding:24px;overflow-y:auto;}
  #enlargeOverlay.active{display:block;}
  #enlargeOverlay .sheet{background:var(--panel);max-width:900px;margin:0 auto;border-radius:14px;padding:28px;position:relative;font-size:19px;line-height:1.85;}
  #enlargeOverlay .sheet p{font-size:19px;line-height:1.9;}
  #enlargeOverlay .closebtn{position:sticky;top:0;float:right;background:var(--ink);color:#fff;border:none;width:34px;height:34px;border-radius:999px;cursor:pointer;font-size:16px;margin-bottom:10px;}
  #enlargeToolbar{float:right;clear:right;display:flex;gap:6px;margin:0 0 10px;}
  #enlargeToolbar .enlarge-btn{background:var(--panel);}

  /* history / review */
  .hist-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:9px 0;font-size:13.5px;flex-wrap:wrap;}
  .hist-row:last-child{border-bottom:none;}
  .hist-meta{color:var(--sub);font-size:12px;}
  .wrong-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px;font-size:13.5px;}
  .wrong-card .yr{color:var(--bad);}
  .wrong-card .cr{color:var(--good);}

  /* recording */
  .rec-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;}
  audio{max-width:100%;}

  /* dashboard: countdown + changelog */
  #dashboard-strip{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:20px;}
  @media(min-width:700px){#dashboard-strip{grid-template-columns:1fr 1.3fr;}}
  .countdown-card{background:var(--ink);color:#fff;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:6px;}
  .countdown-card .cd-label{font-size:13px;color:#c7ccd6;}
  .countdown-card .cd-days{font-size:34px;font-weight:800;color:#ffd166;line-height:1.1;}
  .countdown-card .cd-days span{font-size:16px;font-weight:600;color:#fff;margin-left:4px;}
  .countdown-card .cd-date{font-size:12.5px;color:#9aa1ae;margin-top:2px;}
  .countdown-card .cd-editrow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .countdown-card input[type=date]{border:none;border-radius:6px;padding:6px 8px;font-size:13px;}
  .countdown-card .cd-setbtn{background:#ffd166;color:#1b1f27;border:none;padding:6px 12px;border-radius:6px;font-weight:700;font-size:12.5px;cursor:pointer;}
  .countdown-card .cd-clearbtn{background:none;border:1px solid #4a5162;color:#c7ccd6;padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;}
  .updates-trigger{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:100%;min-height:64px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;}
  .updates-trigger:hover{border-color:var(--accent);color:var(--accent);}
  .update-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .update-row:last-child{border-bottom:none;}
  .update-row .u-date{color:var(--sub);white-space:nowrap;font-size:12px;padding-top:1px;}
  .update-row .u-text{line-height:1.5;}
  #updatesModal{display:none;position:fixed;inset:0;background:rgba(20,24,33,.72);z-index:110;padding:24px;overflow-y:auto;}
  #updatesModal.active{display:block;}
  #updatesModal .sheet{background:var(--panel);max-width:520px;margin:40px auto;border-radius:14px;padding:24px;position:relative;}
  #updatesModal h4{margin:0 0 12px;font-size:15px;}
  #updatesModal .closebtn{position:absolute;top:16px;right:16px;background:var(--ink);color:#fff;border:none;width:30px;height:30px;border-radius:999px;cursor:pointer;font-size:14px;}

  /* AI feedback (demo) */
  #aiFeedbackModal{display:none;position:fixed;inset:0;background:rgba(20,24,33,.72);z-index:110;padding:20px;overflow-y:auto;}
  #aiFeedbackModal.active{display:block;}
  #aiFeedbackModal .sheet{background:var(--panel);max-width:600px;margin:20px auto 40px;border-radius:14px;padding:22px;position:relative;}
  #aiFeedbackModal .closebtn{position:absolute;top:16px;right:16px;background:var(--ink);color:#fff;border:none;width:30px;height:30px;border-radius:999px;cursor:pointer;font-size:14px;}
  .disclaimer-banner{background:#fff3d6;border:1px solid #f0c46b;color:#8a6400;font-size:12.5px;padding:8px 12px;border-radius:8px;margin-bottom:16px;}
  .score-hero{display:flex;align-items:center;gap:20px;margin-bottom:18px;flex-wrap:wrap;}
  .score-gauge{width:96px;height:96px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--accent) calc(var(--pct)*1%), var(--line) 0);}
  .score-gauge-inner{width:74px;height:74px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .score-gauge-inner b{font-size:22px;line-height:1;}
  .score-gauge-inner span{font-size:10.5px;color:var(--sub);margin-top:2px;}
  .score-meta .lbl{font-size:12.5px;color:var(--sub);}
  .score-meta b{font-size:26px;color:var(--accent);display:block;margin:2px 0;}
  .subscore-row{margin-bottom:10px;}
  .subscore-row .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .subscore-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;}
  .subscore-bar > div{height:100%;border-radius:99px;background:var(--accent);}
  .subscore-bar.warn > div{background:var(--warn);}
  .ai-section{margin-top:16px;}
  .ai-section h5{margin:0 0 8px;font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;}
  .ai-section p{font-size:13.5px;line-height:1.7;margin:0;}
  .ai-section ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.8;}
  .strength-list li{color:var(--good);}
  .improve-list li{color:var(--bad);}
  .action-plan{background:#fff8e8;border:1px solid #f0c46b;border-radius:12px;padding:14px 16px;margin-top:16px;}
  .action-plan h5{margin:0 0 10px;font-size:14px;color:#8a6400;display:flex;align-items:center;gap:6px;}
  .action-plan .ap-block{margin-bottom:10px;}
  .action-plan .ap-block:last-child{margin-bottom:0;}
  .action-plan .ap-crit{font-weight:800;font-size:13px;color:#8a6400;margin-bottom:4px;}
  .action-plan ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.8;color:#5c4a00;}
  .shadow-sent{transition:background .15s;border-radius:3px;}
  .shadow-sent.active{background:#e4dcfb;box-shadow:0 0 0 2px #c9bdf5;}
  .vocab-wrap{overflow-x:auto;}
  .vocab-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:420px;}
  .vocab-table td, .vocab-table th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top;}
  .vocab-table th{color:var(--sub);font-weight:700;}
  .vocab-table .better{color:var(--accent);font-weight:700;}
  .vocab-table .ex{font-style:italic;color:var(--sub);}
  .countdown-standalone{margin-bottom:20px;}
  .countdown-standalone .countdown-card{max-width:420px;}

  /* Task 1 process (flowchart) and map-comparison charts */
  .flowchart-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px;}
  .flow-box{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05);flex:0 1 auto;max-width:230px;}
  .flow-num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .flow-text{font-size:13.5px;line-height:1.5;}
  .flow-arrow-h{flex-shrink:0;display:flex;align-items:center;}
  @media(max-width:640px){
    .flowchart-h{flex-direction:column;align-items:stretch;}
    .flow-box{max-width:none;}
    .flow-arrow-h{align-self:center;transform:rotate(90deg);}
  }
  .map-compare{display:flex;align-items:stretch;gap:12px;}
  @media(max-width:640px){.map-compare{flex-direction:column;}}
  .map-panel{flex:1;border:2px dashed var(--accent);border-radius:12px;padding:12px 14px;background:var(--panel);overflow:hidden;}
  .map-panel-title{font-weight:800;font-size:13.5px;color:var(--accent);margin-bottom:8px;text-align:center;text-transform:uppercase;letter-spacing:.03em;}
  .map-feature-list{margin:10px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.5;}
  .map-feature-list li{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .map-pin-num{flex-shrink:0;width:18px;height:18px;border-radius:50%;background:#c0392b;color:#fff;font-weight:800;font-size:10.5px;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .map-compare-arrow{align-self:center;font-size:22px;font-weight:800;color:var(--accent);flex-shrink:0;}
  @media(max-width:640px){.map-compare-arrow{transform:rotate(90deg);}}

  /* home dashboard (desktop only) */
  .desktop-only-tab{display:none;}
  @media(min-width:860px){.desktop-only-tab{display:inline-block;}}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:700px){.home-grid{grid-template-columns:1fr;}}
  .home-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;}
  .home-card h3{margin:0;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;}
  .home-card .home-card-title{font-size:19px;font-weight:800;margin:4px 0 14px;}
  .home-reco{background:var(--chip);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;}
  .home-reco:hover{outline:2px solid var(--accent);}
  .home-reco .reco-label{font-weight:700;font-size:14.5px;}
  .home-reco .reco-sub{font-size:12.5px;color:var(--sub);margin-top:2px;}
  .home-reco .reco-arrow{color:var(--accent);font-weight:800;font-size:18px;}
  .streak-pill{background:var(--chip);color:var(--accent);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;}
  .week-bars{display:flex;justify-content:space-between;align-items:flex-end;height:90px;margin:14px 4px 8px;}
  .week-bars .bar-col{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .week-bars .bar-col .daylabel{font-size:11px;color:var(--sub);}
  .week-bars .bar{width:18px;border-radius:4px 4px 0 0;background:var(--line);min-height:3px;}
  .week-bars .bar.active{background:var(--ink);}
  .week-bars .bar.today{background:var(--accent);}
  .week-stats{display:flex;justify-content:space-around;text-align:center;border-top:1px solid var(--line);padding-top:12px;}
  .week-stats b{display:block;font-size:20px;}
  .week-stats span{font-size:11.5px;color:var(--sub);}
  .mistake-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:9px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap;}
  .mistake-row:last-child{border-bottom:none;}
  .mistake-row .wrongtxt{text-decoration:line-through;color:var(--bad);}
  .mistake-row .arrow{color:var(--sub);}
  .mistake-row .righttxt{color:var(--good);font-weight:700;}
  .mistake-row .tag{margin-left:auto;font-size:10.5px;}
  .vocab-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}

  @media(max-width:600px){
    header h1{font-size:16px;}
    nav button{font-size:14px;padding:10px 12px;}
    header .wrap{justify-content:flex-start;}
    nav{order:3;width:100%;}
    #studentBadge{margin-left:auto;}
    .passage-box p{font-size:15px;}
    #enlargeOverlay{padding:10px;}
    #enlargeOverlay .sheet{padding:16px;font-size:17px;}
    #enlargeOverlay .sheet p{font-size:17px;}
    .qexplain{font-size:14px;padding:10px 12px;}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>📘 IELTS Practice</h1>
    <nav>
      <button data-tab="home" class="desktop-only-tab">🏠 首頁</button>
      <button data-tab="reading" class="active">閱讀 Reading</button>
      <button data-tab="writing">寫作 Writing</button>
      <button data-tab="speaking">口說 Speaking</button>
      <button data-tab="review">複習 Review</button>
    </nav>
    <button id="studentBadge" class="smallbtn" onclick="promptStudentName(false)" style="white-space:nowrap;">👤 登記姓名</button>
  </div>
</header>

<main>
  <section id="view-home" class="view">
    <div id="home-dashboard"></div>
  </section>

<script>
const state = { reading: null, writing: null, speaking: null, currentPassage: null };

/* ---------- backend sync (optional Google Sheets via Apps Script) ---------- */
/* 老師部署 Google Apps Script 後，把網址貼在下面這一行的引號中間即可啟用後台紀錄功能。 */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwX4uUKetOFrCJUR6MzWCGsuCPNAq-1Rm_8QFJnUIOJGOOmYzbk0WM6CumvDmblBdaX/exec';

function getStudentName(){
  try{ return localStorage.getItem('ieltsStudentName') || ''; }catch(e){ return ''; }
}
function setStudentName(name){
  try{ localStorage.setItem('ieltsStudentName', name); }catch(e){}
  syncToBackend('register', {});
  renderStudentBadge();
}
function promptStudentName(force){
  const current = getStudentName();
  const name = prompt(force ? '請輸入你的姓名，方便老師在後台辨識你的紀錄：' : '修改姓名：', current);
  if(name && name.trim()){ setStudentName(name.trim()); }
}
function renderStudentBadge(){
  const el = document.getElementById('studentBadge');
  if(!el) return;
  const name = getStudentName();
  el.textContent = name ? `👤 ${name}` : '👤 登記姓名';
  el.title = name ? '點擊修改姓名' : '點擊登記姓名';
}
function syncToBackend(type, payload){
  if(!BACKEND_URL) return;
  const name = getStudentName();
  if(!name && type !== 'register') return;
  const body = Object.assign({ type, name, ts: new Date().toISOString() }, payload);
  try{
    fetch(BACKEND_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).catch(()=>{});
  }catch(e){}
}

let remoteDraftsCache = null;
async function fetchRemoteDrafts(){
  if(!BACKEND_URL) return {};
  const name = getStudentName();
  if(!name) return {};
  try{
    const res = await fetch(`${BACKEND_URL}?action=drafts&name=${encodeURIComponent(name)}`);
    if(!res.ok) return {};
    const data = await res.json();
    return data.drafts || {};
  }catch(e){ return {}; }
}

async function loadJSON(paths){
  for(const p of paths){
    try{
      const res = await fetch(p);
      if(res.ok) return await res.json();
    }catch(e){}
  }
  return null;
}

async function init(){
  state.reading = await loadJSON(['content/reading-bank.json','content/readingbank.json','reading-bank.json','readingbank.json']);
  state.writing = await loadJSON(['content/writing-bank.json','content/writingbank.json','writing-bank.json','writingbank.json']);
  state.speaking = await loadJSON(['content/speaking-bank.json','content/speakingbank.json','speaking-bank.json','speakingbank.json']);
  remoteDraftsCache = await fetchRemoteDrafts();
  renderDashboardStrip();
  renderReadingList();
  renderWriting();
  renderSpeaking();
  renderReview();
  if(window.indexedDB){ purgeOldRecordings().then(renderReview); }
  renderStudentBadge();
  if(!getStudentName()) promptStudentName(true);
}

/* ---------- nav ---------- */
function switchTab(tab){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');

  if(tab==='home') renderHome();

document.querySelectorAll('nav button').forEach(btn=>{

/* ---------- enlarge (click-to-zoom a section) ---------- */
function openEnlarge(html){
  document.getElementById('enlargeToolbar').innerHTML = '';
  document.getElementById('enlargeContent').innerHTML = html;
  document.getElementById('enlargeOverlay').classList.add('active');
}
function openEnlargeLive(sourceId, withHighlighter){
  const source = document.getElementById(sourceId);
  if(!source) return;
  const anchor = document.createElement('div');
  anchor.id = sourceId+'__anchor';
  anchor.style.display = 'none';
  source.parentNode.insertBefore(anchor, source);
  const content = document.getElementById('enlargeContent');
  content.innerHTML = '';
  content.appendChild(source);
  const toolbar = document.getElementById('enlargeToolbar');
  toolbar.innerHTML = withHighlighter
    ? `<button type="button" class="enlarge-btn" title="標記螢光筆" onpointerdown="event.preventDefault()" onclick="highlightSelection()">🖍</button>
       <button type="button" class="enlarge-btn" title="清除標記" onclick="clearHighlights()">🧹</button>`
    : '';
  const overlay = document.getElementById('enlargeOverlay');
  overlay.dataset.liveSource = sourceId;
  overlay.classList.add('active');
}
function closeEnlarge(){
  const overlay = document.getElementById('enlargeOverlay');
  const liveId = overlay.dataset.liveSource;
  if(liveId){
    const source = document.getElementById(liveId);
    const anchor = document.getElementById(liveId+'__anchor');
    if(source && anchor && anchor.parentNode){ anchor.parentNode.insertBefore(source, anchor); anchor.remove(); }
    delete overlay.dataset.liveSource;
  }
  overlay.classList.remove('active');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeEnlarge(); });
function enlargeBtnHTML(sourceId, label){
  label = label || 'Enlarge';
  return `<button type="button" class="enlarge-btn" title="${label}" onclick="openEnlarge(document.getElementById('${sourceId}').innerHTML)">⛶</button>`;
}

/* ---------- highlighter (螢光筆) for reading passages ---------- */
// Highlight containers are identified generically via a data-hl-key attribute rather
// than a single hardcoded #passageTextOnly id, so the same logic works whether there's
// one passage on screen (normal practice) or three at once (mock exam, each panel
// carrying its own key) — highlightSelection() finds whichever container the current
// text selection actually falls inside.
// Resizable split between the passage text column and the question column —
// shared px width is persisted so every passage/mock panel opens at the
// student's last-chosen ratio, but only applies at desktop widths (>=860px)
// where .split lays the two columns out side by side.
const SPLIT_MIN = 240;
function applySavedSplitWidths(root){
  if(window.innerWidth < 860) return;
  const saved = parseInt(localStorage.getItem('readingSplitLeftPx'), 10);
  if(!saved) return;
  (root||document).querySelectorAll('.split').forEach(splitEl=>{
    splitEl.style.gridTemplateColumns = `${saved}px 10px 1fr`;
  });
}
function splitResizerStart(e){
  if(window.innerWidth < 860) return;
  e.preventDefault();
  const resizer = e.currentTarget;
  const splitEl = resizer.closest('.split');
  if(!splitEl) return;
  resizer.classList.add('dragging');
  const rect = splitEl.getBoundingClientRect();
  const onMove = (ev) => {
    const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
    let leftPx = clientX - rect.left;
    leftPx = Math.max(SPLIT_MIN, Math.min(rect.width - SPLIT_MIN - 10, leftPx));
    splitEl.style.gridTemplateColumns = `${leftPx}px 10px 1fr`;
    try{ localStorage.setItem('readingSplitLeftPx', String(Math.round(leftPx))); }catch(err){}
  };
  const onUp = () => {
    resizer.classList.remove('dragging');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchmove', onMove, {passive:false});
  document.addEventListener('touchend', onUp);
}

const PASSAGE_TEXT_REGISTRY = {}; // hlKey -> { label: paragraphText }
function loadPassageHighlights(){
  try{ return JSON.parse(localStorage.getItem('ieltsHighlights')||'{}'); }catch(e){ return {}; }
}
function savePassageHighlightsFor(container){
  const key = container && container.dataset.hlKey;
  if(!key) return;
  const all = loadPassageHighlights();
  all[key] = container.innerHTML;
  try{ localStorage.setItem('ieltsHighlights', JSON.stringify(all)); }catch(e){}
}
function highlightContainers(){
  return Array.from(document.querySelectorAll('[data-hl-key]'));
}
function unwrapHighlight(mark){
  const parent = mark.parentNode;
  if(!parent) return;
  const container = mark.closest('[data-hl-key]');
  while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
  parent.removeChild(mark);
  parent.normalize();
  savePassageHighlightsFor(container);
}
/* Click on any existing highlight (live view or restored from storage) removes it. */
document.addEventListener('click', e=>{
  const mark = e.target.closest && e.target.closest('mark.hl');
  if(mark){ e.stopPropagation(); unwrapHighlight(mark); }
});
function highlightSelection(){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const container = highlightContainers().find(c => c.contains(range.commonAncestorContainer));
  if(!container) return;

  /* Walk only the text nodes touched by the selection and wrap the selected
     substring of each one individually (splitText), instead of moving whole
     DOM subtrees via surroundContents/extractContents — that approach could
     drop or scramble content whenever a selection crossed element boundaries
     (e.g. spanning the paragraph-label <span> or two <p> tags). */
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
    acceptNode(node){ return range.intersectsNode(node) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }
  });
  const nodes = [];
  let n;
  while((n = walker.nextNode())) nodes.push(n);

  nodes.forEach(node=>{
    const isStart = node === range.startContainer;
    const isEnd = node === range.endContainer;
    const localStart = isStart ? range.startOffset : 0;
    const localEnd = isEnd ? range.endOffset : node.data.length;
    if(localStart >= localEnd) return;
    let target = node;
    if(localEnd < target.data.length) target.splitText(localEnd);
    if(localStart > 0) target = target.splitText(localStart);
    const mark = document.createElement('mark');
    mark.className = 'hl';
    target.parentNode.insertBefore(mark, target);
    mark.appendChild(target);
  });

  sel.removeAllRanges();
  savePassageHighlightsFor(container);
}
function clearHighlights(containerId){
  const box = document.getElementById(containerId || 'passageTextOnly');
  if(!box) return;
  const key = box.dataset.hlKey;
  const all = loadPassageHighlights();
  delete all[key];
  try{ localStorage.setItem('ieltsHighlights', JSON.stringify(all)); }catch(e){}
  const paragraphs = PASSAGE_TEXT_REGISTRY[key];
  if(paragraphs) box.innerHTML = Object.entries(paragraphs).map(([label,text])=>
    `<p><span class="para-label">${label}</span>${text}</p>`).join('');
}

/* ---------- local history / progress tracking ---------- */
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem('ieltsHistory')||'[]'); }catch(e){ return []; }
}
function saveHistoryEntry(entry){
  const h = loadHistory();
  entry.date = new Date().toISOString();
  h.unshift(entry);
  try{ localStorage.setItem('ieltsHistory', JSON.stringify(h.slice(0,200))); }catch(e){}
}
function loadWrongBank(){
  try{ return JSON.parse(localStorage.getItem('ieltsWrongAnswers')||'[]'); }catch(e){ return []; }
}
function addWrongAnswers(items){
  if(!items.length) return;
  const bank = loadWrongBank();
  const stamped = items.map(it=>({...it, date:new Date().toISOString()}));
  const merged = stamped.concat(bank).slice(0,300);
  try{ localStorage.setItem('ieltsWrongAnswers', JSON.stringify(merged)); }catch(e){}
}
function clearWrongAnswer(idx){
  const bank = loadWrongBank();
  bank.splice(idx,1);
  try{ localStorage.setItem('ieltsWrongAnswers', JSON.stringify(bank)); }catch(e){}
  renderReview();
}
function clearHistory(){
  if(!confirm('確定要清除所有成績紀錄嗎？此操作無法復原。')) return;
  try{ localStorage.removeItem('ieltsHistory'); }catch(e){}
  renderReview();
}
function clearAllWrong(){
  if(!confirm('確定要清空整個錯題本嗎？此操作無法復原。')) return;
  try{ localStorage.removeItem('ieltsWrongAnswers'); }catch(e){}
  renderReview();
}

function renderReview(){
  const el = document.getElementById('review-list');
  const hist = loadHistory();
  const wrong = loadWrongBank();

  let html = '<div class="section-title">成績紀錄</div>';
  if(!hist.length){
    html += '<div class="empty">目前還沒有練習紀錄 — 完成一篇閱讀或寫作練習後，紀錄會顯示在這裡。</div>';
  } else {
    html += '<div class="qbox">';
    html += hist.slice(0,40).map(h=>{
      const dt = new Date(h.date);
      const dtStr = dt.toLocaleDateString()+' '+dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      let right = '';
      if(h.type==='reading') right = `<span class="score">${h.score} / ${h.total}${h.band?` ・Band ${h.band.toFixed(1)}`:''}</span>`;
      else if(h.type==='writing') right = `<span class="score">${h.checksPassed} / ${h.checksTotal} 項通過</span>`;
      return `<div class="hist-row">
        <span><span class="badge">${h.type==='reading'?'閱讀':'寫作'}</span>${h.title}</span>
        <span style="display:flex;align-items:center;gap:10px;">${right}<span class="hist-meta">${dtStr}</span></span>
      </div>`;
    }).join('');
    html += `</div><div style="margin-top:10px;"><button class="smallbtn" onclick="clearHistory()">清除紀錄</button></div>`;
  }

  html += '<div class="section-title">錯題本（閱讀）</div>';
  if(!wrong.length){
    html += '<div class="empty">目前沒有錯題 — 閱讀測驗答錯的題目會自動加入這裡，方便之後複習。</div>';
  } else {
    html += wrong.map((w,i)=>`<div class="wrong-card">
        <div style="font-weight:700;margin-bottom:4px;">${w.passageTitle} <span class="hist-meta">第 ${w.n} 題</span></div>
        <div style="margin-bottom:4px;">${w.text}</div>
        <div>你的答案：<span class="yr">${w.yourAnswer||'（未作答）'}</span> &nbsp;·&nbsp; 正確答案：<span class="cr">${w.correctAnswer}</span></div>
        <button class="smallbtn" style="margin-top:6px;" onclick="clearWrongAnswer(${i})">移除</button>
      </div>`).join('');
    html += `<div style="margin-top:10px;"><button class="smallbtn" onclick="clearAllWrong()">清空錯題本</button></div>`;
  }

  html += `<div class="section-title">口說錄音（約 ${REC_RETENTION_DAYS} 天後自動清除）</div>`;
  html += `<div id="recordingsSection"><div class="loading">載入錄音中…</div></div>`;

  el.innerHTML = html;
  renderRecordingsSection();
}

/* ---------- home dashboard (desktop only) ---------- */
const WEEKDAY_LABELS = ['一','二','三','四','五','六','日'];
function computeStreak(){
  const hist = loadHistory();
  if(!hist.length) return 0;
  const days = new Set(hist.map(h=>new Date(h.date).toDateString()));
  let streak = 0;
  const d = new Date(); d.setHours(0,0,0,0);
  while(days.has(d.toDateString())){
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function weekActivityCounts(){
  const hist = loadHistory();
  const counts = [0,0,0,0,0,0,0];
  const now = new Date();
  const dow = (now.getDay()+6)%7;
  const monday = new Date(now); monday.setHours(0,0,0,0); monday.setDate(now.getDate()-dow);
  hist.forEach(h=>{
    const diff = Math.floor((new Date(h.date) - monday)/86400000);
    if(diff>=0 && diff<7) counts[diff]++;
  });
  return counts;
}
function recommendedAction(){
  if(!state.reading || !state.reading.passages) return null;
  for(let i=0;i<state.reading.passages.length;i++){
    const p = state.reading.passages[i];
    const key = p.id || p.title;
    if(loadReadingAnswers(key)) return { label:'繼續閱讀', title:p.title, sub:'上次寫到一半，點擊接著做', index:i };
  }
  for(let i=0;i<state.reading.passages.length;i++){
    const p = state.reading.passages[i];
    if(!bestReadingScore(p.title)) return { label:'開始閱讀', title:p.title, sub:'還沒做過這篇，來試試看', index:i };
  }
  return { label:'複習閱讀', title:state.reading.passages[0].title, sub:'全部都做過了，挑一篇重新練習', index:0 };
}
function goHomeReco(index){
  switchTab('reading');
  openPassage(index);
}
function randomVocabChips(n){
  const pool = [];
  const sp = state.speaking;
  if(sp){
    (sp.part1_topics||[]).forEach(t=>{ if(t.useful_words) pool.push(...t.useful_words); });
    (sp.part2_cue_cards||[]).forEach(c=>{ if(c.useful_words) pool.push(...c.useful_words); });
    (sp.part3_discussion_sets||[]).forEach(s=>{ if(s.useful_words) pool.push(...s.useful_words); });
  }
  const uniq = [...new Set(pool)];
  const picked = [];
  const seed = new Date().getDate();
  for(let i=0;i<n && uniq.length;i++){
    picked.push(uniq[(seed*7+i*13) % uniq.length]);
  }
  return [...new Set(picked)];
}
function renderHome(){
  const el = document.getElementById('home-dashboard');
  if(!el) return;
  const reco = recommendedAction();
  const streak = computeStreak();
  const counts = weekActivityCounts();
  const totalThisWeek = counts.reduce((a,b)=>a+b,0);
  const maxCount = Math.max(1, ...counts);
  const todayIdx = (new Date().getDay()+6)%7;
  const wrong = loadWrongBank().slice(0,3);
  const vocab = randomVocabChips(6);

  const recoHTML = reco ? `<div class="home-reco" onclick="goHomeReco(${reco.index})">
      <div><div class="reco-label">${reco.label}：${reco.title}</div><div class="reco-sub">${reco.sub}</div></div>
      <div class="reco-arrow">→</div>
    </div>` : `<div class="empty">閱讀題庫載入中…</div>`;

  const barsHTML = counts.map((c,i)=>{
    const h = Math.round((c/maxCount)*70)+3;
    const cls = i===todayIdx ? 'today' : (c>0 ? 'active' : '');
    return `<div class="bar-col"><div class="bar ${cls}" style="height:${h}px;"></div><div class="daylabel">${WEEKDAY_LABELS[i]}</div></div>`;
  }).join('');

  const wrongHTML = wrong.length ? wrong.map(w=>`<div class="mistake-row">
      <span class="wrongtxt">${w.yourAnswer || '未作答'}</span>
      <span class="arrow">→</span>
      <span class="righttxt">${w.correctAnswer}</span>
      <span class="tag">${w.passageTitle}．第${w.n}題</span>
    </div>`).join('') : `<div class="empty" style="padding:10px 0;">目前沒有錯題，繼續保持！</div>`;

  const vocabHTML = vocab.length ? `<div class="vocab-chip-row">${vocab.map(v=>`<span class="word-chip">${v}</span>`).join('')}</div>` : `<div class="empty" style="padding:10px 0;">口說題庫載入中…</div>`;

  el.innerHTML = `
    <div class="home-grid">
      <div class="home-card">
        <h3>今天只做這一項</h3>
        <div class="home-card-title">今日推薦訓練</div>
        ${recoHTML}
      </div>
      <div class="home-card">
        <h3>本週</h3>
        <div class="home-card-title">學習進度 <span class="streak-pill">🔥 連續 ${streak} 天</span></div>
        <div class="week-bars">${barsHTML}</div>
        <div class="week-stats">
          <div><b>${totalThisWeek}</b><span>本週練習次數</span></div>
          <div><b>${streak}</b><span>連續天數</span></div>
        </div>
      </div>
    </div>
    <div class="home-grid">
      <div class="home-card">
        <h3>錯題本</h3>
        <div class="home-card-title">優先複習這些 <button class="smallbtn" style="float:right;font-weight:400;" onclick="switchTab('review')">查看全部</button></div>
        ${wrongHTML}
      </div>
      <div class="home-card">
        <h3>口說</h3>
        <div class="home-card-title">常用字彙</div>
        ${vocabHTML}
      </div>
    </div>
  `;
}

async function renderRecordingsSection(){
  const box = document.getElementById('recordingsSection');
  if(!box) return;
  if(!window.indexedDB){ box.innerHTML = '<div class="empty">此瀏覽器不支援本機錄音儲存。</div>'; return; }
  const all = await getAllRecordings();
  if(!all.length){ box.innerHTML = '<div class="empty">目前沒有錄音 — 到 Speaking 頁面錄一段題卡回答後會顯示在這裡。</div>'; return; }
  all.sort((a,b)=> new Date(b.date) - new Date(a.date));
  box.innerHTML = all.map(r=>{
    const dt = new Date(r.date);
    const dtStr = dt.toLocaleDateString()+' '+dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const daysLeft = Math.max(0, REC_RETENTION_DAYS - Math.floor((Date.now()-dt.getTime())/86400000));
    const url = URL.createObjectURL(r.blob);
    return `<div class="wrong-card">
      <div style="font-weight:700;margin-bottom:4px;">${r.topic}</div>
      <div class="hist-meta" style="margin-bottom:6px;">${dtStr} · 剩餘 ${daysLeft} 天</div>

function mockAIFeedback(topic){
  const sub = { fluency:6.5, vocab:6.0, grammar:6.5, pronunciation:5.5 };

    strengths: ['能清楚回應題目，內容切題不離題', '使用了一些主題相關的詞彙', '整體語速穩定，聽起來不會太緊張'],
    improvements: ['句子之間缺少連接詞，聽起來較破碎', '時態使用不夠一致，過去式/現在式常混用', '語調較平，重音位置不明顯'],
    vocab: [

    ],
    action_plan: [
      { criterion:'vocab', steps:['更頻繁地使用搭配詞詞典來尋找合適的詞語組合，並用這些片語每天造3個句子練習', '整理今天回饋中出現的更好說法（見上方詞彙建議），錄音時刻意套用進句子裡'] },
      { criterion:'pronunciation', steps:['練習慢速說話，確保每個單字發音正確，熟練後再逐漸加快速度', '挑選一句考官回饋中提到的句子，跟讀原文影片3次，特別注意重音位置'] }
    ]

function subLabel(key){ return { fluency:'流利度與連貫性', vocab:'詞彙資源', grammar:'文法範圍', pronunciation:'發音' }[key]; }
function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
async function fetchRealAIFeedback(recording, topic, onStatus){
  const name = getStudentName();
  const audioBase64 = await blobToBase64(recording.blob);
  const requestId = 'req_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  // Fire-and-forget upload: some browsers (notably Safari) can't reliably read a
  // cross-origin POST response from Apps Script, so we don't wait on this fetch's
  // body — the result is retrieved afterwards via a GET poll, which does work.
  fetch(BACKEND_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ type:'ai_feedback', requestId, name, topic, mimeType: recording.blob.type || 'audio/webm', audioBase64 })
  }).catch(()=>{});

  const maxAttempts = 55; // ~110 seconds — gives the backend's automatic retry-on-failure a bit of headroom
  for(let i=0; i<maxAttempts; i++){
    await sleep(2000);
    if(onStatus) onStatus(i);
    let data;
    try{
      const res = await fetch(`${BACKEND_URL}?action=ai_status&id=${encodeURIComponent(requestId)}`);
      data = await res.json();
    }catch(networkErr){
      continue; // transient poll failure — just try again on the next tick
    }
    if(data.ready){
      if(!data.ok) throw new Error(data.error || 'AI 評分失敗');
      const f = data.feedback;
      if(!f || typeof f.overall !== 'number' || !f.sub || typeof f.sub !== 'object'){
        throw new Error('AI 回覆格式不完整，請再試一次');
      }
      return f;
    }
  }
  throw new Error('AI 分析逾時，請稍後再試一次');
}
function renderAIFeedbackBody(f, topic, isDemo){
  const pct = Math.round((f.overall/9)*100);
  const subRows = Object.entries(f.sub).map(([k,v])=>{
    const warn = v < 6 ? 'warn' : '';
    return `<div class="subscore-row">
      <div class="lbl"><span>${subLabel(k)}</span><b style="color:${v<6?'var(--warn)':'var(--accent)'}">${v.toFixed(1)}</b></div>
      <div class="subscore-bar ${warn}"><div style="width:${(v/9)*100}%"></div></div>
    </div>`;
  }).join('');
  const vocabRows = (f.vocab||[]).map(v=>`<tr>
    <td>"${v.said}"</td>
    <td class="better">${v.better}</td>
    <td class="ex">${v.example}</td>
  </tr>`).join('');
  const transcriptHTML = f.transcript ? `<div class="ai-section"><h5>📝 逐字稿</h5><p style="font-style:italic;">${f.transcript}</p></div>` : '';
  const actionPlan = f.action_plan && f.action_plan.length ? f.action_plan : defaultActionPlan(f.sub);
  const actionPlanHTML = actionPlan.length ? `<div class="action-plan">
    <h5>✨ Action Plan 行動計畫</h5>
    ${actionPlan.map(ap=>`<div class="ap-block">
      <div class="ap-crit">針對「${subLabel(ap.criterion)}」：</div>
      <ul>${(ap.steps||[]).map(s=>`<li>${s}</li>`).join('')}</ul>
    </div>`).join('')}
  </div>` : '';
  const banner = isDemo
    ? `<div class="disclaimer-banner">⚠️ 這是「介面示範」用的假資料，還沒有串接真正的 AI 語音評分服務 — 分數與建議都不是根據你剛剛的錄音產生的。</div>`
    : `<div class="disclaimer-banner" style="background:#e6f6ec;border-color:#9bd6b3;color:#1c8a4b;">✅ 由 AI 依據你這段錄音實際分析產生，僅供參考，不是正式雅思分數。</div>`;
  document.getElementById('aiFeedbackBody').innerHTML = `
    ${banner}
    <h4 style="margin:0 0 4px;">${topic || 'AI 口說評分'}</h4>
    <div class="score-hero">
      <div class="score-gauge" style="--pct:${pct}"><div class="score-gauge-inner"><b>${f.overall.toFixed(1)}</b><span>Band</span></div></div>
      <div class="score-meta"><span class="lbl">總體評分 Score</span><b>${f.overall.toFixed(1)}</b><span class="lbl">${f.overall>=7?'Good User':f.overall>=6?'Competent User':'Modest User'}</span></div>
    </div>
    ${subRows}
    ${transcriptHTML}
    <div class="ai-section"><h5>💬 考官意見</h5><p>${f.comment}</p></div>
    <div class="ai-section"><h5>✅ 優點</h5><ul class="strength-list">${(f.strengths||[]).map(s=>`<li>${s}</li>`).join('')}</ul></div>
    <div class="ai-section"><h5>✗ 需要改善的地方</h5><ul class="improve-list">${(f.improvements||[]).map(s=>`<li>${s}</li>`).join('')}</ul></div>
    <div class="ai-section"><h5>📘 更好的詞彙</h5>
      <div class="vocab-wrap"><table class="vocab-table">
        <tr><th>你說的</th><th>更好的替代詞</th><th>例句</th></tr>
        ${vocabRows}
      </table></div>
    </div>
    ${actionPlanHTML}
  `;
}
// Generic per-criterion practice suggestions, used when the AI response doesn't
// include its own action_plan (e.g. cached results from before this feature, or if
// the backend hasn't been redeployed with the updated prompt yet).
const ACTION_PLAN_DEFAULTS = {
  fluency: ['練習用「先講重點、再補充理由跟例子」的結構回答，減少想到哪講到哪的停頓', '錄下自己回答同一題2-3次，聽聽看哪裡卡住，針對那句多練幾次'],
  vocab: ['更頻繁地使用搭配詞詞典查合適的詞語組合，並用這些片語每天造3個句子練習', '把常用的簡單詞（good/very/a lot of）換成更精確的同義詞，整理成自己的替換清單'],
  grammar: ['錄音前先在腦中確定這句話的時態，避免過去式與現在式混用', '練習用複合句（含連接詞like although/because/which）取代簡單句，增加文法多樣性'],
  pronunciation: ['練習慢速說話，確保每個單字發音正確，熟練後再逐漸加快速度', '挑幾個常唸錯的字，跟讀原文影片，特別注意重音位置與語調起伏']
};
function defaultActionPlan(sub){
  if(!sub) return [];
  const weakest = Object.entries(sub).sort((a,b)=>a[1]-b[1]).slice(0,2);
  return weakest.map(([k])=>({ criterion:k, steps: ACTION_PLAN_DEFAULTS[k]||[] }));
}
async function openAIFeedback(recId, topic){
  document.getElementById('aiFeedbackBody').innerHTML = `<div class="loading">AI 分析中…</div>`;
  document.getElementById('aiFeedbackModal').classList.add('active');
  if(!BACKEND_URL){
    setTimeout(()=> renderAIFeedbackBody(mockAIFeedback(topic), topic, true), 600);
    return;
  }
  try{
    const recording = await getRecording(recId);
    if(!recording) throw new Error('找不到這段錄音');
    const f = await fetchRealAIFeedback(recording, topic, (tick)=>{
      const box = document.getElementById('aiFeedbackBody');
      if(box) box.innerHTML = `<div class="loading">AI 分析中…（已等待約 ${tick*2} 秒，語音較長時可能要一分鐘左右）</div>`;
    });
    renderAIFeedbackBody(f, topic, false);
  }catch(e){
    document.getElementById('aiFeedbackBody').innerHTML = `<div class="disclaimer-banner">⚠️ AI 批改失敗：${(e.message||'未知錯誤').replace(/</g,'&lt;')}</div>`;
  }
}
function closeAIFeedback(){
  document.getElementById('aiFeedbackModal').classList.remove('active');
}

function bestReadingScore(title){
  const hist = loadHistory().filter(h => h.type==='reading' && h.title===title);
  if(!hist.length) return null;
  return hist.reduce((best,h) => (h.score/h.total > best.score/best.total ? h : best), hist[0]);
}
function readingCardHTML(p, i){
  const qcount = p.questions.reduce((s,g)=>s+g.items.length,0);
  const best = bestReadingScore(p.title);
  const passageKey = p.id || p.title;
  const hasDraft = !best && !!loadReadingAnswers(passageKey);
  const doneBadge = best ? `<span class="badge" style="background:#e6f6ec;color:var(--good);">✓ 最佳 ${best.score}/${best.total}</span>` : '';
  const draftBadge = hasDraft ? `<span class="badge" style="background:#fff3d6;color:var(--warn);">📝 進行中，點擊繼續</span>` : '';
  const shortBadge = p.short ? `<span class="badge" style="background:#eef2ff;color:var(--accent);">⚡ 快速練習．約5分鐘</span>` : '';
  return `<div class="card" onclick="openPassage(${i})">
      ${shortBadge}${doneBadge}${draftBadge}
      <h3>${p.title}</h3>
      <p>${Object.keys(p.paragraphs).length} 段落．${qcount} 題</p>
    </div>`;
}

function getExamDate(){
  try{ return localStorage.getItem('ieltsExamDate') || ''; }catch(e){ return ''; }
}
function setExamDate(dateStr){
  try{ if(dateStr) localStorage.setItem('ieltsExamDate', dateStr); else localStorage.removeItem('ieltsExamDate'); }catch(e){}
  renderAllCountdowns();
}
function daysUntil(dateStr){
  const target = new Date(dateStr+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
}
function countdownHTML(suffix){
  const inputId = 'examDateInput-'+suffix;
  const d = getExamDate();
  if(!d){
    return `<div class="countdown-card">
      <div class="cd-label">🎯 設定你的考試／模考日期</div>
      <div class="cd-editrow">
        <input type="date" id="${inputId}">
        <button class="cd-setbtn" onclick="setExamDate(document.getElementById('${inputId}').value)">設定</button>
      </div>
    </div>`;
  }
  const days = daysUntil(d);
  const label = days > 0 ? `${days}<span>天後應考</span>` : (days === 0 ? `今天<span>就是考試日！加油</span>` : `已考完<span>可以重新設定日期</span>`);
  return `<div class="countdown-card">
    <div class="cd-label">🎯 距離考試</div>
    <div class="cd-days">${label}</div>
    <div class="cd-date">考試日期：${d}</div>
    <div class="cd-editrow">
      <input type="date" id="${inputId}" value="${d}">
      <button class="cd-setbtn" onclick="setExamDate(document.getElementById('${inputId}').value)">更新</button>
      <button class="cd-clearbtn" onclick="setExamDate('')">清除</button>
    </div>
  </div>`;
}
const COUNTDOWN_MOUNTS = { reading:'countdown-slot-reading', writing:'countdown-slot-writing', speaking:'countdown-slot-speaking', review:'countdown-slot-review' };
function renderAllCountdowns(){
  Object.entries(COUNTDOWN_MOUNTS).forEach(([suffix,elId])=>{
    const el = document.getElementById(elId);
    if(el) el.innerHTML = countdownHTML(suffix);
  });
}
const UPDATES_PREVIEW_COUNT = 5;
function renderUpdatesSlot(){
  const el = document.getElementById('updates-slot');
  if(!el) return;
  el.innerHTML = `<button class="updates-trigger" onclick="openUpdatesModal()">📣 最近更新</button>`;
}
function openUpdatesModal(){
  const rows = UPDATES.slice(0,UPDATES_PREVIEW_COUNT).map(u=>`<div class="update-row"><span class="u-date">${u.date}</span><span class="u-text">${u.text}</span></div>`).join('');
  document.getElementById('updatesModalBody').innerHTML = rows;
  document.getElementById('updatesModal').classList.add('active');
}
function closeUpdatesModal(){
  document.getElementById('updatesModal').classList.remove('active');
}
function renderDashboardStrip(){
  renderAllCountdowns();
  renderUpdatesSlot();
}

function browseToggleHTML(mode){
  return `<div class="browse-toggle">
    <button class="${mode==='topic'?'active':''}" onclick="setReadingBrowseMode('topic')">📚 依主題瀏覽</button>
    <button class="${mode==='qtype'?'active':''}" onclick="setReadingBrowseMode('qtype')">🧩 依題型瀏覽</button>
  </div>`;
}
function setReadingBrowseMode(mode){
  state.readingBrowseMode = mode;
  renderReadingList();
}
function renderReadingList(){
  state.currentReadingCat = null;
  state.currentReadingQType = null;
  const el = document.getElementById('reading-list');
  if(!state.reading || !state.reading.passages){ el.innerHTML='<div class="empty">找不到 reading-bank.json</div>'; return; }
  const mode = state.readingBrowseMode || 'topic';
  let html = `<div class="card" style="background:linear-gradient(135deg,var(--accent),#1d4fd1);color:#fff;border:none;" onclick="startMockExam()">
    <h3 style="color:#fff;">📝 模擬考試 Mock Test</h3>
    <p style="color:rgba(255,255,255,.85);">隨機抽出3篇文章（湊近40題），60分鐘倒數計時，交卷後換算 Band 分數 — 完整模擬真實雅思閱讀測驗</p>
  </div>`;
  html += browseToggleHTML(mode);
  const all = state.reading.passages.map((p,i)=>({ p, i }));

  if(mode === 'qtype'){
    html += '<div class="section-title">依題型選擇</div><div class="cat-grid">';
    QTYPE_ORDER.forEach(t=>{
      const count = all.filter(x=>passageQTypes(x.p).has(t)).length;
      if(!count) return;
      html += `<div class="card" onclick="openReadingQType('${t}')"><h3>${QTYPE_INFO[t].name}</h3><p>${QTYPE_INFO[t].en}．${count} 篇有這種題型</p></div>`;
    });
    html += '</div>';
    el.innerHTML = html;
    return;
  }

  const shortOnes = all.filter(x=>x.p.short);
  html += '<div class="section-title">依主題選擇</div><div class="cat-grid">';
  if(shortOnes.length){
    html += `<div class="card" onclick="openReadingCategory('__short__')"><h3>⚡ 快速練習</h3><p>${shortOnes.length} 篇．約5分鐘可做完</p></div>`;
  }
  READING_CATEGORY_ORDER.forEach(cat=>{
    const group = all.filter(x=>x.p.category===cat && !x.p.short);
    if(!group.length) return;
    html += `<div class="card" onclick="openReadingCategory('${cat}')"><h3>${READING_CATEGORY_NAMES[cat]}</h3><p>${group.length} 篇</p></div>`;
  });
  const uncategorized = all.filter(x=>!x.p.short && !x.p.category);
  if(uncategorized.length){
    html += `<div class="card" onclick="openReadingCategory('__other__')"><h3>其他</h3><p>${uncategorized.length} 篇</p></div>`;
  }
  html += '</div>';
  el.innerHTML = html;
}

function openReadingCategory(cat){
  state.currentReadingCat = cat;
  state.currentReadingQType = null;
  renderReadingCategoryList();
}

function renderReadingCategoryList(){
  const el = document.getElementById('reading-list');
  const cat = state.currentReadingCat;
  if(!cat){ renderReadingList(); return; }
  const all = state.reading.passages.map((p,i)=>({ p, i }));
  let group, label;
  if(cat === '__short__'){ group = all.filter(x=>x.p.short); label = '⚡ 快速練習'; }
  else if(cat === '__other__'){ group = all.filter(x=>!x.p.short && !x.p.category); label = '其他'; }
  else { group = all.filter(x=>x.p.category===cat && !x.p.short); label = READING_CATEGORY_NAMES[cat] || cat; }
  let html = `<button class="backbtn" onclick="renderReadingList()">&larr; 返回主題分類</button>`;
  html += `<div class="section-title">${label}</div>`;
  html += group.map(({p,i})=>readingCardHTML(p,i)).join('');
  el.innerHTML = html;
}

function openReadingQType(t){
  state.currentReadingQType = t;
  state.currentReadingCat = null;
  renderReadingQTypeList();
}

function renderReadingQTypeList(){
  const el = document.getElementById('reading-list');
  const t = state.currentReadingQType;
  if(!t){ renderReadingList(); return; }
  const all = state.reading.passages.map((p,i)=>({ p, i }));
  const group = all.filter(x=>passageQTypes(x.p).has(t));
  const info = QTYPE_INFO[t];
  let html = `<button class="backbtn" onclick="state.readingBrowseMode='qtype';renderReadingList()">&larr; 返回題型分類</button>`;
  html += `<div class="section-title">${info.name}（${info.en}）</div>`;
  html += `<div class="qtype-tip">💡 <b>解題提示：</b>${info.tip}</div>`;
  html += group.map(({p,i})=>readingCardHTML(p,i)).join('');
  el.innerHTML = html;
}

function renderQuestionGroupsHTML(p){
  return p.questions.map((g,gi)=>{
    let inner = '';
    if(g.type === 'matching_headings'){
      inner += `<div class="heading-list">${g.headings.join('<br>')}</div>`;
      inner += g.items.map(it=>{
        const opts = g.headings.map(h=>{
          const val = h.split('.')[0].trim();
          return `<option value="${val}">${val}</option>`;
        }).join('');
        return `<div class="qitem" data-type="matching_headings" data-text="Paragraph ${it.paragraph}" data-explain="${(it.explanation||'').replace(/"/g,'&quot;')}">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">Paragraph ${it.paragraph}</span>
          <select data-group="${gi}" data-n="${it.n}" data-answer="${it.answer}">
            <option value="">--</option>${opts}
          </select>
          <span class="result" id="res-${it.n}"></span>
        </div>`;
      }).join('');
    } else if(g.type === 'true_false_not_given'){
      inner += g.items.map(it=>`<div class="qitem" data-type="true_false_not_given" data-text="${it.statement.replace(/"/g,'&quot;')}" data-explain="${(it.explanation||'').replace(/"/g,'&quot;')}">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">${it.statement}</span>
          <span class="tfng">
            ${['TRUE','FALSE','NOT GIVEN'].map(v=>`<label><input type="radio" name="q${it.n}" value="${v}" data-n="${it.n}" data-answer="${it.answer}"> ${v}</label>`).join('')}
          </span>
          <span class="result" id="res-${it.n}"></span>
        </div>`).join('');
    } else if(g.type === 'sentence_completion'){
      inner += g.items.map(it=>`<div class="qitem" data-type="sentence_completion" data-text="${it.prompt.replace(/"/g,'&quot;')}" data-explain="${(it.explanation||'').replace(/"/g,'&quot;')}">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">${it.prompt}</span>
          <input type="text" placeholder="answer" data-n="${it.n}" data-answer="${it.answer}" style="width:140px;">
          <span class="result" id="res-${it.n}"></span>
        </div>`).join('');
    } else if(g.type === 'multiple_choice'){
      inner += g.items.map(it=>{
        const opts = it.options.map(o=>{
          const letter = o.split(')')[0].split('.')[0].trim();
          return `<label style="display:block;margin:3px 0;"><input type="radio" name="q${it.n}" value="${letter}" data-n="${it.n}" data-answer="${it.answer}"> ${o}</label>`;
        }).join('');
        return `<div class="qitem" data-type="multiple_choice" data-text="${it.question.replace(/"/g,'&quot;')}" data-explain="${(it.explanation||'').replace(/"/g,'&quot;')}" style="flex-direction:column;align-items:flex-start;">
          <div><span class="qn">${it.n}.</span><span class="qstatement">${it.question}</span></div>
          <div style="margin-left:30px;font-size:14.5px;">${opts}</div>
          <span class="result" id="res-${it.n}"></span>
        </div>`;
      }).join('');
    } else if(g.type === 'summary_completion'){
      if(g.summary) inner += `<div class="heading-list">${g.summary}</div>`;
      if(g.wordBank) inner += `<div class="heading-list">${g.wordBank.join('<br>')}</div>`;
      inner += g.items.map(it=>{
        const opts = (g.wordBank||[]).map(w=>{
          const val = w.split('.')[0].trim();
          return `<option value="${val}">${val}</option>`;
        }).join('');
        return `<div class="qitem" data-type="summary_completion" data-text="Blank ${it.n}" data-explain="${(it.explanation||'').replace(/"/g,'&quot;')}">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">Blank ${it.n}</span>
          <select data-n="${it.n}" data-answer="${it.answer}">
            <option value="">--</option>${opts}
          </select>
          <span class="result" id="res-${it.n}"></span>
        </div>`;
      }).join('');
    } else if(g.type === 'matching_information'){
      const paraLetters = Object.keys(p.paragraphs);
      inner += g.items.map(it=>{
        const opts = paraLetters.map(l=>`<option value="${l}">${l}</option>`).join('');
        return `<div class="qitem" data-type="matching_information" data-text="${it.statement.replace(/"/g,'&quot;')}" data-explain="${(it.explanation||'').replace(/"/g,'&quot;')}">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">${it.statement}</span>
          <select data-n="${it.n}" data-answer="${it.answer}">
            <option value="">--</option>${opts}
          </select>
          <span class="result" id="res-${it.n}"></span>
        </div>`;
      }).join('');
    } else if(g.type === 'yes_no_not_given'){
      inner += g.items.map(it=>`<div class="qitem" data-type="yes_no_not_given" data-text="${it.statement.replace(/"/g,'&quot;')}" data-explain="${(it.explanation||'').replace(/"/g,'&quot;')}">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">${it.statement}</span>
          <span class="tfng">
            ${['YES','NO','NOT GIVEN'].map(v=>`<label><input type="radio" name="q${it.n}" value="${v}" data-n="${it.n}" data-answer="${it.answer}"> ${v}</label>`).join('')}
          </span>
          <span class="result" id="res-${it.n}"></span>
        </div>`).join('');
    } else if(g.type === 'matching_features'){
      if(g.features) inner += `<div class="heading-list">${g.features.join('<br>')}</div>`;
      inner += g.items.map(it=>{
        const opts = (g.features||[]).map(f=>{
          const val = f.split('.')[0].trim();
          return `<option value="${val}">${val}</option>`;
        }).join('');
        return `<div class="qitem" data-type="matching_features" data-text="${it.statement.replace(/"/g,'&quot;')}" data-explain="${(it.explanation||'').replace(/"/g,'&quot;')}">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">${it.statement}</span>
          <select data-n="${it.n}" data-answer="${it.answer}">
            <option value="">--</option>${opts}
          </select>
          <span class="result" id="res-${it.n}"></span>
        </div>`;
      }).join('');
    } else if(g.type === 'matching_sentence_endings'){
      if(g.endings) inner += `<div class="heading-list">${g.endings.join('<br>')}</div>`;
      inner += g.items.map(it=>{
        const opts = (g.endings||[]).map(e=>{
          const val = e.split('.')[0].trim();
          return `<option value="${val}">${val}</option>`;
        }).join('');
        return `<div class="qitem" data-type="matching_sentence_endings" data-text="${it.start.replace(/"/g,'&quot;')}" data-explain="${(it.explanation||'').replace(/"/g,'&quot;')}">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">${it.start}</span>
          <select data-n="${it.n}" data-answer="${it.answer}">
            <option value="">--</option>${opts}
          </select>
          <span class="result" id="res-${it.n}"></span>
        </div>`;
      }).join('');
    } else if(g.type === 'short_answer_question'){
      inner += g.items.map(it=>`<div class="qitem" data-type="short_answer_question" data-text="${it.question.replace(/"/g,'&quot;')}" data-explain="${(it.explanation||'').replace(/"/g,'&quot;')}">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">${it.question}</span>
          <input type="text" placeholder="answer" data-n="${it.n}" data-answer="${it.answer}" style="width:160px;">
          <span class="result" id="res-${it.n}"></span>
        </div>`).join('');
    }
    return `<div class="qgroup">
      <h4>Questions ${g.group}</h4>
      <div class="instr">${g.instructions}</div>
      ${inner}
    </div>`;
  }).join('');
}

function openPassage(i){
  stopReadingTimer();
  state.currentPassage = state.reading.passages[i];
  document.getElementById('reading-list').style.display='none';
  document.getElementById('updates-slot').style.display='none';
  const test = document.getElementById('reading-test');
  test.style.display='block';
  const p = state.currentPassage;
  readingSecondsLeft = p.short ? 5*60 : 15*60;

  const passageKey = p.id || p.title;
  PASSAGE_TEXT_REGISTRY[passageKey] = p.paragraphs;
  const savedHL = loadPassageHighlights()[passageKey];
  const paragraphsHTML = savedHL || Object.entries(p.paragraphs).map(([label,text])=>
    `<p><span class="para-label">${label}</span>${text}</p>`).join('');

  const qgroupsHTML = renderQuestionGroupsHTML(p);

  test.innerHTML = `
    <button class="backbtn" onclick="stopReadingTimer();closePassage()">&larr; 返回閱讀列表</button>
    <div class="split">
      <div class="passage-box">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <h2 style="margin-top:0;">${p.title}</h2>
          <span style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
            <span id="readingTimerDisplay" style="font-weight:800;font-size:17px;color:var(--accent);white-space:nowrap;">${fmtTime(readingSecondsLeft)}</span>
            <button type="button" class="enlarge-btn" title="標記螢光筆" onpointerdown="event.preventDefault()" onclick="highlightSelection()">🖍</button>
            <button type="button" class="enlarge-btn" title="清除標記" onclick="clearHighlights()">🧹</button>
            <button type="button" class="enlarge-btn" title="放大文章（仍可標記螢光筆）" onclick="openEnlargeLive('passageTextOnly', true)">⛶</button>
          </span>
        </div>
        <div id="passageTextOnly" data-hl-key="${passageKey}">${paragraphsHTML}</div>
      </div>
      <div class="split-resizer" onmousedown="splitResizerStart(event)" ontouchstart="splitResizerStart(event)"></div>
      <div class="qbox">
        <form id="qform" onchange="saveReadingAnswers()" oninput="saveReadingAnswers()">${qgroupsHTML}</form>
        <div class="submitbar">
          <span class="score" id="scoreDisplay"></span>
          <button type="button" onclick="gradePassage(false)">對答案</button>
        </div>
      </div>
    </div>
  `;
  restoreReadingAnswers(passageKey);
  startReadingTimer();
  applySavedSplitWidths(test);
}

function startReadingTimer(){
  readingTimerId = setInterval(()=>{
    readingSecondsLeft--;
    const d2 = document.getElementById('readingTimerDisplay');
    if(d2) d2.textContent = fmtTime(Math.max(0,readingSecondsLeft));
    if(readingSecondsLeft <= 60 && d2) d2.style.color = 'var(--bad)';
    if(readingSecondsLeft <= 0){
      gradePassage(true);
    }
  }, 1000);
}

function stopReadingTimer(){
  if(readingTimerId){ clearInterval(readingTimerId); readingTimerId = null; }
}

function closePassage(){
  if(state.currentReadingQType) renderReadingQTypeList();
  else if(state.currentReadingCat) renderReadingCategoryList();

}

/* ---------- reading in-progress answer autosave (so an accidental exit isn't lost) ---------- */
function readingDraftKey(passageKey){ return `readingDraft_${passageKey}`; }
function saveReadingAnswers(){
  if(!state.currentPassage) return;
  const key = state.currentPassage.id || state.currentPassage.title;
  const form = document.getElementById('qform');
  if(!form) return;
  const answers = {};
  form.querySelectorAll('select[data-n]').forEach(sel=>{ if(sel.value) answers[sel.dataset.n] = sel.value; });
  form.querySelectorAll('input[type=text][data-n]').forEach(inp=>{ if(inp.value) answers[inp.dataset.n] = inp.value; });
  const seen = new Set();
  form.querySelectorAll('input[type=radio][data-n]').forEach(r=>{
    if(seen.has(r.dataset.n)) return;
    const checked = form.querySelector('input[name=q'+r.dataset.n+']:checked');
    if(checked){ answers[r.dataset.n] = checked.value; seen.add(r.dataset.n); }
  });
  try{
    if(Object.keys(answers).length){ localStorage.setItem(readingDraftKey(key), JSON.stringify(answers)); }
    else localStorage.removeItem(readingDraftKey(key));
  }catch(e){}
}
function loadReadingAnswers(key){
  try{ return JSON.parse(localStorage.getItem(readingDraftKey(key)) || 'null'); }catch(e){ return null; }
}
function clearReadingAnswers(key){
  try{ localStorage.removeItem(readingDraftKey(key)); }catch(e){}
}
function restoreReadingAnswers(passageKey){
  const answers = loadReadingAnswers(passageKey);
  if(!answers) return;
  const form = document.getElementById('qform');
  if(!form) return;
  Object.entries(answers).forEach(([n, val])=>{
    const sel = form.querySelector(`select[data-n="${n}"]`);
    if(sel){ sel.value = val; return; }
    const radio = form.querySelector(`input[type=radio][name=q${n}][value="${val}"]`);
    if(radio){ radio.checked = true; return; }
    const inp = form.querySelector(`input[type=text][data-n="${n}"]`);
    if(inp) inp.value = val;
  });
}

/* ---------- answer explanations (auto-expand on wrong answer) ---------- */
function showExplanationBlock(qitem, correctAnswer){
  if(!qitem) return;
  clearExplanationBlock(qitem);
  const text = (qitem.dataset.explain || '').trim();
  const body = text ? text : `解析建置中，正確答案為 ${correctAnswer}。`;
  const div = document.createElement('div');
  div.className = 'qexplain';
  div.innerHTML = `<span class="qexplain-lbl">💡 詳解</span>${body}`;
  qitem.appendChild(div);
}
function clearExplanationBlock(qitem){
  if(!qitem) return;
  const old = qitem.querySelector('.qexplain');
  if(old) old.remove();
}

// Grades one <form> of rendered question groups against their data-answer attributes.
// Looks up each item's result span via the enclosing .qitem rather than a global
// getElementById('res-N') lookup, so this works even when multiple passages (each
// with their own n=1.. numbering) are present in the DOM at once, as in the mock exam.
function gradeForm(form, passageTitle){
  let correct=0, total=0;
  const wrongItems = [];

  form.querySelectorAll('select[data-answer]').forEach(sel=>{
    total++;
    const qitem = sel.closest('.qitem');
    const res = qitem.querySelector('.result');
    const qtext = qitem ? qitem.dataset.text : '';
    if(sel.value && sel.value.toLowerCase()===sel.dataset.answer.toLowerCase()){ correct++; res.textContent='✓'; res.className='result correct'; clearExplanationBlock(qitem); }
    else {
      res.textContent='✗ ('+sel.dataset.answer+')'; res.className='result wrong';
      wrongItems.push({passageTitle, n:sel.dataset.n, text:qtext, yourAnswer:sel.value, correctAnswer:sel.dataset.answer});
      showExplanationBlock(qitem, sel.dataset.answer);
    }
  });
  const seen = new Set();
  form.querySelectorAll('input[type=radio][data-answer]').forEach(r=>{
    if(seen.has(r.dataset.n)) return;
    const checked = form.querySelector('input[name=q'+r.dataset.n+']:checked');
    total++; seen.add(r.dataset.n);
    const qitem = r.closest('.qitem');
    const res = qitem.querySelector('.result');
    const qtext = qitem ? qitem.dataset.text : '';
    if(checked && checked.value===r.dataset.answer){ correct++; res.textContent='✓'; res.className='result correct'; clearExplanationBlock(qitem); }
    else {
      res.textContent='✗ ('+r.dataset.answer+')'; res.className='result wrong';
      wrongItems.push({passageTitle, n:r.dataset.n, text:qtext, yourAnswer:checked?checked.value:'', correctAnswer:r.dataset.answer});
      showExplanationBlock(qitem, r.dataset.answer);
    }
  });
  form.querySelectorAll('input[type=text][data-answer]').forEach(inp=>{
    total++;
    const qitem = inp.closest('.qitem');
    const res = qitem.querySelector('.result');
    const qtext = qitem ? qitem.dataset.text : '';
    const norm = s => (s||'').trim().toLowerCase();
    if(norm(inp.value)===norm(inp.dataset.answer)){ correct++; res.textContent='✓'; res.className='result correct'; clearExplanationBlock(qitem); }
    else {
      res.textContent='✗ ('+inp.dataset.answer+')'; res.className='result wrong';
      wrongItems.push({passageTitle, n:inp.dataset.n, text:qtext, yourAnswer:inp.value, correctAnswer:inp.dataset.answer});
      showExplanationBlock(qitem, inp.dataset.answer);
    }
  });
  return { correct, total, wrongItems };
}

// Official-style IELTS Academic Reading raw-score (out of 40) to Band conversion table.
// Since individual passage practice rarely totals exactly 40 questions, the score is
// scaled proportionally to a /40 equivalent before lookup — an estimate, not an
// official result, which is why it's always labelled "換算約" / "僅供參考".
const READING_BAND_TABLE = [
  [39,9.0],[37,8.5],[35,8.0],[33,7.5],[30,7.0],[27,6.5],[23,6.0],
  [19,5.5],[15,5.0],[13,4.5],[10,4.0],[8,3.5],[6,3.0],[4,2.5],[0,1.0]
];
function readingBandFromRaw40(raw){
  for(const [min,band] of READING_BAND_TABLE){ if(raw>=min) return band; }
  return 1.0;
}
function readingBandEstimate(correct, total){
  if(!total) return null;
  const scaled = Math.round((correct/total)*40);
  return readingBandFromRaw40(scaled);
}

function gradePassage(autoSubmitted){
  stopReadingTimer();
  const form = document.getElementById('qform');
  const passageTitle = state.currentPassage ? state.currentPassage.title : '';
  const { correct, total, wrongItems } = gradeForm(form, passageTitle);
  const band = readingBandEstimate(correct, total);
  const scoreEl = document.getElementById('scoreDisplay');
  scoreEl.textContent = (autoSubmitted ? "⏰ 時間到 — " : '') + `分數：${correct} / ${total}　換算約 Band ${band.toFixed(1)}（僅供參考）`;

  saveHistoryEntry({ type:'reading', title: passageTitle, score: correct, total, band });
  addWrongAnswers(wrongItems);
  syncToBackend('reading_score', { title: passageTitle, score: correct, total });
  wrongItems.forEach(w => syncToBackend('wrong_answer', w));
  if(state.currentPassage){ clearReadingAnswers(state.currentPassage.id || state.currentPassage.title); }
}

/* ---------- mock exam: 3 random passages, one shared 60-minute timer, free tab
   switching between passages (like the real test), graded together at the end ---------- */
function passageItemCount(p){ return p.questions.reduce((s,g)=>s+g.items.length, 0); }
function pickMockPassages(){
  const pool = (state.reading.passages||[]).filter(p => passageItemCount(p) >= 8);
  if(pool.length < 3) return null;
  let best=null, bestDiff=Infinity;
  for(let attempt=0; attempt<300; attempt++){
    const shuffled = [...pool].sort(()=>Math.random()-0.5);
    const combo = shuffled.slice(0,3);
    const total = combo.reduce((s,p)=>s+passageItemCount(p), 0);
    const diff = Math.abs(total-40);
    if(diff < bestDiff){ bestDiff = diff; best = combo; }
    if(diff === 0) break;
  }
  return best;
}
