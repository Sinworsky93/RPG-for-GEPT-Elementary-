/* ---------- chart rendering helpers ---------- */
const PALETTE = ['#2f6fed','#e0673f','#1c8a4b','#b8860b','#8b5cf6','#0891b2'];

// Standard "nice numbers" axis algorithm (Heckbert) — produces round-number gridlines
// (e.g. 0/10/20/30/40) like real IELTS Task 1 charts, instead of raw fractional ticks.
function niceNumber(range, round){
  if(range === 0) return 1;
  const exponent = Math.floor(Math.log10(range));
  const fraction = range / Math.pow(10, exponent);
  let niceFraction;
  if(round){
    if(fraction < 1.5) niceFraction = 1;
    else if(fraction < 3) niceFraction = 2;
    else if(fraction < 7) niceFraction = 5;
    else niceFraction = 10;
  } else {
    if(fraction <= 1) niceFraction = 1;
    else if(fraction <= 2) niceFraction = 2;
    else if(fraction <= 5) niceFraction = 5;
    else niceFraction = 10;
  }
  return niceFraction * Math.pow(10, exponent);
}
function niceScale(minVal, maxVal, maxTicks){
  if(minVal === maxVal){ maxVal = minVal + 1; }
  const range = niceNumber(maxVal - minVal, false);
  const step = niceNumber(range / (maxTicks - 1), true);
  const niceMin = Math.floor(minVal / step) * step;
  const niceMax = Math.ceil(maxVal / step) * step;
  return { min: niceMin, max: niceMax, step };
}

const LINE_DASH = ['','6,4','2,3','8,3,2,3','1,4','10,2,2,2'];
const LINE_MARKERS = ['circle','square','triangle','diamond','cross','triangle-down'];
function markerSVG(shape, cx, cy, color, r){
  r = r || 4.5;
  switch(shape){
    case 'square': return `<rect x="${cx-r}" y="${cy-r}" width="${r*2}" height="${r*2}" fill="${color}" stroke="#fff" stroke-width="1.3"/>`;
    case 'triangle': { const h=r*1.35; return `<polygon points="${cx},${cy-h} ${cx-h},${cy+h*0.85} ${cx+h},${cy+h*0.85}" fill="${color}" stroke="#fff" stroke-width="1.3"/>`; }
    case 'triangle-down': { const h=r*1.35; return `<polygon points="${cx},${cy+h} ${cx-h},${cy-h*0.85} ${cx+h},${cy-h*0.85}" fill="${color}" stroke="#fff" stroke-width="1.3"/>`; }
    case 'diamond': return `<polygon points="${cx},${cy-r*1.3} ${cx+r*1.3},${cy} ${cx},${cy+r*1.3} ${cx-r*1.3},${cy}" fill="${color}" stroke="#fff" stroke-width="1.3"/>`;
    case 'cross': return `<g stroke="${color}" stroke-width="2.6" stroke-linecap="round"><line x1="${cx-r}" y1="${cy-r}" x2="${cx+r}" y2="${cy+r}"/><line x1="${cx-r}" y1="${cy+r}" x2="${cx+r}" y2="${cy-r}"/></g>`;
    default: return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="#fff" stroke-width="1.3"/>`;
  }
}
function svgLineChart(chart){
  const W=760,H=380,padL=54,padR=20,padT=28,padB=40;
  const allVals = chart.series.flatMap(s=>s.values);
  const scale = niceScale(Math.min(0, Math.min(...allVals)), Math.max(...allVals), 5);
  const max = scale.max, min = scale.min;
  const n = chart.labels.length;
  const x = i => padL + (W-padL-padR) * (i/(n-1));
  const y = v => H-padB - (H-padT-padB) * ((v-min)/(max-min || 1));
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">`;
  for(let v=min; v<=max+1e-9; v+=scale.step){
    const gy = y(v);
    svg += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="#eceff3"/>`;
    svg += `<text x="${padL-8}" y="${gy+4}" font-size="12" fill="#5b6472" text-anchor="end">${Math.round(v)}</text>`;
  }
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#8a92a0"/>`;
  chart.labels.forEach((l,i)=>{ svg += `<text x="${x(i)}" y="${H-padB+22}" font-size="12" fill="#5b6472" text-anchor="middle">${l}</text>`; });
  function l(i){ return chart.labels[i]; }
  // Draw every line first, then every marker on top — otherwise a later series' line
  // would be painted over an earlier series' markers when several lines coincide.
  chart.series.forEach((s,si)=>{
    const color = PALETTE[si%PALETTE.length];
    const pts = s.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    const dash = LINE_DASH[si%LINE_DASH.length];
    svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3"${dash?` stroke-dasharray="${dash}"`:''}/>`;
  });
  // Real IELTS line graphs do not print a number at every data point — readers use the
  // gridlines/axis to estimate values. Distinct marker shapes (not just colour/dash) let
  // readers tell lines apart even at points where two series' values coincide exactly.
  chart.series.forEach((s,si)=>{
    const color = PALETTE[si%PALETTE.length];
    const shape = LINE_MARKERS[si%LINE_MARKERS.length];
    s.values.forEach((v,i)=>{
      svg += `<g>${markerSVG(shape, x(i), y(v), color)}<title>${s.name} — ${l(i)}: ${v}</title></g>`;
    });
  });
  svg += '</svg>';
  const legend = chart.series.map((s,si)=>{
    const color = PALETTE[si%PALETTE.length], shape = LINE_MARKERS[si%LINE_MARKERS.length];
    const markerIcon = `<svg width="14" height="14" viewBox="0 0 14 14" style="flex-shrink:0;">${markerSVG(shape,7,7,color,3.5)}</svg>`;
    return `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:13px;">${markerIcon}<span style="width:14px;height:0;border-top:3px ${LINE_DASH[si%LINE_DASH.length]?'dashed':'solid'} ${color};display:inline-block;"></span>${s.name}</span>`;
  }).join('');
  return `<div>${svg}<div style="margin-top:8px;">${legend}</div><div style="font-size:11px;color:var(--sub);margin-top:3px;">滑鼠移到資料點上可看到精確數值；不同線條以顏色、線型（實線/虛線）與資料點形狀三重方式區分，重疊時也能分辨${chart.unit?`；單位：${chart.unit}`:''}</div></div>`;
}

function svgBarChart(chart){
  const W=760,H=380,padL=54,padR=20,padT=28,padB=40;
  const allVals = chart.series.flatMap(s=>s.values);
  const scale = niceScale(0, Math.max(...allVals), 5);
  const max = scale.max;
  const n = chart.labels.length, sN = chart.series.length;
  const groupW = (W-padL-padR)/n;
  const barW = Math.min(40, (groupW*0.72)/sN);
  const y = v => H-padB - (H-padT-padB) * (v/max);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">`;
  for(let v=0; v<=max+1e-9; v+=scale.step){
    const gy = y(v);
    svg += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="#eceff3"/>`;
    svg += `<text x="${padL-8}" y="${gy+4}" font-size="12" fill="#5b6472" text-anchor="end">${Math.round(v)}</text>`;
  }
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#8a92a0"/>`;
  chart.labels.forEach((l,i)=>{
    const gx = padL + groupW*i + groupW/2;
    svg += `<text x="${gx}" y="${H-padB+22}" font-size="12" fill="#5b6472" text-anchor="middle">${l}</text>`;
    chart.series.forEach((s,si)=>{
      const v = s.values[i];
      const bx = gx - (sN*barW)/2 + si*barW;
      svg += `<rect x="${bx}" y="${y(v)}" width="${barW-2}" height="${H-padB-y(v)}" fill="${PALETTE[si%PALETTE.length]}" rx="2"/>`;
      svg += `<text x="${bx+(barW-2)/2}" y="${y(v)-6}" font-size="10.5" font-weight="700" fill="${PALETTE[si%PALETTE.length]}" text-anchor="middle">${v}</text>`;
    });
  });
  svg += '</svg>';
  const legend = sN>1 ? chart.series.map((s,si)=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px;"><span style="width:10px;height:10px;background:${PALETTE[si%PALETTE.length]};border-radius:2px;display:inline-block;"></span>${s.name}</span>`).join('') : '';
  return `<div>${svg}<div style="margin-top:6px;">${legend}</div>${chart.unit?`<div style="font-size:11px;color:var(--sub);margin-top:2px;">Unit: ${chart.unit}</div>`:''}</div>`;
}

function svgPieSet(chart){
  const R=80, M=46; // M: extra margin around the circle so small slices can get an
                     // external label + leader line instead of no label at all.
  const SMALL_THRESHOLD = 0.08;
  const pieSVG = (pie)=>{
    const total = pie.values.reduce((a,b)=>a+b,0);
    let angle = -Math.PI/2, path='', labels='';
    const cx=R+M, cy=R+M;
    let smallCount = 0;
    pie.values.forEach((v,i)=>{
      const frac = v/total, a2 = angle + frac*2*Math.PI;
      const x1=cx+R*Math.cos(angle), y1=cy+R*Math.sin(angle);
      const x2=cx+R*Math.cos(a2), y2=cy+R*Math.sin(a2);
      const large = frac>0.5?1:0;
      const mid = angle + (a2-angle)/2;
      const labelText = chart.unit === '%' ? `${v}%` : `${v}`;
      path += `<path d="M${cx},${cy} L${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} Z" fill="${PALETTE[i%PALETTE.length]}"/>`;
      if(frac > SMALL_THRESHOLD){
        const lx = cx + (R*0.65)*Math.cos(mid), ly = cy + (R*0.65)*Math.sin(mid);
        labels += `<text x="${lx}" y="${ly}" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">${labelText}</text>`;
      } else {
        // Small slices don't have room for an inside label — every slice must still show
        // its number, so draw a leader line out to a label placed outside the circle.
        // Alternate the leader length so consecutive small slices don't collide.
        const leadR = R + 10 + (smallCount % 2) * 15;
        const ex = cx + leadR*Math.cos(mid), ey = cy + leadR*Math.sin(mid);
        const tx = cx + (leadR+12)*Math.cos(mid), ty = cy + (leadR+12)*Math.sin(mid);
        const anchor = Math.cos(mid) > 0.15 ? 'start' : (Math.cos(mid) < -0.15 ? 'end' : 'middle');
        const px = cx + (R+2)*Math.cos(mid), py = cy + (R+2)*Math.sin(mid);
        labels += `<line x1="${px}" y1="${py}" x2="${ex}" y2="${ey}" stroke="#5b6472" stroke-width="1"/>`;
        labels += `<text x="${tx}" y="${ty+4}" font-size="12" font-weight="700" fill="#2a2f38" text-anchor="${anchor}">${labelText}</text>`;
        smallCount++;
      }
      angle = a2;
    });
    return `<div style="text-align:center;">
      <svg viewBox="0 0 ${(R+M)*2} ${(R+M)*2}" width="220" height="220">${path}${labels}</svg>
      <div style="font-weight:700;font-size:14px;margin-top:6px;">${pie.year}</div>
    </div>`;
  };
  const legend = chart.pies[0].labels.map((l,i)=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:13px;"><span style="width:11px;height:11px;background:${PALETTE[i%PALETTE.length]};border-radius:2px;display:inline-block;"></span>${l}</span>`).join('');
  const unitNote = chart.unit ? `<div style="font-size:11px;color:var(--sub);margin-top:6px;">Unit: ${chart.unit}</div>` : '';
  return `<div style="display:flex;gap:24px;flex-wrap:wrap;">${chart.pies.map(pieSVG).join('')}</div><div style="margin-top:10px;">${legend}</div>${unitNote}`;
}

function htmlTable(chart){
  let html = `<div class="scrollx"><table style="width:100%;border-collapse:collapse;font-size:13px;">
    <tr><th style="text-align:left;border-bottom:2px solid var(--line);padding:6px;">${chart.rowLabel||''}</th>${chart.columns.map(c=>`<th style="text-align:right;border-bottom:2px solid var(--line);padding:6px;">${c}</th>`).join('')}</tr>`;
  chart.rows.forEach(r=>{
    html += `<tr><td style="padding:6px;border-bottom:1px solid var(--line);font-weight:600;">${r.label}</td>${r.values.map(v=>`<td style="text-align:right;padding:6px;border-bottom:1px solid var(--line);">${v}</td>`).join('')}</tr>`;
  });
  html += '</table></div>';
  if(chart.unit) html += `<div style="font-size:11px;color:var(--sub);margin-top:6px;">Unit: ${chart.unit}</div>`;
  return html;
}

const FLOW_ARROW_H_SVG = `<svg width="28" height="18" viewBox="0 0 28 18"><line x1="0" y1="9" x2="18" y2="9" stroke="#8a92a0" stroke-width="2.5"/><polygon points="28,9 16,3 16,15" fill="#8a92a0"/></svg>`;

function processSteps(chart){
  const parts = [];
  chart.steps.forEach((s,i)=>{
    parts.push(`<div class="flow-box"><div class="flow-num">${i+1}</div><div class="flow-text">${s}</div></div>`);
    if(i < chart.steps.length-1) parts.push(`<div class="flow-arrow-h">${FLOW_ARROW_H_SVG}</div>`);
  });
  // A horizontal, wrapping row of boxes joined by arrows — a genuine drawn flow
  // diagram (like real IELTS process diagrams) rather than a plain numbered list.
  return `<div class="flowchart-h">${parts.join('')}</div>`;
}

const COMPASS_SVG = `<svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="none" stroke="#8a92a0" stroke-width="1.5"/><text x="17" y="8" font-size="8" fill="#5b6472" text-anchor="middle">N</text><text x="17" y="30" font-size="8" fill="#5b6472" text-anchor="middle">S</text><text x="4" y="20" font-size="8" fill="#5b6472" text-anchor="middle">W</text><text x="30" y="20" font-size="8" fill="#5b6472" text-anchor="middle">E</text><line x1="17" y1="10" x2="17" y2="24" stroke="#c0392b" stroke-width="1.5"/><line x1="9" y1="17" x2="25" y2="17" stroke="#8a92a0" stroke-width="1"/></svg>`;

// Renders an authored scene (chart.scenes[0]/[1]) with real, hand-placed coordinates
// for that specific map's roads/rail/coastline, land-use areas, and points of interest.
// Unlike a generic decorative layout, the same feature keeps the same (x,y) across the
// "before" and "after" scene unless the passage says it moved — so the two panels are
// genuinely comparable, and the picture reflects the described spatial relationships
// (adjacency, connections, direction) instead of arbitrary slots.
function sceneSVG(scene){
  const W=300, H=160;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="170" style="display:block;border-radius:8px;background:#eef2ea;">`;
  (scene.areas||[]).forEach(a=>{
    if(a.shape==='circle'){
      svg += `<circle cx="${a.x}" cy="${a.y}" r="${a.r}" fill="${a.fill||'#c9d6c3'}" stroke="#8a9a86" stroke-width="1"/>`;
      if(a.label) svg += `<text x="${a.x}" y="${a.y+3}" font-size="${a.fontSize||8}" text-anchor="middle" fill="#33372f" font-weight="700">${a.label}</text>`;
    } else {
      svg += `<rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" fill="${a.fill||'#c9d6c3'}" stroke="#8a9a86" stroke-width="1" rx="4"/>`;
      if(a.label) svg += `<text x="${a.x+a.w/2}" y="${a.y+a.h/2+3}" font-size="8" text-anchor="middle" fill="#33372f" font-weight="700">${a.label}</text>`;
    }
  });
  (scene.paths||[]).forEach(p=>{
    if(p.style==='rail'){
      svg += `<path d="${p.d}" stroke="#5b6472" stroke-width="3" fill="none"/>`;
      svg += `<path d="${p.d}" stroke="#fff" stroke-width="1" stroke-dasharray="2,3" fill="none"/>`;
    } else if(p.style==='coast'){
      svg += `<path d="${p.d}" stroke="#7fb0d6" stroke-width="10" fill="none" stroke-linecap="round"/>`;
    } else if(p.style==='divider'){
      svg += `<path d="${p.d}" stroke="#5b6472" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>`;
    } else {
      svg += `<path d="${p.d}" stroke="#c7cdd6" stroke-width="9" fill="none" stroke-linecap="round"/>`;
      svg += `<path d="${p.d}" stroke="#fff" stroke-width="1.3" stroke-dasharray="6,6" fill="none"/>`;
    }
    if(p.label){
      svg += `<text x="${p.lx}" y="${p.ly}" font-size="8" fill="#5b6472" font-weight="700">${p.label}</text>`;
    }
  });
  (scene.points||[]).forEach(pt=>{
    if(pt.shape==='roundabout'){
      svg += `<circle cx="${pt.x}" cy="${pt.y}" r="7" fill="#eef2ea" stroke="#8a92a0" stroke-width="3"/>`;
    } else if(pt.shape==='star'){
      svg += `<circle cx="${pt.x}" cy="${pt.y}" r="9" fill="#2f6fed" stroke="#fff" stroke-width="2"/><text x="${pt.x}" y="${pt.y+3.5}" font-size="9" fill="#fff" font-weight="800" text-anchor="middle">${pt.tag||'S'}</text>`;
    } else if(pt.shape==='turbine'){
      svg += `<line x1="${pt.x}" y1="${pt.y}" x2="${pt.x}" y2="${pt.y-10}" stroke="#5b6472" stroke-width="1.5"/><circle cx="${pt.x}" cy="${pt.y-10}" r="2.5" fill="#5b6472"/><line x1="${pt.x}" y1="${pt.y-10}" x2="${pt.x-6}" y2="${pt.y-14}" stroke="#5b6472" stroke-width="1.3"/><line x1="${pt.x}" y1="${pt.y-10}" x2="${pt.x+6}" y2="${pt.y-14}" stroke="#5b6472" stroke-width="1.3"/>`;
    } else {
      svg += `<circle cx="${pt.x}" cy="${pt.y}" r="6" fill="#c0392b" stroke="#fff" stroke-width="2"/>`;
    }
    if(pt.label) svg += `<text x="${pt.x}" y="${pt.y - (pt.shape==='turbine'?18:11)}" font-size="8.5" text-anchor="middle" fill="#2a2f38" font-weight="700">${pt.label}</text>`;
  });
  (scene.labels||[]).forEach(l=>{
    svg += `<text x="${l.x}" y="${l.y}" font-size="${l.size||8.5}" text-anchor="${l.anchor||'middle'}" fill="${l.color||'#3a3f36'}" font-weight="700">${l.text}</text>`;
  });
  svg += '</svg>';
  return svg;
}

function mapCompare(chart){
  const panel = (label, idx) => `<div class="map-panel">
    <div class="map-panel-title">${label}</div>
    ${chart.scenes ? sceneSVG(chart.scenes[idx]) : ''}
    <ul class="map-feature-list">${chart.rows.map(r=>`<li><span class="map-pin-num">•</span><span>${r[idx]}</span></li>`).join('')}</ul>
  </div>`;
  return `<div class="map-compare-wrap">
    <div style="text-align:center;margin-bottom:4px;">${COMPASS_SVG}</div>
    <div class="map-compare">
      ${panel(chart.columns[0], 0)}
      <div class="map-compare-arrow">→</div>
      ${panel(chart.columns[1], 1)}
    </div>
  </div>`;
}

function renderChart(item){
  if(!item.chart) return '';
  const wrap = inner => `<div style="background:var(--chip);border-radius:8px;padding:14px;margin-top:10px;">${inner}</div>`;
  switch(item.chart_type){
    case 'line': return wrap(svgLineChart(item.chart));
    case 'bar': return wrap(svgBarChart(item.chart));
    case 'pie': return wrap(svgPieSet(item.chart));
    case 'table': return wrap(htmlTable(item.chart));
    case 'process': return wrap(processSteps(item.chart));
    case 'map': return wrap(mapCompare(item.chart));
    default: return '';
  }
}

/* ---------- essay draft autosave (with cross-device sync via backend) ---------- */
function essayDraftKey(ctx){
  return ctx.kind === 'task1' ? `essayDraft_task1_${ctx.i}` : `essayDraft_task2_${ctx.cat}_${ctx.i}`;
}
let draftSyncTimer = null;
function saveEssayDraft(){
  if(!taskCtx) return;
  const box = document.getElementById('essayBox');
  if(!box) return;
  const key = essayDraftKey(taskCtx);
  const nowIso = new Date().toISOString();
  try{
    localStorage.setItem(key, box.value);
    localStorage.setItem(key+'_ts', nowIso);
  }catch(e){}
  if(BACKEND_URL){
    clearTimeout(draftSyncTimer);
    draftSyncTimer = setTimeout(()=>{ syncToBackend('draft', { ctx: key, text: box.value }); }, 2000);
  }
}
function loadEssayDraft(ctx){
  const key = essayDraftKey(ctx);
  let text = '';
  try{ text = localStorage.getItem(key) || ''; }catch(e){}
  const remote = remoteDraftsCache && remoteDraftsCache[key];
  if(remote){
    let localTs = '';
    try{ localTs = localStorage.getItem(key+'_ts') || ''; }catch(e){}
    if(!localTs || new Date(remote.ts) > new Date(localTs)){
      text = remote.text || '';
      try{ localStorage.setItem(key, text); localStorage.setItem(key+'_ts', remote.ts); }catch(e){}
    }
  }
  return text;
}
function clearEssayDraft(ctx){
  const key = essayDraftKey(ctx||taskCtx);
  if(BACKEND_URL){ syncToBackend('draft', { ctx: key, text: '' }); }
  try{
    localStorage.removeItem(key);
    localStorage.removeItem(key+'_ts');
  }catch(e){}
}

function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function startEssayTimer(){
  essayTimerId = setInterval(()=>{
    essaySecondsLeft--;
    const d = document.getElementById('timerDisplay');
    if(d) d.textContent = fmtTime(Math.max(0,essaySecondsLeft));
    if(essaySecondsLeft <= 60 && d) d.style.color = 'var(--bad)';
    if(essaySecondsLeft <= 0){
      finishEssay(true);
    }
  }, 1000);
}

function stopEssayTimer(){
  if(essayTimerId){ clearInterval(essayTimerId); essayTimerId = null; }
}

function updateWordCount(min){
  const box = document.getElementById('essayBox');
  if(!box) return;
  const text = box.value.trim();
  const words = text.length ? text.split(/\s+/).length : 0;
  const el = document.getElementById('wordCount');
  el.textContent = `${words} / ${min} 字`;
  el.style.color = words>=min ? 'var(--good)' : 'var(--sub)';
}

function toggleModelAnswer(){
  const box = document.getElementById('modelAnswerBox');
  if(box) box.style.display = box.style.display==='none' ? 'block' : 'none';
}

function finishEssay(autoSubmitted){
  stopEssayTimer();
  const ctx = taskCtx || { kind:'task2', minWords:250 };
  const minWords = ctx.minWords;
  const box = document.getElementById('essayBox');
  const text = box ? box.value.trim() : '';
  const words = text.length ? text.split(/\s+/).length : 0;
  const paragraphs = text.split(/\n\s*\n/).filter(p=>p.trim().length>0).length;
  const linkers = ['however','therefore','moreover','furthermore','in addition','for example','for instance',
    'in conclusion','on the other hand','as a result','consequently','in contrast','firstly','secondly','finally',
    'overall','compared to','compared with','whereas','while','in contrast to'];
  const lowerText = text.toLowerCase();
  const linkersUsed = linkers.filter(l=>lowerText.includes(l));
  const hasNumbers = /\d/.test(text);

  const checks = ctx.kind === 'task1' ? [
    { label: `至少 ${minWords} 字`, pass: words>=minWords, detail: `已寫 ${words} 字` },
    { label: '至少 2 段（總覽＋細節）', pass: paragraphs>=2, detail: `偵測到 ${paragraphs} 段` },
    { label: '包含圖表中的具體數據', pass: hasNumbers, detail: hasNumbers ? '報告中有找到數字' : '未偵測到數字' },
    { label: '使用比較／報告用語', pass: linkersUsed.length>=1, detail: linkersUsed.length ? `已使用：${linkersUsed.join(', ')}` : '未偵測到' }
  ] : [
    { label: `至少 ${minWords} 字`, pass: words>=minWords, detail: `已寫 ${words} 字` },
    { label: '至少 4 段（前言／論述／論述／結論）', pass: paragraphs>=4, detail: `偵測到 ${paragraphs} 段` },
    { label: '使用連接詞串連論點', pass: linkersUsed.length>=2, detail: linkersUsed.length ? `已使用：${linkersUsed.join(', ')}` : '未偵測到' }
  ];
  const checksPassed = checks.filter(c=>c.pass).length;

  const modelAnswerHTML = ctx.modelAnswer ? `
      <div class="qgroup">
        <h4>範文參考</h4>
        <div class="instr">這只是其中一種高分寫法，並非唯一正確答案 — 請把它當作結構和用字的參考，不要逐字背誦。</div>
        <button type="button" class="smallbtn" onclick="toggleModelAnswer()">顯示／隱藏範文</button>
        <div id="modelAnswerBox" style="display:none;white-space:pre-wrap;font-size:13.5px;line-height:1.75;background:var(--chip);border-radius:8px;padding:14px;margin-top:10px;">${ctx.modelAnswer.replace(/</g,'&lt;')}</div>
      </div>` : '';

  const el = document.getElementById('writing-list');
  el.innerHTML = `
    <button class="backbtn" onclick="renderWritingCategoryList()">&larr; 返回寫作列表</button>
    <div class="qbox">
      <h3 style="margin-top:0;">${autoSubmitted ? "⏰ 時間到 — 已自動送出" : '檢視結果'}</h3>
      <div class="qgroup">
        <h4>結構自我檢查</h4>
        <div class="instr">這只是機械式檢查（字數／段落／連接詞），不是真正的雅思分數 — 文法、連貫性與題目回應仍需要老師或 AI 批改。</div>
        ${checks.map(c=>`<div class="qitem"><span class="result ${c.pass?'correct':'wrong'}" style="font-size:15px;">${c.pass?'✓':'✗'}</span><span class="qstatement">${c.label} <span style="color:var(--sub);">— ${c.detail}</span></span></div>`).join('')}
      </div>
      <div class="qgroup">
        <h4>你的作文</h4>
        <div style="white-space:pre-wrap;font-size:13.5px;line-height:1.7;background:var(--chip);border-radius:8px;padding:14px;">${text ? text.replace(/</g,'&lt;') : '<span style="color:var(--sub);">（尚未作答）</span>'}</div>
      </div>
      ${modelAnswerHTML}
    </div>
  `;

  const historyTitle = (ctx.kind==='task1' ? 'Task 1：' : 'Task 2：') + (ctx.promptText||'').slice(0,70) + ((ctx.promptText||'').length>70?'…':'');
  saveHistoryEntry({ type:'writing', title: historyTitle, checksPassed, checksTotal: checks.length });
  syncToBackend('writing_score', { title: historyTitle, checksPassed, checksTotal: checks.length });
  clearEssayDraft(ctx);
}

/* ---------- shadowing prototype (真人等級語音跟讀＋錄音比對) ----------
   Only one hardcoded sample answer for now — this is a prototype to validate the
   mechanic (sentence-highlighted playback at adjustable speed + shadow recording)
   before writing model-answer text for the full speaking question bank.
   Audio comes from Google Cloud Text-to-Speech (Neural2 voice) via the Apps Script
   backend when BACKEND_URL is configured — same fire-and-forget-POST + GET-poll
   pattern as the AI speaking feedback, for the same cross-browser reasons. Each
   sentence's audio is fetched once (at natural rate) and cached client-side as a
   blob URL; the speed selector then just changes <audio>.playbackRate locally, so
   changing speed never needs a re-fetch. Falls back to the browser's built-in
   speechSynthesis when no backend is configured, so the feature still works without
   deployment — just with the more robotic voice quality. */
const SHADOW_DEMO = {
  title: 'Describe your favourite city or a city you have visited that you like very much.',
  text: "I'd like to talk about Kyoto, a city I visited in Japan a few years ago. It's located in the Kansai region, not too far from Osaka, and it used to be the capital of Japan for over a thousand years. I went there in the spring, actually, during cherry blossom season, which turned out to be perfect timing. The main reason I loved it so much was the incredible mix of old and new — you'd walk past a modern shopping street and then suddenly find yourself in front of a centuries-old temple. As for major attractions, I'd definitely recommend Fushimi Inari Shrine, with its thousands of bright orange gates winding up the mountain, and also the Arashiyama bamboo grove, which honestly felt like walking into another world. What really left a lasting impression on me, though, was just how peaceful everything felt, even with so many tourists around. I'd love to go back one day, maybe in autumn this time, to see the leaves change color."
};
let shadowSpeaking = false;
const shadowAudioCache = {}; // sentence index -> blob URL (fetched once at rate 1.0)
let shadowAudioEl = null;
function shadowSentences(){ return SHADOW_DEMO.text.match(/[^.!?]+[.!?]+(\s|$)/g) || [SHADOW_DEMO.text]; }
function shadowingDemoHTML(){
  const sentences = shadowSentences();
  const spans = sentences.map((s,i)=>`<span id="shadowSent-${i}" class="shadow-sent">${s}</span>`).join('');
  const voiceNote = BACKEND_URL
    ? '播放範例回答（Google 真人等級語音），跟著同步唸出來，可以調整語速。念完可以錄音跟自己比對。這是雛型功能，只有這一則示範文字，如果覺得有用，之後會補上完整題庫的範例回答。'
    : '播放範例回答，跟著同步唸出來，可以調整語速。念完可以錄音跟自己比對。⚠️ 目前後台未設定，暫時使用瀏覽器內建語音（較機械化）— 部署後台後會自動改用真人等級語音。';
  return `<div class="qbox" style="background:#f3f0ff;border-color:#c9bdf5;margin-bottom:18px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
      <h3 style="margin:0;">🧪 跟讀練習 Shadowing（雛型）</h3>
      <span class="badge" style="background:#e4dcfb;color:#5b3fc4;">Beta</span>
    </div>
    <div class="instr" style="margin-bottom:10px;">${voiceNote}</div>
    <div style="font-weight:700;font-size:13.5px;margin-bottom:8px;">${SHADOW_DEMO.title}</div>
    <div id="shadowText" style="font-size:14.5px;line-height:2;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;">${spans}</div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
      <button type="button" class="smallbtn" id="shadowPlayBtn" onclick="toggleShadowPlay()">▶️ 播放</button>
      <label style="font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:6px;">語速
        <select id="shadowRate" onchange="applyShadowRate()">
          <option value="0.7">0.7x（慢）</option>
          <option value="0.85">0.85x</option>
          <option value="1" selected>1x（正常）</option>
          <option value="1.15">1.15x</option>
        </select>
      </label>
    </div>
    ${recorderHTML('shadow-demo', 'Shadowing: '+SHADOW_DEMO.title)}
  </div>`;
}
function applyShadowRate(){
  if(shadowAudioEl) shadowAudioEl.playbackRate = parseFloat(document.getElementById('shadowRate').value || '1');
}
function base64ToBlobUrl(base64, mimeType){
  const bytes = atob(base64);
  const arr = new Uint8Array(bytes.length);
  for(let i=0;i<bytes.length;i++) arr[i] = bytes.charCodeAt(i);
  return URL.createObjectURL(new Blob([arr], { type: mimeType }));
}
async function fetchShadowSentenceAudio(text){
  const requestId = 'tts_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  fetch(BACKEND_URL, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ type:'tts', requestId, text })
  }).catch(()=>{});
  for(let i=0;i<25;i++){ // ~50 seconds
    await sleep(2000);
    let data;
    try{
      const res = await fetch(`${BACKEND_URL}?action=tts_status&id=${encodeURIComponent(requestId)}`);
      data = await res.json();
    }catch(e){ continue; }
    if(data.ready){
      if(!data.ok || !data.audioContent) throw new Error(data.error || 'TTS 產生失敗');
      return base64ToBlobUrl(data.audioContent, 'audio/mp3');
    }
  }
  throw new Error('TTS 逾時，請再試一次');
}
function toggleShadowPlay(){
  if(shadowSpeaking){ stopShadowPlay(); return; }
  shadowSpeaking = true;
  document.getElementById('shadowPlayBtn').textContent = '⏸ 停止';
  if(BACKEND_URL) playShadowWithTTS(); else playShadowWithBrowserVoice();
}
async function playShadowWithTTS(){
  const sentences = shadowSentences();
  const btn = document.getElementById('shadowPlayBtn');
  for(let i=0; i<sentences.length; i++){
    if(!shadowSpeaking) return;
    document.querySelectorAll('.shadow-sent').forEach(s=>s.classList.remove('active'));
    const el = document.getElementById('shadowSent-'+i);
    if(el){ el.classList.add('active'); el.scrollIntoView({block:'nearest', behavior:'smooth'}); }
    if(!shadowAudioCache[i]){
      btn.textContent = '⏳ 載入語音中…';
      try{
        shadowAudioCache[i] = await fetchShadowSentenceAudio(sentences[i]);
      }catch(err){
        alert('語音載入失敗：' + err.message);
        stopShadowPlay();
        return;
      }
      if(!shadowSpeaking) return;
      btn.textContent = '⏸ 停止';
    }
    if(!shadowAudioEl){ shadowAudioEl = new Audio(); }
    shadowAudioEl.src = shadowAudioCache[i];
    shadowAudioEl.playbackRate = parseFloat(document.getElementById('shadowRate').value || '1');
    await new Promise((resolve)=>{
      shadowAudioEl.onended = resolve;
      shadowAudioEl.onerror = resolve;
      shadowAudioEl.play().catch(resolve);
    });
  }
  stopShadowPlay();
}
function playShadowWithBrowserVoice(){
  if(!window.speechSynthesis){ alert('這個瀏覽器不支援語音合成（Speech Synthesis）'); stopShadowPlay(); return; }
  const rate = parseFloat(document.getElementById('shadowRate').value || '1');
  const sentences = shadowSentences();
  let i = 0;
  function speakNext(){
    if(!shadowSpeaking || i >= sentences.length){ stopShadowPlay(); return; }
    document.querySelectorAll('.shadow-sent').forEach(s=>s.classList.remove('active'));
    const el = document.getElementById('shadowSent-'+i);
    if(el){ el.classList.add('active'); el.scrollIntoView({block:'nearest', behavior:'smooth'}); }
    const u = new SpeechSynthesisUtterance(sentences[i]);
    u.rate = rate;
    u.lang = 'en-US';
    u.onend = () => { i++; speakNext(); };
    u.onerror = () => { i++; speakNext(); };
    window.speechSynthesis.speak(u);
  }
  speakNext();
}
function stopShadowPlay(){
  shadowSpeaking = false;
  window.speechSynthesis && window.speechSynthesis.cancel();
  if(shadowAudioEl){ shadowAudioEl.pause(); }
  document.querySelectorAll('.shadow-sent').forEach(s=>s.classList.remove('active'));
  const btn = document.getElementById('shadowPlayBtn');
  if(btn) btn.textContent = '▶️ 播放';
}

/* ---------- speech recording (MediaRecorder + IndexedDB, ~7-day local retention) ---------- */
let mediaRecorder = null, recordedChunks = [], currentStream = null;
const REC_RETENTION_DAYS = 7;
let recDBPromise = null;
function openRecDB(){
  if(recDBPromise) return recDBPromise;
  recDBPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open('ieltsRecordingsDB', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains('recordings')){
        const store = db.createObjectStore('recordings', { keyPath:'id', autoIncrement:true });
        store.createIndex('date', 'date');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return recDBPromise;
}
async function saveRecording(topic, blob){
  try{
    const db = await openRecDB();
    return new Promise((resolve)=>{
      const tx = db.transaction('recordings','readwrite');
      tx.objectStore('recordings').add({ topic, blob, date: new Date().toISOString() });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  }catch(e){ return false; }
}
async function getAllRecordings(){
  try{
    const db = await openRecDB();
    return new Promise((resolve)=>{
      const tx = db.transaction('recordings','readonly');
      const req = tx.objectStore('recordings').getAll();
      req.onsuccess = () => resolve(req.result||[]);
      req.onerror = () => resolve([]);
    });
  }catch(e){ return []; }
}
async function getRecording(id){
  try{
    const db = await openRecDB();
    return new Promise((resolve)=>{
      const tx = db.transaction('recordings','readonly');
      const req = tx.objectStore('recordings').get(id);
      req.onsuccess = () => resolve(req.result||null);
      req.onerror = () => resolve(null);
    });
  }catch(e){ return null; }
}
async function deleteRecording(id){
  try{
    const db = await openRecDB();
    const tx = db.transaction('recordings','readwrite');
    tx.objectStore('recordings').delete(id);
  }catch(e){}
}
async function purgeOldRecordings(){
  try{
    const db = await openRecDB();
    const all = await getAllRecordings();
    const cutoff = Date.now() - REC_RETENTION_DAYS*24*60*60*1000;
    const tx = db.transaction('recordings','readwrite');
    const store = tx.objectStore('recordings');
    all.forEach(r => { if(new Date(r.date).getTime() < cutoff) store.delete(r.id); });
  }catch(e){}
}

const RECORDING_SUPPORTED = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder && window.indexedDB);
let activeRecZoneId = null;
function recorderHTML(zoneId, topic){
  if(!RECORDING_SUPPORTED) return `<div class="hist-meta">此瀏覽器不支援錄音功能。</div>`;
  const safeTopic = (topic||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');
  return `<div class="rec-row">
      <button type="button" class="smallbtn" id="recBtn-${zoneId}" onclick="toggleRecording('${zoneId}','${safeTopic}')">🎙️ 開始錄音</button>
      <span id="recStatus-${zoneId}" class="hist-meta"></span>
    </div>
    <div id="recPlayback-${zoneId}"></div>`;
}
async function toggleRecording(zoneId, topic){
  const btn = document.getElementById('recBtn-'+zoneId);
  const status = document.getElementById('recStatus-'+zoneId);
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    if(activeRecZoneId === zoneId){ mediaRecorder.stop(); }
    else if(status){ status.textContent = '請先停止目前正在錄音的題目。'; }
    return;
  }
  try{
    currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){
    if(status) status.textContent = '麥克風權限被拒絕。';
    return;
  }
  activeRecZoneId = zoneId;
  recordedChunks = [];
  const preferredMime = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac']
    .find(t => window.MediaRecorder.isTypeSupported && window.MediaRecorder.isTypeSupported(t));
  mediaRecorder = preferredMime ? new MediaRecorder(currentStream, { mimeType: preferredMime }) : new MediaRecorder(currentStream);
  mediaRecorder.ondataavailable = e => { if(e.data && e.data.size) recordedChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    const actualMime = mediaRecorder.mimeType || preferredMime || 'audio/webm';
    const blob = new Blob(recordedChunks, { type: actualMime });
    const url = URL.createObjectURL(blob);
    const pb = document.getElementById('recPlayback-'+zoneId);
    if(pb) pb.innerHTML = `<audio controls src="${url}" style="display:block;margin-top:8px;"></audio>`;
    currentStream.getTracks().forEach(t=>t.stop());
    if(btn) btn.textContent = '🎙️ 重新錄音';
    const saved = await saveRecording(topic, blob);
    if(status) status.textContent = saved ? `錄音已儲存在這台裝置上，約 ${REC_RETENTION_DAYS} 天後自動清除。` : '錄音暫存失敗，只能在這次瀏覽中播放。';
    activeRecZoneId = null;
  };
  mediaRecorder.start();
  if(btn) btn.textContent = '⏹ 停止錄音';
  if(status) status.textContent = '錄音中…';
}

init();
