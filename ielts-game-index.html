<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Practice</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#1b1f27; --sub:#5b6472;
    --line:#e3e6eb; --accent:#2f6fed; --accent-ink:#ffffff;
    --good:#1c8a4b; --bad:#c9432c; --warn:#b8860b;
    --chip:#eef2ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);}
  header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px;}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px;}
  nav{display:flex;gap:4px;}
  nav button{border:none;background:transparent;color:var(--sub);font-size:14px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;}
  nav button.active{background:var(--accent);color:var(--accent-ink);}
  main{max-width:960px;margin:0 auto;padding:24px 20px 80px;}
  .view{display:none;} .view.active{display:block;}

  /* list cards */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:box-shadow .15s, transform .15s;}
  .card:hover{box-shadow:0 4px 14px rgba(20,30,60,.08);transform:translateY(-1px);}
  .card h3{margin:0 0 4px;font-size:16px;}
  .card p{margin:0;color:var(--sub);font-size:13px;}
  .badge{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--chip);padding:2px 8px;border-radius:999px;margin-right:6px;}

  /* passage/test view */
  .backbtn{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:14px;margin-bottom:14px;padding:0;}
  .split{display:grid;grid-template-columns:1fr;gap:20px;}
  @media(min-width:860px){.split{grid-template-columns:1.1fr 1fr;}}
  .passage-box, .qbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;}
  .passage-box{max-height:78vh;overflow-y:auto;position:sticky;top:76px;}
  .passage-box h2{font-size:19px;margin-top:0;}
  .passage-box p{line-height:1.75;font-size:14.5px;}
  .para-label{font-weight:800;color:var(--accent);margin-right:6px;}
  .qgroup{margin-bottom:26px;}
  .qgroup h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin:0 0 4px;}
  .qgroup .instr{font-size:13px;color:var(--sub);margin-bottom:12px;font-style:italic;}
  .heading-list{background:var(--chip);border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.7;margin-bottom:12px;}
  .qitem{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px;flex-wrap:wrap;}
  .qitem .qn{font-weight:700;color:var(--sub);min-width:22px;}
  .qitem select, .qitem input[type=text]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:14px;}
  .tfng label{display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:13px;cursor:pointer;}
  .qstatement{flex:1;min-width:220px;}
  .result{font-size:12px;font-weight:700;margin-left:4px;}
  .result.correct{color:var(--good);}
  .result.wrong{color:var(--bad);}
  .submitbar{background:var(--panel);border-top:1px solid var(--line);padding:14px 0;margin-top:10px;display:flex;align-items:center;justify-content:space-between;}
  .submitbar button{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;}
  .score{font-weight:800;font-size:15px;}

  /* writing/speaking */
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .chip-row span{background:var(--chip);color:var(--accent);font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;}
  .section-title{font-size:15px;font-weight:800;margin:22px 0 10px;text-transform:capitalize;}
  .prompt-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:14px;line-height:1.6;}
  .prompt-item .tag{font-size:11px;font-weight:700;color:#fff;background:#8b98ab;padding:1px 7px;border-radius:5px;margin-right:8px;}
  .cue-card{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:18px;font-size:14px;line-height:1.7;margin-bottom:10px;}
  .flipbtn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;margin-bottom:16px;}
  .part3set{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .part3set h4{margin:0 0 8px;font-size:14px;color:var(--accent);}
  .part3set ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.8;}
  .loading, .empty{color:var(--sub);padding:40px 0;text-align:center;font-size:14px;}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>📘 IELTS Practice</h1>
    <nav>
      <button data-tab="reading" class="active">Reading</button>
      <button data-tab="writing">Writing</button>
      <button data-tab="speaking">Speaking</button>
    </nav>
  </div>
</header>

<main>
  <section id="view-reading" class="view active">
    <div id="reading-list"><div class="loading">Loading reading bank…</div></div>
    <div id="reading-test" style="display:none;"></div>
  </section>

  <section id="view-writing" class="view">
    <div id="writing-list"><div class="loading">Loading writing bank…</div></div>
  </section>

  <section id="view-speaking" class="view">
    <div id="speaking-list"><div class="loading">Loading speaking bank…</div></div>
  </section>
</main>

<script>
const state = { reading: null, writing: null, speaking: null, currentPassage: null };

async function loadJSON(paths){
  for(const p of paths){
    try{
      const res = await fetch(p);
      if(res.ok) return await res.json();
    }catch(e){}
  }
  return null;
}

async function init(){
  state.reading = await loadJSON(['content/reading-bank.json','content/readingbank.json','reading-bank.json','readingbank.json']);
  state.writing = await loadJSON(['content/writing-bank.json','content/writingbank.json','writing-bank.json','writingbank.json']);
  state.speaking = await loadJSON(['content/speaking-bank.json','content/speakingbank.json','speaking-bank.json','speakingbank.json']);
  renderReadingList();
  renderWriting();
  renderSpeaking();
}

/* ---------- nav ---------- */
document.querySelectorAll('nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.tab).classList.add('active');
  });
});

/* ---------- reading ---------- */
function renderReadingList(){
  const el = document.getElementById('reading-list');
  if(!state.reading || !state.reading.passages){ el.innerHTML='<div class="empty">找不到 reading-bank.json</div>'; return; }
  el.innerHTML = state.reading.passages.map((p,i)=>{
    const qcount = p.questions.reduce((s,g)=>s+g.items.length,0);
    return `<div class="card" onclick="openPassage(${i})">
      <span class="badge">Passage ${i+1}</span>
      <h3>${p.title}</h3>
      <p>${Object.keys(p.paragraphs).length} paragraphs · ${qcount} questions</p>
    </div>`;
  }).join('');
}

function openPassage(i){
  state.currentPassage = state.reading.passages[i];
  document.getElementById('reading-list').style.display='none';
  const test = document.getElementById('reading-test');
  test.style.display='block';
  const p = state.currentPassage;

  const paragraphsHTML = Object.entries(p.paragraphs).map(([label,text])=>
    `<p><span class="para-label">${label}</span>${text}</p>`).join('');

  const qgroupsHTML = p.questions.map((g,gi)=>{
    let inner = '';
    if(g.type === 'matching_headings'){
      inner += `<div class="heading-list">${g.headings.join('<br>')}</div>`;
      inner += g.items.map(it=>{
        const opts = g.headings.map(h=>{
          const val = h.split('.')[0].trim();
          return `<option value="${val}">${val}</option>`;
        }).join('');
        return `<div class="qitem">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">Paragraph ${it.paragraph}</span>
          <select data-group="${gi}" data-n="${it.n}" data-answer="${it.answer}">
            <option value="">--</option>${opts}
          </select>
          <span class="result" id="res-${it.n}"></span>
        </div>`;
      }).join('');
    } else if(g.type === 'true_false_not_given'){
      inner += g.items.map(it=>`<div class="qitem">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">${it.statement}</span>
          <span class="tfng">
            ${['TRUE','FALSE','NOT GIVEN'].map(v=>`<label><input type="radio" name="q${it.n}" value="${v}" data-n="${it.n}" data-answer="${it.answer}"> ${v}</label>`).join('')}
          </span>
          <span class="result" id="res-${it.n}"></span>
        </div>`).join('');
    } else if(g.type === 'sentence_completion'){
      inner += g.items.map(it=>`<div class="qitem">
          <span class="qn">${it.n}.</span>
          <span class="qstatement">${it.prompt}</span>
          <input type="text" placeholder="answer" data-n="${it.n}" data-answer="${it.answer}" style="width:140px;">
          <span class="result" id="res-${it.n}"></span>
        </div>`).join('');
    }
    return `<div class="qgroup">
      <h4>Questions ${g.group}</h4>
      <div class="instr">${g.instructions}</div>
      ${inner}
    </div>`;
  }).join('');

  test.innerHTML = `
    <button class="backbtn" onclick="closePassage()">&larr; Back to Reading list</button>
    <div class="split">
      <div class="passage-box">
        <h2>${p.title}</h2>
        ${paragraphsHTML}
      </div>
      <div class="qbox">
        <form id="qform">${qgroupsHTML}</form>
        <div class="submitbar">
          <span class="score" id="scoreDisplay"></span>
          <button type="button" onclick="gradePassage()">Check Answers</button>
        </div>
      </div>
    </div>
  `;
}

function closePassage(){
  document.getElementById('reading-test').style.display='none';
  document.getElementById('reading-list').style.display='block';
}

function gradePassage(){
  const form = document.getElementById('qform');
  let correct=0, total=0;
  form.querySelectorAll('select[data-answer]').forEach(sel=>{
    total++;
    const res = document.getElementById('res-'+sel.dataset.n);
    if(sel.value && sel.value.toLowerCase()===sel.dataset.answer.toLowerCase()){ correct++; res.textContent='✓'; res.className='result correct'; }
    else { res.textContent='✗ ('+sel.dataset.answer+')'; res.className='result wrong'; }
  });
  const seen = new Set();
  form.querySelectorAll('input[type=radio][data-answer]').forEach(r=>{
    if(seen.has(r.dataset.n)) return;
    const checked = form.querySelector('input[name=q'+r.dataset.n+']:checked');
    total++; seen.add(r.dataset.n);
    const res = document.getElementById('res-'+r.dataset.n);
    if(checked && checked.value===r.dataset.answer){ correct++; res.textContent='✓'; res.className='result correct'; }
    else { res.textContent='✗ ('+r.dataset.answer+')'; res.className='result wrong'; }
  });
  form.querySelectorAll('input[type=text][data-answer]').forEach(inp=>{
    total++;
    const res = document.getElementById('res-'+inp.dataset.n);
    const norm = s => (s||'').trim().toLowerCase();
    if(norm(inp.value)===norm(inp.dataset.answer)){ correct++; res.textContent='✓'; res.className='result correct'; }
    else { res.textContent='✗ ('+inp.dataset.answer+')'; res.className='result wrong'; }
  });
  document.getElementById('scoreDisplay').textContent = `Score: ${correct} / ${total}`;
}

/* ---------- chart rendering helpers ---------- */
const PALETTE = ['#2f6fed','#e0673f','#1c8a4b','#b8860b','#8b5cf6','#0891b2'];

function svgLineChart(chart){
  const W=560,H=260,padL=44,padR=14,padT=14,padB=28;
  const allVals = chart.series.flatMap(s=>s.values);
  const max = Math.max(...allVals)*1.1, min = Math.min(0, Math.min(...allVals));
  const n = chart.labels.length;
  const x = i => padL + (W-padL-padR) * (i/(n-1));
  const y = v => H-padB - (H-padT-padB) * ((v-min)/(max-min || 1));
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">`;
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#c7ccd4"/>`;
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#c7ccd4"/>`;
  chart.labels.forEach((l,i)=>{ svg += `<text x="${x(i)}" y="${H-padB+16}" font-size="9" fill="#5b6472" text-anchor="middle">${l}</text>`; });
  chart.series.forEach((s,si)=>{
    const color = PALETTE[si%PALETTE.length];
    const pts = s.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
    s.values.forEach((v,i)=> svg += `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="${color}"/>`);
  });
  svg += '</svg>';
  const legend = chart.series.map((s,si)=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px;"><span style="width:10px;height:10px;background:${PALETTE[si%PALETTE.length]};border-radius:2px;display:inline-block;"></span>${s.name}</span>`).join('');
  return `<div>${svg}<div style="margin-top:6px;">${legend}</div>${chart.unit?`<div style="font-size:11px;color:var(--sub);margin-top:2px;">Unit: ${chart.unit}</div>`:''}</div>`;
}

function svgBarChart(chart){
  const W=560,H=260,padL=44,padR=14,padT=14,padB=28;
  const allVals = chart.series.flatMap(s=>s.values);
  const max = Math.max(...allVals)*1.15;
  const n = chart.labels.length, sN = chart.series.length;
  const groupW = (W-padL-padR)/n;
  const barW = Math.min(28, (groupW*0.7)/sN);
  const y = v => H-padB - (H-padT-padB) * (v/max);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">`;
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#c7ccd4"/>`;
  chart.labels.forEach((l,i)=>{
    const gx = padL + groupW*i + groupW/2;
    svg += `<text x="${gx}" y="${H-padB+16}" font-size="9" fill="#5b6472" text-anchor="middle">${l}</text>`;
    chart.series.forEach((s,si)=>{
      const v = s.values[i];
      const bx = gx - (sN*barW)/2 + si*barW;
      svg += `<rect x="${bx}" y="${y(v)}" width="${barW-2}" height="${H-padB-y(v)}" fill="${PALETTE[si%PALETTE.length]}" rx="1.5"/>`;
    });
  });
  svg += '</svg>';
  const legend = sN>1 ? chart.series.map((s,si)=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px;"><span style="width:10px;height:10px;background:${PALETTE[si%PALETTE.length]};border-radius:2px;display:inline-block;"></span>${s.name}</span>`).join('') : '';
  return `<div>${svg}<div style="margin-top:6px;">${legend}</div>${chart.unit?`<div style="font-size:11px;color:var(--sub);margin-top:2px;">Unit: ${chart.unit}</div>`:''}</div>`;
}

function svgPieSet(chart){
  const R=48;
  const pieSVG = (pie)=>{
    const total = pie.values.reduce((a,b)=>a+b,0);
    let angle = -Math.PI/2, path='';
    const cx=R+4, cy=R+4;
    pie.values.forEach((v,i)=>{
      const frac = v/total, a2 = angle + frac*2*Math.PI;
      const x1=cx+R*Math.cos(angle), y1=cy+R*Math.sin(angle);
      const x2=cx+R*Math.cos(a2), y2=cy+R*Math.sin(a2);
      const large = frac>0.5?1:0;
      path += `<path d="M${cx},${cy} L${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} Z" fill="${PALETTE[i%PALETTE.length]}"/>`;
      angle = a2;
    });
    return `<div style="text-align:center;">
      <svg viewBox="0 0 ${(R+4)*2} ${(R+4)*2}" width="120" height="120">${path}</svg>
      <div style="font-weight:700;font-size:12px;margin-top:4px;">${pie.year}</div>
    </div>`;
  };
  const legend = chart.pies[0].labels.map((l,i)=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px;"><span style="width:10px;height:10px;background:${PALETTE[i%PALETTE.length]};border-radius:2px;display:inline-block;"></span>${l}</span>`).join('');
  return `<div style="display:flex;gap:24px;flex-wrap:wrap;">${chart.pies.map(pieSVG).join('')}</div><div style="margin-top:10px;">${legend}</div>`;
}

function htmlTable(chart){
  let html = `<table style="width:100%;border-collapse:collapse;font-size:13px;">
    <tr><th style="text-align:left;border-bottom:2px solid var(--line);padding:6px;">${chart.rowLabel||''}</th>${chart.columns.map(c=>`<th style="text-align:right;border-bottom:2px solid var(--line);padding:6px;">${c}</th>`).join('')}</tr>`;
  chart.rows.forEach(r=>{
    html += `<tr><td style="padding:6px;border-bottom:1px solid var(--line);font-weight:600;">${r.label}</td>${r.values.map(v=>`<td style="text-align:right;padding:6px;border-bottom:1px solid var(--line);">${v}</td>`).join('')}</tr>`;
  });
  html += '</table>';
  if(chart.unit) html += `<div style="font-size:11px;color:var(--sub);margin-top:6px;">Unit: ${chart.unit}</div>`;
  return html;
}

function processSteps(chart){
  return `<ol style="margin:0;padding-left:20px;font-size:13.5px;line-height:1.9;">${chart.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`;
}

function mapCompare(chart){
  let html = `<table style="width:100%;border-collapse:collapse;font-size:13px;"><tr>${chart.columns.map(c=>`<th style="text-align:left;border-bottom:2px solid var(--line);padding:6px;color:var(--accent);">${c}</th>`).join('')}</tr>`;
  chart.rows.forEach(r=>{
    html += `<tr>${r.map(cell=>`<td style="padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;">${cell}</td>`).join('')}</tr>`;
  });
  html += '</table>';
  return html;
}

function renderChart(item){
  if(!item.chart) return '';
  const wrap = inner => `<div style="background:var(--chip);border-radius:8px;padding:14px;margin-top:10px;">${inner}</div>`;
  switch(item.chart_type){
    case 'line': return wrap(svgLineChart(item.chart));
    case 'bar': return wrap(svgBarChart(item.chart));
    case 'pie': return wrap(svgPieSet(item.chart));
    case 'table': return wrap(htmlTable(item.chart));
    case 'process': return wrap(processSteps(item.chart));
    case 'map': return wrap(mapCompare(item.chart));
    default: return '';
  }
}

/* ---------- writing ---------- */
function renderWriting(){
  const el = document.getElementById('writing-list');
  if(!state.writing){ el.innerHTML='<div class="empty">找不到 writing-bank.json</div>'; return; }
  let html = '<div class="section-title">Task 1 — Academic (click a prompt to see the chart and write)</div>';
  html += (state.writing.task1_academic||[]).map((t,i)=>
    `<div class="prompt-item" style="cursor:pointer;" onclick="openTask1(${i})"><span class="tag">${t.chart_type}</span>${t.prompt}</div>`).join('');

  html += '<div class="section-title">Task 2 — Essay (click a prompt to write)</div>';
  const cats = state.writing.task2_essay || {};
  let idx = 0;
  Object.entries(cats).forEach(([cat, prompts])=>{
    html += `<div class="section-title" style="font-size:13px;color:var(--sub);margin-top:16px;">${cat.replace(/_/g,' ')}</div>`;
    html += prompts.map(p=>{
      const myIdx = idx++;
      return `<div class="prompt-item" style="cursor:pointer;" onclick="openTask2('${cat}',${prompts.indexOf(p)})">${p}</div>`;
    }).join('');
  });
  el.innerHTML = html;
}

let essayTimerId = null;
let essaySecondsLeft = 0;
let taskCtx = null; // { kind:'task1'|'task2', cat, i, minWords, durationMin }

function openTask1(i){
  stopEssayTimer();
  const item = state.writing.task1_academic[i];
  const minWords = 150, durationMin = 20;
  taskCtx = { kind:'task1', i, minWords, durationMin };
  essaySecondsLeft = durationMin*60;
  const el = document.getElementById('writing-list');
  el.innerHTML = `
    <button class="backbtn" onclick="stopEssayTimer();renderWriting()">&larr; Back to Writing list</button>
    <div class="split">
      <div class="passage-box">
        <h3 style="margin-top:0;"><span class="tag">${item.chart_type}</span></h3>
        <p>${item.prompt}</p>
        ${renderChart(item)}
      </div>
      <div class="qbox">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
          <h4 style="margin-top:0;">Your report</h4>
          <span id="timerDisplay" style="font-weight:800;font-size:18px;color:var(--accent);white-space:nowrap;">${fmtTime(essaySecondsLeft)}</span>
        </div>
        <p style="color:var(--sub);font-size:13px;">Write at least ${minWords} words. Spend about ${durationMin} minutes — the timer will auto-submit when it reaches 0.</p>
        <textarea id="essayBox" rows="16"
          autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false"
          style="width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;line-height:1.6;font-family:inherit;"
          placeholder="Describe the chart here…" oninput="updateWordCount(${minWords})"></textarea>
        <div class="submitbar">
          <span class="score" id="wordCount">0 / ${minWords} words</span>
          <button type="button" onclick="finishEssay(false)">Finish &amp; Review</button>
        </div>
      </div>
    </div>
  `;
  startEssayTimer();
}

function openTask2(cat, i){
  stopEssayTimer();
  const prompt = state.writing.task2_essay[cat][i];
  const el = document.getElementById('writing-list');
  const minWords = 250, durationMin = 40;
  taskCtx = { kind:'task2', cat, i, minWords, durationMin };
  essaySecondsLeft = durationMin*60;
  el.innerHTML = `
    <button class="backbtn" onclick="stopEssayTimer();renderWriting()">&larr; Back to Writing list</button>
    <div class="qbox">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
        <h3 style="margin-top:0;">${prompt}</h3>
        <span id="timerDisplay" style="font-weight:800;font-size:18px;color:var(--accent);white-space:nowrap;">${fmtTime(essaySecondsLeft)}</span>
      </div>
      <p style="color:var(--sub);font-size:13px;">Write at least ${minWords} words. Spend about ${durationMin} minutes — the timer will auto-submit when it reaches 0.</p>
      <textarea id="essayBox" rows="16"
        autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false"
        style="width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;line-height:1.6;font-family:inherit;"
        placeholder="Start writing your essay here…" oninput="updateWordCount(${minWords})"></textarea>
      <div class="submitbar">
        <span class="score" id="wordCount">0 / ${minWords} words</span>
        <button type="button" onclick="finishEssay(false)">Finish &amp; Review</button>
      </div>
    </div>
  `;
  startEssayTimer();
}

function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function startEssayTimer(){
  essayTimerId = setInterval(()=>{
    essaySecondsLeft--;
    const d = document.getElementById('timerDisplay');
    if(d) d.textContent = fmtTime(Math.max(0,essaySecondsLeft));
    if(essaySecondsLeft <= 60 && d) d.style.color = 'var(--bad)';
    if(essaySecondsLeft <= 0){
      finishEssay(true);
    }
  }, 1000);
}

function stopEssayTimer(){
  if(essayTimerId){ clearInterval(essayTimerId); essayTimerId = null; }
}

function updateWordCount(min){
  const box = document.getElementById('essayBox');
  if(!box) return;
  const text = box.value.trim();
  const words = text.length ? text.split(/\s+/).length : 0;
  const el = document.getElementById('wordCount');
  el.textContent = `${words} / ${min} words`;
  el.style.color = words>=min ? 'var(--good)' : 'var(--sub)';
}

function finishEssay(autoSubmitted){
  stopEssayTimer();
  const ctx = taskCtx || { kind:'task2', minWords:250 };
  const minWords = ctx.minWords;
  const box = document.getElementById('essayBox');
  const text = box ? box.value.trim() : '';
  const words = text.length ? text.split(/\s+/).length : 0;
  const paragraphs = text.split(/\n\s*\n/).filter(p=>p.trim().length>0).length;
  const linkers = ['however','therefore','moreover','furthermore','in addition','for example','for instance',
    'in conclusion','on the other hand','as a result','consequently','in contrast','firstly','secondly','finally',
    'overall','compared to','compared with','whereas','while','in contrast to'];
  const lowerText = text.toLowerCase();
  const linkersUsed = linkers.filter(l=>lowerText.includes(l));
  const hasNumbers = /\d/.test(text);

  const checks = ctx.kind === 'task1' ? [
    { label: `At least ${minWords} words`, pass: words>=minWords, detail: `${words} words written` },
    { label: 'At least 2 paragraphs (overview + details)', pass: paragraphs>=2, detail: `${paragraphs} paragraph(s) detected` },
    { label: 'Includes specific figures/data from the chart', pass: hasNumbers, detail: hasNumbers ? 'Numbers found in your report' : 'No numbers detected' },
    { label: 'Uses comparison/reporting language', pass: linkersUsed.length>=1, detail: linkersUsed.length ? `Found: ${linkersUsed.join(', ')}` : 'None detected' }
  ] : [
    { label: `At least ${minWords} words`, pass: words>=minWords, detail: `${words} words written` },
    { label: 'At least 4 paragraphs (intro / body / body / conclusion)', pass: paragraphs>=4, detail: `${paragraphs} paragraph(s) detected` },
    { label: 'Uses linking words to connect ideas', pass: linkersUsed.length>=2, detail: linkersUsed.length ? `Found: ${linkersUsed.join(', ')}` : 'None detected' }
  ];

  const el = document.getElementById('writing-list');
  el.innerHTML = `
    <button class="backbtn" onclick="renderWriting()">&larr; Back to Writing list</button>
    <div class="qbox">
      <h3 style="margin-top:0;">${autoSubmitted ? "⏰ Time's up — auto-submitted" : 'Review'}</h3>
      <div class="qgroup">
        <h4>Structure self-check</h4>
        <div class="instr">This is a mechanical check (word count / paragraphs / linking words), not a real IELTS band score — a human or an AI marker is still needed to judge grammar, coherence and task response.</div>
        ${checks.map(c=>`<div class="qitem"><span class="result ${c.pass?'correct':'wrong'}" style="font-size:15px;">${c.pass?'✓':'✗'}</span><span class="qstatement">${c.label} <span style="color:var(--sub);">— ${c.detail}</span></span></div>`).join('')}
      </div>
      <div class="qgroup">
        <h4>Your essay</h4>
        <div style="white-space:pre-wrap;font-size:13.5px;line-height:1.7;background:var(--chip);border-radius:8px;padding:14px;">${text ? text.replace(/</g,'&lt;') : '<span style="color:var(--sub);">(nothing written)</span>'}</div>
      </div>
    </div>
  `;
}

/* ---------- speaking ---------- */
let cueIndex = 0;
function renderSpeaking(){
  const el = document.getElementById('speaking-list');
  if(!state.speaking){ el.innerHTML='<div class="empty">找不到 speaking-bank.json</div>'; return; }
  let html = '<div class="section-title">Part 1 — Pick a topic</div>';
  html += `<div class="chip-row" id="p1chips">${(state.speaking.part1_topics||[]).map((t,i)=>`<span onclick="showPart1(${i})" style="cursor:pointer;">${t.topic}</span>`).join('')}</div>`;
  html += `<div id="p1questions"></div>`;

  html += '<div class="section-title">Part 2 — Cue Cards</div>';
  html += `<button class="flipbtn" onclick="nextCue()">🎴 Draw a random cue card</button>`;
  html += `<div class="cue-card" id="cueCard">${cueCardHTML(state.speaking.part2_cue_cards[0])}</div>`;

  html += '<div class="section-title">Part 3 — Discussion Sets</div>';
  html += (state.speaking.part3_discussion_sets||[]).map(s=>
    `<div class="part3set"><h4>${s.theme}</h4><ul>${s.questions.map(q=>`<li>${q}</li>`).join('')}</ul></div>`).join('');

  el.innerHTML = html;
}
function showPart1(i){
  const t = state.speaking.part1_topics[i];
  document.getElementById('p1questions').innerHTML =
    `<div class="part3set"><h4>${t.topic}</h4><ul>${t.questions.map(q=>`<li>${q}</li>`).join('')}</ul></div>`;
}
function cueCardHTML(card){
  return `<div style="font-weight:700;margin-bottom:8px;">${card.topic}</div>
    <div style="font-size:12.5px;color:var(--sub);margin-bottom:4px;">You should say:</div>
    <ul style="margin:0;padding-left:18px;">${card.points.map(p=>`<li>${p}</li>`).join('')}</ul>`;
}
function nextCue(){
  const cards = state.speaking.part2_cue_cards;
  cueIndex = Math.floor(Math.random()*cards.length);
  document.getElementById('cueCard').innerHTML = cueCardHTML(cards[cueIndex]);
}

init();
</script>
</body>
</html>
